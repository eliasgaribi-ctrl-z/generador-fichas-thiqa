style=\"display:none\">\n        <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:24px 26px;margin-bottom:16px\">\n          <h3 style=\"margin:0;font-family:var(--ttl);font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.02em\">Dicta los domicilios<\u002Fh3>\n          <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">\n            Habla normal, de corrido y de varias casas si quieres: <i>\u201cBoulevard Rep\u00fablica de Honduras 134,\n            Hacienda Santa Fe, Tlajomulco, cuadrilla de Te\u00f3filo, monto sesenta mil, bono quinientos\u201d<\u002Fi>.\n            Al terminar, la IA separa cada domicilio y llena los campos de la ficha. Puedes corregir el\n            texto antes de crearlas, y tambi\u00e9n escribirlo o pegarlo en vez de dictarlo.\n          <\u002Fp>\n          <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:20px\">\n            <button id=\"dicMic\" style=\"display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:14px 22px;border:0;\n              border-radius:14px;background:var(--nar);color:#fff;font-weight:700;font-size:15px;cursor:pointer;\n              box-shadow:var(--shN);transition:transform .16s,filter .16s\" style-hover=\"transform:translateY(-2px)\">\n              <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"2.5\" width=\"6\" height=\"11\" rx=\"3\"><\u002Frect><path d=\"M5.5 11a6.5 6.5 0 0 0 13 0\"><\u002Fpath><path d=\"M12 17.5V21\"><\u002Fpath><\u002Fsvg>\n              <span id=\"dicMicTxt\">Empezar a dictar<\u002Fspan>\n            <\u002Fbutton>\n            <div id=\"dicEstado\" style=\"font-size:13.5px;color:var(--tx3)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <label style=\"display:block;margin-top:18px\">\n            <span style=\"display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--tx3);margin-bottom:6px\">Lo que se oy\u00f3<\u002Fspan>\n            <textarea id=\"dicTexto\" rows=\"6\" placeholder=\"Aqu\u00ed va apareciendo lo que dictes. Tambi\u00e9n puedes escribir o pegar el texto.\"><\u002Ftextarea>\n          <\u002Flabel>\n          <div style=\"display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px\">\n            <button id=\"dicCrear\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:12px 20px;border:0;\n              border-radius:12px;background:var(--azul);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;\n              box-shadow:0 6px 18px rgba(30,74,114,.28);transition:transform .16s\" style-hover=\"transform:translateY(-2px)\">Crear fichas con esto<\u002Fbutton>\n            <button id=\"dicLimpiar\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 14px;border:1px solid transparent;\n              border-radius:11px;background:transparent;color:var(--tx3);font-weight:600;font-size:13px;cursor:pointer;transition:.18s\" style-hover=\"background:var(--surf2);color:var(--tx2)\">Borrar el texto<\u002Fbutton>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <button id=\"dicBorrarTodas\" style=\"display:none;align-items:center;gap:7px;min-height:38px;padding:8px 14px;border:1px solid transparent;\n              border-radius:11px;background:transparent;color:#C45454;font-weight:600;font-size:13px;cursor:pointer;transition:.18s\" style-hover=\"background:var(--surf2)\">Borrar las fichas dictadas<\u002Fbutton>\n          <\u002Fdiv>\n          <div id=\"dicMsg\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);overflow:hidden\">\n          <header style=\"display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--brd);background:var(--surf2)\">\n            <h3 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx);letter-spacing:-.01em\">Tu API key<\u002Fh3>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <div id=\"iaEstadoKey\" style=\"font-size:12.5px;color:var(--tx3)\">\u2014<\u002Fdiv>\n          <\u002Fheader>\n          <div style=\"padding:20px\">\n            <p style=\"margin:0 0 14px;font-size:13px;color:var(--tx2);line-height:1.6;text-wrap:pretty\">\n              Esta p\u00e1gina es un archivo est\u00e1tico: <b style=\"color:var(--tx)\">no hay servidor donde esconder una key<\u002Fb>,\n              as\u00ed que usa la tuya. Se guarda solo en este navegador. Lo que dictes s\u00ed se manda completo al proveedor\n              que elijas, porque de ah\u00ed salen los datos de la ficha; el desenredado de direcciones del Excel, en cambio,\n              sigue mandando nada m\u00e1s la direcci\u00f3n y su ubicaci\u00f3n.\n            <\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin-bottom:14px\">\n              <label style=\"display:block\"><span style=\"display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--tx3);margin-bottom:6px\">Proveedor<\u002Fspan><sc-raw-select id=\"iaProv\"><\u002Fsc-raw-select><\u002Flabel>\n              <label style=\"display:block\"><span style=\"display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--tx3);margin-bottom:6px\">Modelo<\u002Fspan><input type=\"text\" id=\"iaModelo\" placeholder=\"modelo\"><\u002Flabel>\n              <label style=\"display:block\" id=\"iaBaseBox\"><span style=\"display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--tx3);margin-bottom:6px\">URL base<\u002Fspan><input type=\"text\" id=\"iaBase\" placeholder=\"https://api.groq.com/openai/v1\"><\u002Flabel>\n              <label style=\"display:block\"><span style=\"display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--tx3);margin-bottom:6px\">Tu API key<\u002Fspan><span style=\"position:relative;display:block\"><input type=\"password\" id=\"iaKey\" placeholder=\"pega aqu\u00ed tu key\" autocomplete=\"new-password\" name=\"thiqa-api-key\" spellcheck=\"false\" autocapitalize=\"off\" autocorrect=\"off\" data-lpignore=\"true\" data-1p-ignore=\"true\" style=\"padding-right:70px\"><button type=\"button\" id=\"iaVer\" style=\"position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--tx3);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;padding:7px 8px;border-radius:8px\">ver<\u002Fbutton><\u002Fspan><\u002Flabel>\n            <\u002Fdiv>\n            <div id=\"iaDonde\" style=\"font-size:12.5px;color:var(--tx3);line-height:1.6;margin-bottom:14px\"><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n              <button id=\"iaSave\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 14px;border:1px solid var(--brd2);\n                border-radius:11px;background:var(--surf);color:var(--tx2);font-weight:600;font-size:13px;cursor:pointer;transition:.18s\" style-hover=\"border-color:var(--nar);color:var(--nar2)\">Guardar en este navegador<\u002Fbutton>\n              <button id=\"iaProbar\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 14px;border:1px solid var(--brd2);\n                border-radius:11px;background:var(--surf);color:var(--tx2);font-weight:600;font-size:13px;cursor:pointer;transition:.18s\">Probar mi key<\u002Fbutton>\n              <button id=\"iaModelos\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 14px;border:1px solid var(--brd2);\n                border-radius:11px;background:var(--surf);color:var(--tx2);font-weight:600;font-size:13px;cursor:pointer;transition:.18s\" style-hover=\"border-color:var(--nar);color:var(--nar2)\">Ver modelos<\u002Fbutton>\n              <button id=\"iaForget\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 14px;border:1px solid transparent;\n                border-radius:11px;background:transparent;color:var(--tx3);font-weight:600;font-size:13px;cursor:pointer;transition:.18s\" style-hover=\"background:var(--surf2);color:var(--tx2)\">Olvidar mi key<\u002Fbutton>\n            <\u002Fdiv>\n            <div id=\"iaKeyMsg\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"view\" id=\"v-ayuda\" style=\"display:none\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px\">\n          <div style=\"grid-column:1/-1;background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:24px 26px\">\n            <h3 style=\"margin:0;font-family:var(--ttl);font-weight:700;font-size:22px;color:var(--tx);letter-spacing:-.02em\">Cuatro pasos, del Drive al PDF<\u002Fh3>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:20px\">\n              <div style=\"padding:16px;border:1px solid var(--brd);border-radius:13px;background:var(--surf2)\">\n                <div style=\"width:28px;height:28px;border-radius:9px;background:var(--nar);color:#fff;display:grid;place-items:center;\n                  font-family:var(--ttl);font-weight:700;font-size:13px\">1<\u002Fdiv>\n                <b style=\"display:block;margin-top:11px;font-size:14px;color:var(--tx)\">Baja el archivo<\u002Fb>\n                <p style=\"margin:5px 0 0;font-size:13px;color:var(--tx2);line-height:1.6;text-wrap:pretty\">En el Sheet maestro: <i>Archivo \u2192 Descargar \u2192 Microsoft Excel (.xlsx)<\u002Fi>. Trae todo lo que las cuadrillas capturaron en AppSheet.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"padding:16px;border:1px solid var(--brd);border-radius:13px;background:var(--surf2)\">\n                <div style=\"width:28px;height:28px;border-radius:9px;background:var(--nar);color:#fff;display:grid;place-items:center;\n                  font-family:var(--ttl);font-weight:700;font-size:13px\">2<\u002Fdiv>\n                <b style=\"display:block;margin-top:11px;font-size:14px;color:var(--tx)\">S\u00fabelo y revisa<\u002Fb>\n                <p style=\"margin:5px 0 0;font-size:13px;color:var(--tx2);line-height:1.6;text-wrap:pretty\">La app sola busca la hoja de los domicilios, la fila de encabezados y a qu\u00e9 campo va cada columna. T\u00fa nada m\u00e1s corriges lo que no acert\u00f3, y se recuerda para la pr\u00f3xima.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"padding:16px;border:1px solid var(--brd);border-radius:13px;background:var(--surf2)\">\n                <div style=\"width:28px;height:28px;border-radius:9px;background:var(--nar);color:#fff;display:grid;place-items:center;\n                  font-family:var(--ttl);font-weight:700;font-size:13px\">3<\u002Fdiv>\n                <b style=\"display:block;margin-top:11px;font-size:14px;color:var(--tx)\">Elige los domicilios<\u002Fb>\n                <p style=\"margin:5px 0 0;font-size:13px;color:var(--tx2);line-height:1.6;text-wrap:pretty\">Llegan prendidas las que traen convenio confirmado \u2014<b style=\"color:var(--tx)\">Pr\u00f3ximas Recuperaciones<\u002Fb> y <b style=\"color:var(--tx)\">Recuperadas<\u002Fb>\u2014; los dem\u00e1s estatus vienen apagados y se prenden con su casilla. Afina por cartera, cuadrilla o ruta, y palomea los que quieres imprimir.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"padding:16px;border:1px solid var(--brd);border-radius:13px;background:var(--surf2)\">\n                <div style=\"width:28px;height:28px;border-radius:9px;background:var(--nar);color:#fff;display:grid;place-items:center;\n                  font-family:var(--ttl);font-weight:700;font-size:13px\">4<\u002Fdiv>\n                <b style=\"display:block;margin-top:11px;font-size:14px;color:var(--tx)\">Ajusta y genera<\u002Fb>\n                <p style=\"margin:5px 0 0;font-size:13px;color:var(--tx2);line-height:1.6;text-wrap:pretty\">En <i>Editar ficha<\u002Fi> cambias montos, fechas y responsables. En la barra de abajo eliges qu\u00e9 documento quieres \u2014<b style=\"color:var(--tx)\">ficha de seguimiento<\u002Fb> o <b style=\"color:var(--tx)\">car\u00e1tula de expediente<\u002Fb>\u2014 y <i>Generar PDF<\u002Fi> lo saca.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">Sin Excel: dictar<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">En <b style=\"color:var(--tx)\">Dictar<\u002Fb> hablas de corrido \u2014hasta varias casas seguidas\u2014 y la IA separa cada domicilio y llena los campos. Las fichas que salen de ah\u00ed se juntan con las del Excel: se filtran, se editan y se imprimen igual, y entran con el estatus <b style=\"color:var(--tx)\">Dictada<\u002Fb> para que las distingas. Se quedan guardadas en este navegador aunque cierres la p\u00e1gina. Necesita tu API key y funciona en Chrome o Edge; si tu navegador no dicta, escribe o pega el texto y sirve igual.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">Los dos documentos<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">De la misma selecci\u00f3n salen dos cosas distintas, y se elige en la barra de abajo. La <b style=\"color:var(--tx)\">ficha de seguimiento<\u002Fb> es la de siempre: hoja completa por domicilio, con expediente, dinero y las seis etapas para firmar. La <b style=\"color:var(--tx)\">car\u00e1tula de expediente<\u002Fb> es la portada de la carpeta f\u00edsica: media hoja, <b style=\"color:var(--tx)\">dos por hoja carta<\u002Fb> con l\u00ednea punteada para cortarlas, y trae nada m\u00e1s lo que se lee de canto en el archivero \u2014domicilio, fuente, cuadrilla, ruta, monto y las fechas de desocupaci\u00f3n y convenio\u2014 m\u00e1s las casillas de lo que debe ir dentro de la carpeta, y un <b style=\"color:var(--tx)\">c\u00f3digo QR<\u002Fb> que abre la carpeta de ese folio en Drive. No pide ninguna columna nueva: sale del mismo Excel.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">El QR de la car\u00e1tula<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">Se escanea con la c\u00e1mara del celular, parado frente al archivero, y abre la carpeta de ese folio en Drive sin tener que buscarlo en el Sheet. Sale de la liga que el Sheet ya trae y <b style=\"color:var(--tx)\">se dibuja aqu\u00ed mismo, sin internet<\u002Fb>: tu liga no sale de esta computadora. Lleva siempre al <b style=\"color:var(--tx)\">expediente digital<\u002Fb>, que es la carpeta del folio, y abajo del c\u00f3digo lo dice. Si una casa no trae liga, esa car\u00e1tula sale sin QR.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">La liga del mapa<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">Cada ficha sale con el <b style=\"color:var(--tx)\">C\u00f3mo llegar<\u002Fb> ligado: si el Sheet ya tra\u00eda la liga de Maps en la celda, se respeta \u00e9sa; si no, se arma sola con el domicilio, la colonia, el C.P. y el municipio. No cuesta nada ni sale nada de tu navegador. En el PDF la liga sigue viva: desde el celular abre el mapa.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">Desenredar direcciones con IA<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">Es opcional y sirve para las direcciones que llegan pegadas, tipo <i>AV BOGOTA275SANTA FE00630TLAJOMULCO<\u002Fi>. Como esta p\u00e1gina no tiene servidor, <b style=\"color:var(--tx)\">no hay d\u00f3nde esconder una API key<\u002Fb>: pones la tuya y se guarda solo en este navegador. De cada domicilio sale <b style=\"color:var(--tx)\">nada m\u00e1s la direcci\u00f3n, colonia, C.P., municipio y estado<\u002Fb> \u2014 nunca el nombre, el cr\u00e9dito, el expediente ni los montos. Lo que reescriba queda marcado como edici\u00f3n tuya y puedes deshacerlo.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">Dictar por voz<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">Los campos de texto traen micr\u00f3fono. P\u00edcalo, habla, y el texto se escribe solo. Necesita internet y permiso del navegador; funciona en Chrome y Edge.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">Al guardar el PDF<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">Se abre el cuadro de impresi\u00f3n: en <b style=\"color:var(--tx)\">Destino<\u002Fb> elige <b style=\"color:var(--tx)\">Guardar como PDF<\u002Fb>, deja <b style=\"color:var(--tx)\">M\u00e1rgenes: Ninguno<\u002Fb> y activa <b style=\"color:var(--tx)\">Gr\u00e1ficos de fondo<\u002Fb>. Si no, los recuadros salen en blanco.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">Ojo con las f\u00f3rmulas<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">Google Sheets a veces exporta las columnas de f\u00f3rmula sin el resultado y llegan vac\u00edas. Si la app te avisa, en el Sheet copia esas columnas y usa <i>Editar \u2192 Pegado especial \u2192 Pegar solo valores<\u002Fi> antes de descargar.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">D\u00f3nde se guarda lo que escribes<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">Solo en este navegador y en esta computadora. Si borras los datos del navegador o abres la app en otro equipo, esas ediciones no est\u00e1n. Lo que viene del Sheet siempre se vuelve a leer del archivo.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"savebar\" style=\"position:fixed;left:calc(var(--side) + 24px);right:24px;bottom:18px;z-index:70;\n  background:color-mix(in srgb,var(--surf) 88%,transparent);backdrop-filter:blur(16px) saturate(1.5);\n  border:1px solid var(--brd);border-radius:18px;padding:12px 18px;box-shadow:var(--sh2);\n  transform:translateY(160%);opacity:0;transition:transform .42s cubic-bezier(.34,1.15,.5,1),opacity .3s\">\n  <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap\">\n    <div style=\"width:40px;height:40px;border-radius:12px;background:var(--narL);display:grid;place-items:center;flex:none\">\n      <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--nar2)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 2h9l5 5v15H6z\"><\u002Fpath><path d=\"M15 2v5h5\"><\u002Fpath><path d=\"M9.5 13.5h5M9.5 17h5\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3)\">Listas para imprimir<\u002Fdiv>\n      <div style=\"font-family:var(--ttl);font-weight:700;font-size:21px;color:var(--tx);font-variant-numeric:tabular-nums;letter-spacing:-.02em\">\n        <span id=\"nsel\">0<\u002Fspan> <span id=\"nselTxt\" style=\"font-size:14px;font-weight:600;color:var(--tx3)\">fichas<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <div id=\"doctipoBox\">\n      <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);\n        margin-bottom:5px\">Qu\u00e9 se va a imprimir<\u002Fdiv>\n      <div id=\"doctipo\" style=\"display:inline-flex;gap:3px;padding:3px;border:1px solid var(--brd2);border-radius:13px;\n        background:var(--surf2)\">\n        <button class=\"doctab\" data-doc=\"ficha\" data-on=\"1\">Ficha de seguimiento<\u002Fbutton>\n        <button class=\"doctab\" data-doc=\"caratula\" data-on=\"0\">Car\u00e1tula de expediente<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <button id=\"btnEditar\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:12px 18px;\n      border:1px solid var(--azul);border-radius:13px;background:transparent;color:var(--azul);font-weight:700;font-size:14px;\n      cursor:pointer;transition:.18s\" style-hover=\"background:var(--azulL)\">Revisar una por una<\u002Fbutton>\n    <button id=\"btnpdf\" style=\"display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:12px 24px;border:0;\n      border-radius:13px;background:var(--nar);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;box-shadow:var(--shN);\n      transition:transform .16s,box-shadow .16s\" style-hover=\"transform:translateY(-2px);box-shadow:0 12px 30px rgba(240,126,34,.45)\" style-active=\"transform:translateY(0)\">\n      <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9V3h12v6\"><\u002Fpath><path d=\"M6 18H4v-6h16v6h-2\"><\u002Fpath><path d=\"M6 14h12v7H6z\"><\u002Fpath><\u002Fsvg>\n      Generar PDF<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"modal\" style=\"position:fixed;inset:0;background:rgba(10,24,38,.55);backdrop-filter:blur(6px);z-index:120;\n  display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s\">\n  <div id=\"modalBox\" style=\"background:var(--surf);max-width:640px;width:100%;max-height:86vh;overflow:auto;border-radius:18px;\n    border:1px solid var(--brd);box-shadow:var(--sh2);transform:scale(.94) translateY(14px);transition:transform .3s cubic-bezier(.34,1.2,.5,1)\">\n    <header style=\"display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--brd)\">\n      <h3 id=\"mTitle\" style=\"margin:0;font-family:var(--ttl);font-size:18px;font-weight:700;color:var(--tx)\">C\u00f3mo se usa<\u002Fh3>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <button id=\"mClose\" style=\"width:36px;height:36px;border:0;border-radius:10px;background:var(--surf2);color:var(--tx2);\n        cursor:pointer;display:grid;place-items:center;transition:.18s\" style-hover=\"background:var(--narL);color:var(--nar2)\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fheader>\n    <div id=\"mBody\" style=\"padding:22px\"><\u002Fdiv>\n    <footer style=\"padding:16px 22px;border-top:1px solid var(--brd);text-align:right\">\n      <button id=\"mOk\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:11px 22px;border:0;border-radius:12px;\n        background:var(--azul);color:#fff;font-weight:700;font-size:14px;cursor:pointer;transition:.18s\" style-hover=\"filter:brightness(1.12)\">Entendido<\u002Fbutton>\n    <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"velo\" style=\"position:fixed;inset:0;z-index:190;background:rgba(8,20,32,.55);opacity:0;pointer-events:none;transition:opacity .3s\"><\u002Fdiv>\n\n<div id=\"toasts\" style=\"position:fixed;top:18px;right:18px;z-index:300;display:flex;flex-direction:column;gap:10px;pointer-events:none\"><\u002Fdiv>\n\n<div id=\"printarea\"><\u002Fdiv>\n\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;acento&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F07E22&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#F07E22&quot;,&quot;#E8892B&quot;,&quot;#D9534F&quot; d);\n    this.aplicaProps();\n\n    const $ = id => document.getElementById(id);\n    const esc = s => String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n    const LOGO = window.THIQA_LOGO || '';\n\n    /* ---------- toasts ---------- */\n    function toast(msg, tipo){\n      const box = $('toasts'); if (!box) return;\n      const col = tipo === 'err' ? '#C45454' : tipo === 'ok' ? 'var(--ok)' : 'var(--nar)';\n      const el = document.createElement('div');\n      el.style.cssText = 'pointer-events:auto;max-width:340px;background:var(--surf);border:1px solid var(--brd);' +\n        'border-left:4px solid ' + col + ';border-radius:13px;box-shadow:var(--sh2);padding:13px 16px;' +\n        'font-size:13.5px;color:var(--tx);line-height:1.5;animation:tq-slide .34s cubic-bezier(.2,.7,.3,1) both';\n      el.innerHTML = msg;\n      box.appendChild(el);\n      setTimeout(() => { el.style.transition = 'opacity .3s,transform .3s';\n        el.style.opacity = '0'; el.style.transform = 'translateX(24px)';\n        setTimeout(() => el.remove(), 320); }, 3400);\n    }\n\n    /* ---------- campos de la ficha ---------- */\n    const GRUPOS = [\n      { t:'Encabezado', open:true, f:[\n        ['FOLIO','N\u00b0 Folio','t',['folio thiqa','folio','no folio','numero de folio','id']],\n        ['CARTERA','Cartera / Proyecto','t',['fuente','cartera','proyecto','origen','base']],\n        ['RUTA','Ruta','t',['no, ruta','no. ruta','no ruta','ruta','num ruta','numero de ruta']],\n        ['ORDEN_VISITA','Orden de visita','t',['orden visita','orden de visita','no visita','orden']],\n        ['FECHA','Fecha de la ficha','f',['fecha','fecha ficha','f. ficha','fecha de emision']],\n        ['ESTATUS','Estatus','t',['estatus ruta','estatus recup.','estatus recuperacion','estatus','status','estado']],\n      ]},\n      { t:'Datos de la casa', open:true, f:[\n        ['DOMICILIO','Domicilio','t',['direccion','domicilio','direcci\u00f3n','calle','ubicacion',' \n      { t:'Etapa 4 \u00b7 Avance de obra', open:false, f:[\n        ['E4_RESP','Responsable','t',['e4 responsable','responsable obra']],\n        ['E4_FECHA','Fecha','f',['e4 fecha','fecha avance obra']],\n        ['E4_FIRMA','Firma','t',['e4 firma']],\n      ]},\n      { t:'Etapa 5 \u00b7 Supervisi\u00f3n del encargado', open:false, f:[\n        ['E5_RESP','Responsable','t',['e5 responsable','supervisor','encargado']],\n        ['E5_FECHA','Fecha','f',['e5 fecha','fecha supervision']],\n        ['E5_FIRMA','Firma','t',['e5 firma']],\n      ]},\n      { t:'Etapa 6 \u00b7 Entrega de honorarios', open:false, f:[\n        ['E6_FECHA','Fecha','f',['f. pago honorarios','pago honorarios prog.','e6 fecha','fecha honorarios']],\n        ['E6_CANTIDAD','Cantidad','n',['e6 cantidad','cantidad honorarios','monto honorarios']],\n        ['E6_FIRMA','Nombre y firma','t',['e6 firma','firma honorarios']],\n      ]},\n      { t:'Control', open:false, f:[\n        ['ACTUALIZADO_POR','Actualizado por','t',['actualizado por','capturo','responsable de captura']],\n        ['ULTIMA_ACTUALIZACION','\u00daltima actualizaci\u00f3n','f',['ultima actualizacion','ultima_actualizacion','fecha actualizacion']],\n      ]},\n    ];\n    const CAMPOS = GRUPOS.flatMap(g => g.f.map(x => x[0]));\n    const TIPO = Object.fromEntries(GRUPOS.flatMap(g => g.f.map(x => [x[0], x[2]])));\n    const MONEY_FIELDS = new Set(CAMPOS.filter(k => TIPO[k] === 'n'));\n\n    const norm = s => String(s ?? '').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')\n      .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();\n\n    /* Dos pasadas globales: primero se reparten TODOS los nombres que\n       coinciden exactos y hasta despu\u00e9s se intenta el parecido. Si fuera una\n       sola pasada por campo, un alias corto como \"monto\" se robar\u00eda\n       \"MONTO HONORARIOS\" antes de que le tocara su turno a Honorario fijo. */\n    function adivinar(headers){\n      const H = headers.map(norm), map = {}, usadas = new Set();\n      const CAMPOS_AL = GRUPOS.flatMap(g => g.f.map(x => [x[0], x[3].map(norm)]));\n\n      for (const [key, alias] of CAMPOS_AL){\n        for (const na of alias){\n          const i = H.findIndex((h,ix) => h === na && !usadas.has(ix));\n          if (i >= 0){ map[key] = i; usadas.add(i); break; }\n        }\n      }\n      for (const [key, alias] of CAMPOS_AL){\n        if (map[key] !== undefined) continue;\n        for (const na of alias){\n          if (na.length < 5) continue;\n          const i = H.findIndex((h,ix) => h && !usadas.has(ix) && (' '+h+' ').includes(' '+na+' '));\n          if (i >= 0){ map[key] = i; usadas.add(i); break; }\n        }\n      }\n      return map;\n    }\n\n    const pad = n => String(n).padStart(2,'0');\n    const fmtFecha = d => pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear();\n    const fmtMoney = n => '$' + n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});\n\n    function toNumber(v){\n      if (typeof v === 'number') return v;\n      if (v instanceof Date) return NaN;\n      const s = String(v ?? '').replace(/[^0-9.,\\-]/g,'').replace(/,/g,'');\n      const n = parseFloat(s);\n      return isNaN(n) ? NaN : n;\n    }\n    function fmt(v, campo){\n      if (v === null || v === undefined || v === '') return '';\n      if (v instanceof Date) return fmtFecha(v);\n      if (typeof v === 'number')\n        return MONEY_FIELDS.has(campo) ? fmtMoney(v)\n          : (Number.isInteger(v) ? String(v) : String(Math.round(v*100)/100));\n      const s = String(v).trim();\n      if (['#N/A','#REF!','#VALUE!','null','undefined'].includes(s)) return '';\n      if (MONEY_FIELDS.has(campo)){\n        const n = toNumber(s);\n        if (!isNaN(n) && /\\d/.test(s)) return fmtMoney(n);\n      }\n      return s;\n    }\n    const clip = (s, max) => { s = String(s); return s.length > max ? s.slice(0, max-1) + '\u2026' : s; };\n\n    /* ---------- estado ---------- */\n    /* doc: qu\u00e9 documento se est\u00e1 armando, la ficha de seguimiento o la car\u00e1tula\n       del expediente f\u00edsico. Cambia la vista previa, el editor y el PDF; los\n       datos y la selecci\u00f3n son los mismos para los dos. */\n    const S = { rows:[], headers:[], todas:[], dictadas:[], data:[], map:{}, sel:new Set(),\n                estatusOff:new Set(), ov:{}, fotos:{}, cur:0, wb:null, zoom:.62, obra:[], doc:'ficha' };\n    /* Una ficha solo tiene caso cuando el convenio ya est\u00e1 confirmado, y eso son\n       dos estatus: pr\u00f3xima recuperaci\u00f3n y recuperada. Esos llegan prendidos; todo\n       lo dem\u00e1s llega apagado en el filtro, no descartado, as\u00ed que si de veras\n       hace falta una ficha basta prender su casilla. Se compara contra norm(),\n       que ya quit\u00f3 acentos y dej\u00f3 la puntuaci\u00f3n en espacios: \"Pr\u00f3x. Recuperaci\u00f3n\"\n       llega aqu\u00ed como \"prox recuperacion\". */\n    const CON_CONVENIO = /^(?:prox|proximas?)? ?recupera(?:d[ao]s?|cion(?:es)?)$/;\n    const LSKEY = 'thiqa_fichas_v2';\n    /* Una fila dictada no sale de ninguna columna: trae sus valores encima. */\n    const crudo = (r,k) => r.__dict\n      ? fmt(r.__dict[k], k)\n      : (S.map[k] === undefined ? '' : fmt(r[S.map[k]], k));\n    function llave(r){\n      if (r.__id) return r.__id;\n      const f = norm(crudo(r,'FOLIO')), d = norm(crudo(r,'DOMICILIO'));\n      if (f || d) return (f && d) ? f + '|' + d : (f || d);\n      /* Sin folio ni domicilio no hay con qu\u00e9 distinguir una casa de otra. Antes\n         todas ca\u00edan en la misma llave fija y lo que escrib\u00edas en una ficha se\n         copiaba a las 214. El rengl\u00f3n del que sali\u00f3 la fila s\u00ed es \u00fanico, as\u00ed que\n         de perdido las ediciones se quedan cada una en lo suyo. */\n      return r.__fila !== undefined ? 'fila' + r.__fila : 'fila';\n    }\n    /* Lo que trae el archivo para un campo, ya sin las ediciones a mano.\n\n       El domicilio bueno vive en la columna Link, no en DOMICILIO: en el Sheet\n       esa celda guarda el texto de la direcci\u00f3n ya corregida y la URL de Maps\n       cuelga aparte, mientras que DOMICILIO es la que llega pegada o ilegible\n       (\"AV TEMUCO286SANTA FE00630TLAJOMULCO\"). Se usa el texto de Link cuando lo\n       hay; si esa celda trae una URL como texto no sirve de direcci\u00f3n y manda\n       DOMICILIO. Ojo: llave() sigue calcul\u00e1ndose con crudo(), para que las\n       ediciones guardadas antes de este cambio no pierdan su fila. */\n    function base(r,k){\n      if (k === 'DOMICILIO'){\n        const t = String(crudo(r,'MAPA') || '').trim();\n        if (t && !/^https?:\\/\\//i.test(t)) return t;\n      }\n      return crudo(r,k) || liga(r,k) || valorObra(r,k);\n    }\n    function valor(r,k){\n      const o = S.ov[llave(r)];\n      if (o && o[k] !== undefined && o[k] !== null) return o[k];\n      return base(r,k);\n    }\n    /* La URL de una celda no vive en la celda: el Excel la guarda aparte y el\n       lector la deja en __links. Sin esto, la columna LINK sale como texto y\n       la liga de Maps se pierde al imprimir. */\n    function liga(r,k){\n      const ci = S.map[k], L = S.rows && S.rows.__links;\n      if (ci === undefined || r.__fila === undefined || !L) return '';\n      return (L[r.__fila] && L[r.__fila][ci]) || '';\n    }\n\n    /* Foto de perfil de cada l\u00edder de cuadrilla, para que la ficha la ponga sola\n       en vez de andarla subiendo domicilio por domicilio.\n\n       La llave es el nombre ya normalizado (sin acentos ni may\u00fasculas) y el valor\n       es la foto como data URI, porque la ficha se imprime desde el navegador y\n       tiene que llevar la imagen dentro: una liga a Drive no se ve al imprimir y\n       encima depender\u00eda de internet.\n\n       Para dar de alta a alguien: agrega su nombre en min\u00fasculas y sin acentos,\n       con la foto ya recortada en cuadrado. Con el valor vac\u00edo la ficha deja el\n       c\u00edr efZw4cVVppNhUcSKE2QeaktWDST0IRqHWLMwIUlbOXbL41Qj0jBppDDaG20JbbQAlKEiwSBwAEZwIEVFoIECBAAIECBAAIECBAAIECBAAIECBAB//Z',\n    };\n\n    /* El Sheet trae la cuadrilla con el n\u00famero de ruta pegado adelante\n       (\"1-Tony Mares\"), y a veces con el apellido de m\u00e1s o de menos, as\u00ed que no\n       sirve comparar de golpe: se busca el nombre del cat\u00e1logo DENTRO del valor\n       normalizado. Se queda con la coincidencia m\u00e1s larga para que un cat\u00e1logo\n       con dos \"Tony\" distintos no se resuelva por orden de declaraci\u00f3n. */\n    function fotoLider(r){\n      const v = norm(valor(r,'LIDER'));\n      if (!v) return '';\n      let mejor = '';\n      for (const nombre in FOTOS_LIDER){\n        if (FOTOS_LIDER[nombre] && v.includes(nombre) && nombre.length > mejor.length) mejor = nombre;\n      }\n      return mejor ? FOTOS_LIDER[mejor] : '';\n    }\n\n    /* ---------- control de obra (tapeados) ----------\n\n       El \u00e1rea de obras lleva su propio Excel y ah\u00ed no hay folio: lo \u00fanico que\n       une las dos tablas es la direcci\u00f3n, y no viene escrita igual \u2014\"CERRO LA\n       CRUZ 157 M-1\" contra \"Cerro de la Cruz 157\"\u2014. Se compara por n\u00famero de\n       casa m\u00e1s las palabras de la calle, tirando el relleno (\"de\", \"la\", \"av\").\n\n       El domicilio de la bit\u00e1cora arrastra una cola, y la cola trae n\u00fameros que\n       no son el de la casa: el C.P. que viene en el texto de la liga de Maps\n       (\"Cerro la Cruz 157, Chulavista, 45653 Hacienda Santa Fe, Jal.\") y el\n       dato catastral de la cartera (\"CERRO LA ATALAYA 333 NA MZ 17 LT 39 EDIF\n       NA NIV 03\"). Quedarse con el \u00faltimo n\u00famero del rengl\u00f3n emparejaba por\n       C.P. o por nivel \u2014o sea, casi nunca\u2014, as\u00ed que primero se corta lo que va\n       despu\u00e9s de la primera coma, se tiran los tokens catastrales y las notas\n       entre par\u00e9ntesis, y lo que sobrevive se compara contra TODOS los n\u00fameros\n       que queden: \"Cerro de las 7 Gotas 179\" trae dos y el 7 es parte del\n       nombre de la calle. Exigir el n\u00famero es lo que evita confundir \"Atalaya\n       336\" con \"Atalaya 333\", que est\u00e1n las dos en el archivo, y cortar la cola\n       es lo que evita que \"Estel\u00ed 143\" se quede con el material de\n       \"Montevideo 143\". */\n    const OBRA_RUIDO = new Set(['de','la','el','los','las','del','av','avenida','calle','c','priv',\n                                'privada','cto','circuito','blvd','boulevard','no','num','numero',\n                                'casa','ntra','nuestra','sra','senora']);\n    /* La cola catastral de la cartera: \"NA MZ 17 LT 39 EDIF NA NIV 03\", m\u00e1s el\n       \"M-1\"/\"L 3\" que a veces trae pegado el n\u00famero de casa. */\n    const OBRA_COLA = /\\b(?:na|smz|mz|mza|manzana|lt|lote|edif|edificio|niv|nivel|int|interior|depto|dpto|departamento|[ml])\\b\\s*\\d*/g;\n    function claveDir(d){\n      const t = norm(String(d ?? '').replace(/\\([^)]*\\)/g, ' ').split(',')[0])\n        .replace(OBRA_COLA, ' ').replace(/\\s+/g, ' ').trim();\n      /* Cinco d\u00edgitos es un C.P., no un n\u00famero de casa. */\n      const nums = (t.match(/\\b\\d+\\b/g) || []).filter(n => n.length !== 5);\n      return {\n        nums,\n        pal: new Set(t.split(' ').filter(w => w && !OBRA_RUIDO.has(w) && !/^\\d+$/.test(w))),\n      };\n    }\n    function mismaDir(a, b){\n      const x = claveDir(a), y = claveDir(b);\n      if (!x.nums.length || !x.nums.some(n => y.nums.indexOf(n) >= 0)) return false;\n      let comun = 0;\n      for (const w of x.pal) if (y.pal.has(w)) comun++;\n      return comun > 0 && comun >= Math.min(x.pal.size, y.pal.size) * 0.6;\n    }/* La columna de material es texto libre, un rengl\u00f3n por compra:\n       \"-260 blocks (12x14x28) ($1,560.00)\". Se lee la cantidad de adelante y el\n       material por palabra clave; las medidas del block (12x14x28) se quitan\n       antes para que no se confundan con la cantidad. Un rengl\u00f3n sin cantidad\n       al inicio no se adivina: se anota aparte y se llena a mano. */\n    const OBRA_MAT = [['block','CANT_BLOCK'], ['arena','CANT_ARENA'], ['cemento','CANT_CEMENTO'],\n                      ['estuco','CANT_ESTUCO'], ['varilla','CANT_VARILLA']];\n    const OBRA_UNID = ['saco','tramo','bulto','kilo','metro','bote','cubeta'];\n    const OBRA_PLURAL = { saco:'sacos', tramo:'tramos', bulto:'bultos', kilo:'kilos',\n                          metro:'metros', bote:'botes', cubeta:'cubetas' };\n    function obraMateriales(txt, acum, sueltas){\n      for (const ln of String(txt || '').split('\\n')){\n        const n = norm(ln);\n        if (!n) continue;\n        const m = n.match(/^(\\d+(?:\\.\\d+)?)\\s+(.*)$/);\n        const limpia = ln.replace(/^[\\s\\-\u2013]+/, '').trim();\n        if (!m){ if (limpia) sueltas.push(limpia); continue; }\n        const resto = m[2].replace(/\\d+\\s*x\\s*\\d+(\\s*x\\s*\\d+)?/g, ' ');\n        const par = OBRA_MAT.find(p => resto.indexOf(p[0]) >= 0);\n        if (!par){ if (limpia) sueltas.push(limpia); continue; }\n        const u = OBRA_UNID.find(x => resto.indexOf(x) >= 0) || 'pz';\n        const a = acum[par[1]] || (acum[par[1]] = {});\n        a[u] = (a[u] || 0) + parseFloat(m[1]);\n      }\n    }\n    /* \"260 pz\", \"10 sacos\", \"1 tramo\". Si una misma compra mezcl\u00f3 unidades se\n       imprimen las dos en vez de sumar peras con manzanas. */\n    function obraCantidad(porUnidad){\n      return Object.keys(porUnidad).map(u => {\n        const n = Math.round(porUnidad[u] * 100) / 100;\n        return n + ' ' + (n === 1 || u === 'pz' ? u : (OBRA_PLURAL[u] || u));\n      }).join(' + ');\n    }\n    /* \"Fachada / -Puerta / -Ventana / Posterior / -Ventana\" son dos renglones,\n       no cinco: el que no trae guion es el encabezado del grupo. */\n    function obraElementos(txt){\n      const out = [];\n      for (const ln of String(txt || '').split('\\n')){\n        const t = ln.trim();\n        if (!t) continue;\n        if (/^[\\-\u2013]/.test(t)){\n          const item = t.replace(/^[\\-\u2013]\\s*/, '');\n          if (out.length) out[out.length - 1] += (/:/.test(out[out.length - 1]) ? ', ' : ': ') + item;\n          else out.push(item);\n        } else out.push(t);\n      }\n      return out;\n    }\n\n    /* Una vivienda puede traer m\u00e1s de un rengl\u00f3n: el tapeo y su retapeo. Se\n       suman en una sola ficha \u2014cantidades y gasto\u2014 y se deja dicho en la nota,\n       porque si no el total impreso no cuadrar\u00eda con ninguno de los dos. */\n    function indexarObra(filas, ci){\n      const out = [];\n      for (const f of filas){\n        const dir = String(f[ci.dir] ?? '').trim();\n        if (!dir) continue;\n        let reg = out.find(x => mismaDir(x.dir, dir));\n        if (!reg){ reg = { dir, mats:{}, sueltas:[], total:0, elementos:[], partes:0 }; out.push(reg); }\n        reg.partes++;\n        obraMateriales(f[ci.mat], reg.mats, reg.sueltas);\n        const g = toNumber(f[ci.gasto]);\n        if (!isNaN(g)) reg.total += g;\n        for (const e of obraElementos(f[ci.elem])) if (reg.elementos.indexOf(e) < 0) reg.elementos.push(e);\n      }\n      return out;\n    }\n\n    /* Los encabezados del control de obra van en su propio rengl\u00f3n (en el\n       archivo que dio obras, el 3), as\u00ed que se busca la fila que traiga a la\n       vez la ubicaci\u00f3n y el material en lugar de dar por hecho la primera. */\n    function columnasObra(filas){\n      for (let i = 0; i < Math.min(filas.length, 30); i++){\n        const h = (filas[i] || []).map(norm);\n        /* Por prioridad y no de corrido: la columna \"VIVIENDA\" de este archivo\n           trae el ordinal (\"1ra\", \"2da\"), no la direcci\u00f3n, as\u00ed que buscar\n           cualquiera de las dos a la vez se quedaba con la equivocada y ninguna\n           ficha empataba. */\n        const busca = (...alt) => {\n          for (const a of alt){ const j = h.findIndex(x => x.indexOf(a) >= 0); if (j >= 0) return j; }\n          return -1;\n        };\n        const dir = busca('ubicacion', 'domicilio', 'direccion');\n        const mat = h.findIndex(x => x === 'material' || x.indexOf('material') === 0);\n        if (dir >= 0 && mat >= 0){\n          return { hr:i, dir, mat, gasto: busca('gasto de material','gasto material','gasto'),\n                   elem: busca('elementos a tapear','elementos','tapear') };\n        }\n      }\n      return null;\n    }\n\n    async function cargarObra(f){\n      const ext = f.name.split('.').pop().toLowerCase();\n      let filas = null;\n      if (ext === 'csv' || ext === 'txt') filas = window.parseCSV(await f.text());\n      else {\n        const wb = await window.XLSXReader.parse(await f.arrayBuffer());\n        for (let i = 0; i < wb.sheets.length; i++){\n          let rows;\n          try { rows = await wb.readSheet(i); } catch(e){ continue; }\n          if (columnasObra(rows)){ filas = rows; break; }\n        }\n        if (!filas && wb.sheets.length) filas = await wb.readSheet(0);\n      }\n      const ci = filas && columnasObra(filas);\n      if (!ci) throw new Error('No encontr\u00e9 las columnas de ubicaci\u00f3n y material.');\n      S.obra = indexarObra(filas.slice(ci.hr + 1), ci);\n      return S.obra.length;\n    }\n\n    /* Lo que el control de obra tiene para este domicilio, o null. */\n    function obraDe(r){\n      if (!S.obra || !S.obra.length) return null;\n      const d = valor(r,'DOMICILIO');\n      if (!d) return null;\n      return S.obra.find(o => mismaDir(d, o.dir)) || null;\n    }\n    /* Solo se consulta cuando el Excel de fichas no trae nada para ese campo:\n       lo capturado a mano y lo que venga de la bit\u00e1cora siempre mandan. */\n    function valorObra(r,k){\n      const o = obraDe(r);\n      if (!o) return '';\n      if (k === 'TOTAL_MATERIALES') return o.total ? fmtMoney(o.total) : '';\n      if (k === 'NOTA_OBRA'){\n        const n = [];\n        if (o.partes > 1) n.push('Incluye ' + o.partes + ' intervenciones (tapeo y retapeo), sumadas.');\n        if (o.sueltas.length) n.push('Sin desglosar: ' + o.sueltas.join('; ') + '.');\n        return n.join(' ');\n      }\n      if (/^TAPEO_([1-9])$/.test(k)) return o.elementos[+k.slice(6) - 1] || '';\n      if (o.mats[k]) return obraCantidad(o.mats[k]);\n      return '';\n    }\n\n    /* Domicilio completo en una l\u00ednea, para imprimir y para buscar en el mapa. */\n    function dirCompleta(r){\n      return [valor(r,'DOMICILIO'), valor(r,'COLONIA'), valor(r,'CP'),\n              valor(r,'MUNICIPIO'), valor(r,'ENTIDAD')].filter(Boolean).join(', ');\n    }\n    /* La liga del mapa se arma sola a partir del domicilio: s\u00f3lo 45 de 201 filas\n       traen la liga puesta en el Sheet, y la b\u00fasqueda por texto de Google Maps\n       resuelve el resto sin pedirle nada a nadie. Manda la liga real de la celda\n       cuando existe, porque \u00e9sa ya la verific\u00f3 una persona. */\n    function mapaUrl(r){\n      const propio = String(valor(r,'MAPA') || '').trim();\n      if (/^https?:\\/\\//i.test(propio)) return propio;\n      const l = liga(r,'MAPA');\n      if (l) return l;\n      const txt = propio || dirCompleta(r);\n      return txt ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(txt) : '';\n    }\n    const editado = r => { const o = S.ov[llave(r)]; return !!(o && Object.keys(o).length); };\n    /* En la misma llave viven cuatro cosas, pero no todas se guardan por lo\n       mismo: el empate de columnas lo guarda el usuario a prop\u00f3sito con su\n       bot\u00f3n, mientras que esto se llama en cada tecla del editor. Si cada tecla\n       reescribiera el empate con lo que hay en pantalla, bastaba con escribir un\n       monto para borrar el empate recordado. Por eso el empate s\u00f3lo se toca\n       cuando se pide de veras (guardar(true)); las dem\u00e1s veces se respeta el que\n       ya estaba guardado. */\n    function guardar(tambienElEmpate){\n      try {\n        const antes = leerGuardado();\n        let byName = antes.byName || {};\n        if (tambienElEmpate){\n          byName = {};\n          for (const k in S.map) byName[k] = S.headers[S.map[k]];\n        }\n        localStorage.setItem(LSKEY, JSON.stringify({ byName, autocalc: $('autocalc').checked, ov: S.ov, doc: S.doc }));\n      } catch(e){}\n    }\n    function leerGuardado(){\n      try { return JSON.parse(localStorage.getItem(LSKEY) || '{}'); } catch(e){ return {}; }\n    }\n    S.ov = leerGuardado().ov || {};\n    /* El documento elegido se recuerda: quien arma car\u00e1tulas casi siempre va a\n       volver por car\u00e1tulas. */\n    if (leerGuardado().doc === 'caratula') S.doc = 'caratula';\n\n    /* ---------- fotos del domicilio ----------\n       No salen del Excel: se pegan, se arrastran o se eligen aqu\u00ed, y quedan\n       guardadas en el navegador junto con las ediciones a mano, atadas a la\n       misma llave del domicilio.\n\n       Van a IndexedDB y no a localStorage: una sola foto pesa m\u00e1s que todo lo\n       dem\u00e1s junto y el cupo de localStorage \u20145 MB\u2014 se acabar\u00eda a las veinte\n       casas. Si el navegador no deja abrir la base \u2014pasa al abrir el archivo\n       con doble clic, sin servidor\u2014 no truena nada: las fotos se quedan en\n       memoria y sirven para el PDF de esa sesi\u00f3n, nada m\u00e1s no sobreviven a\n       recargar la p\u00e1gina. */\n    const FOTO_DB = 'thiqa_fotos', FOTO_ALM = 'fotos';\n    /* El hueco de la ficha mide 193 x 190 px, o sea poco m\u00e1s de dos pulgadas\n       impresas: arriba de 900 px del lado largo ya no se gana nitidez en papel\n       y s\u00ed se paga en memoria y en lo que tarda el navegador en armar un PDF de\n       cuarenta hojas. A este tama\u00f1o una foto de celular queda en unos 90 KB. */\n    const FOTO_LADO = 900;\n\n    function fotoDb(){\n      return new Promise((ok, mal) => {\n        if (!window.indexedDB) return mal(new Error('sin indexedDB'));\n        const p = indexedDB.open(FOTO_DB, 1);\n        p.onupgradeneeded = () => p.result.createObjectStore(FOTO_ALM);\n        p.onsuccess = () => ok(p.result);\n        p.onerror = () => mal(p.error || new Error('no abre'));\n      });\n    }\n    async function fotosCargar(){\n      try {\n        const db = await fotoDb();\n        await new Promise(ok => {\n          const q = db.transaction(FOTO_ALM).objectStore(FOTO_ALM).openCursor();\n          q.onsuccess = e => {\n            const c = e.target.result;\n            if (c){ S.fotos[c.key] = c.value; c.continue(); } else ok();\n          };\n          q.onerror = () => ok();\n        });\n      } catch(e){}\n    }\n    async function fotoGuardar(k, url){\n      S.fotos[k] = url;\n      try {\n        const db = await fotoDb();\n        db.transaction(FOTO_ALM, 'readwrite').objectStore(FOTO_ALM).put(url, k);\n      } catch(e){}\n    }\n    async function fotoBorrar(k){\n      delete S.fotos[k];\n      try {\n        const db = await fotoDb();\n        db.transaction(FOTO_ALM, 'readwrite').objectStore(FOTO_ALM).delete(k);\n      } catch(e){}\n    }\n\n    /* Las fotos de celular vienen giradas: el sensor graba de lado y la vuelta\n       buena va apuntada en el EXIF. Sin 'from-image' la casa sale acostada en\n       el PDF, que es justo lo que nadie revisa antes de imprimir cuarenta. */\n    async function fotoReducida(file){\n      if (!file || !/^image\\//.test(file.type)) return '';\n      let img = null;\n      try {\n        if (window.createImageBitmap){\n          try { img = await createImageBitmap(file, { imageOrientation:'from-image' }); }\n          catch(e){ img = await createImageBitmap(file); }\n        } else {\n          img = await new Promise((ok, mal) => {\n            const u = URL.createObjectURL(file), i = new Image();\n            i.onload = () => { URL.revokeObjectURL(u); ok(i); };\n            i.onerror = () => { URL.revokeObjectURL(u); mal(new Error('no abre')); };\n            i.src = u;\n          });\n        }\n      } catch(e){ return ''; }\n      const w = img.width || img.naturalWidth, h = img.height || img.naturalHeight;\n      if (!w || !h) return '';\n      const k = Math.min(1, FOTO_LADO / Math.max(w, h));\n      const c = document.createElement('canvas');\n      c.width = Math.round(w * k); c.height = Math.round(h * k);\n      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);\n      if (img.close) img.close();\n      return c.toDataURL('image/jpeg', .82);\n    }\n\n    /* Se leen al arrancar sin frenar la carga: cuando llegan se repinta lo que\n       ya est\u00e9 en pantalla. */\n    fotosCargar().then(() => {\n      if (!S.data.length) return;\n      tabla();\n      if (vista === 'ficha') previa();\n    });\n\n    /* ---------- contadores animados ---------- */\n    function setNum(el, val){\n      if (!el) return;\n      const from = parseInt(el.textContent.replace(/\\D/g,''), 10) || 0;\n      if (from === val || document.documentElement.dataset.anim === '0'){ el.textContent = val; return; }\n      const t0 = performance.now(), dur = 420;\n      const step = t => {\n        const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);\n        el.textContent = Math.round(from + (val - from) * e);\n        if (p < 1) requestAnimationFrame(step);\n      };\n      requestAnimationFrame(step);\n    }\n\n    /* ---------- navegaci\u00f3n ---------- */\n    const TITULOS = {\n      datos: ['Datos','Sube el Excel que bajas de Drive'],\n      dictar:['Dictar','Habla y la IA arma las fichas'],\n      casas: ['Domicilios','Elige las casas que van a imprimirse'],\n      ficha: ['Editar ficha','Ajusta montos y campos de este domicilio'],\n      ayuda: ['C\u00f3mo se usa','Del Drive al PDF en cuatro pasos'],\n    };\n    const links = Array.from(document.querySelectorAll('.navlink'));\n    let datosListos = false;\n    const bloqueada = v => !datosListos && (v === 'casas' || v === 'ficha');\n    /* Se ven apagadas pero siguen recibiendo el clic: con disabled, el navegador\n       se come el evento y el clic muere en silencio, que es lo peor que puede\n       pasar \u2014el usuario cree que la app est\u00e1 descompuesta\u2014. As\u00ed al menos\n       contestan por qu\u00e9 todav\u00eda no se puede entrar. */\n    links.forEach(b => { if (bloqueada(b.dataset.v)) b.style.cursor = 'not-allowed'; });\n    function movePill(btn){\n      const pill = $('navPill');\n      if (!pill || !btn) return;\n      pill.style.opacity = '1';\n      pill.style.height = btn.offsetHeight + 'px';\n      pill.style.transform = 'translateY(' + btn.offsetTop + 'px)';\n    }\n    let vista = 'datos';\n    function ir(v){\n      vista = v;\n      links.forEach(b => {\n        const on = b.dataset.v === v;\n        b.style.background = on ? 'rgba(255,255,255,.11)' : 'transparent';\n        b.style.color = on ? '#fff' : 'var(--sideTx)';\n        b.style.fontWeight = on ? '600' : '400';\n        b.style.paddingLeft = on ? '26px' : '22px';\n        if (on) movePill(b);\n      });\n      document.querySelectorAll('.view').forEach(d => {\n        const on = d.id === 'v-' + v;\n        d.style.display = on ? 'block' : 'none';\n        if (on){ d.classList.remove('tq-anim'); void d.offsetWidth; d.classList.add('tq-anim'); }\n      });\n      const h = $('tbHead');\n      h.style.animation = 'none'; void h.offsetWidth; h.style.animation = 'tq-in .3s ease both';\n      $('tbTitulo').textContent = TITULOS[v][0];\n      $('tbSub').textContent = TITULOS[v][1];\n      menuLateral(false);\n      window.scrollTo({top:0});\n      barra();\n      if (v === 'ficha') pintarEditor();\n      if (v === 'dictar') iaFormPintar();\n      /* Se puede llegar a Domicilios sin pasar por el bot\u00f3n del paso 3 \u2014con\n         fichas dictadas, o al recargar\u2014, as\u00ed que la tabla se arma aqu\u00ed. El\n         palomeo inicial ya lo hizo recargarDomicilios(). */\n      if (v === 'casas'){ filtros(); tabla(); }\n    }\n    links.forEach(b => b.addEventListener('click', () => {\n      if (bloqueada(b.dataset.v)){\n        toast('Primero sube el Excel en <b>Datos<\u002Fb> y aqu\u00ed se prenden tus domicilios.');\n        ir('datos');\n        return;\n      }\n      ir(b.dataset.v);\n    }));\n    /* El velo se prende con el men\u00fa y se apaga al tocarlo: en celular, abrir el\n       men\u00fa dejaba sin salida a quien no quer\u00eda cambiar de pesta\u00f1a. */\n    const menuLateral = abrir => {\n      const a = $('aside'), v = $('velo');\n      if (abrir) a.setAttribute('data-open','1'); else a.removeAttribute('data-open');\n      v.style.opacity = abrir ? '1' : '0';\n      v.style.pointerEvents = abrir ? 'auto' : 'none';\n    };\n    $('hamb').onclick = () => menuLateral($('aside').getAttribute('data-open') !== '1');\n    $('velo').onclick = () => menuLateral(false);\n    $('btnAyuda').onclick = () => ir('ayuda');\n    $('btnTema').onclick = () =>\n      self.setTema(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');\n\n    function cerrarModal(){\n      const m = $('modal');\n      m.style.opacity = '0';\n      $('modalBox').style.transform = 'scale(.94) translateY(14px)';\n      setTimeout(() => { m.style.display = 'none'; }, 240);\n    }\n    function abrirModal(titulo, html){\n      $('mTitle').textContent = titulo;\n      $('mBody').innerHTML = html;\n      const m = $('modal');\n      m.style.display = 'flex';\n      requestAnimationFrame(() => { m.style.opacity = '1'; $('modalBox').style.transform = 'none'; });\n    }\n    $('mClose').onclick = $('mOk').onclick = cerrarModal;\n    $('modal').addEventListener('click', e => { if (e.target === $('modal')) cerrarModal(); });\n\n    /* ---------- stepper ---------- */\n    let listos = { 1:false, 2:false, 3:false };\n    function stepper(){\n      const stps = Array.from(document.querySelectorAll('#stepper .stp'));\n      const lns = Array.from(document.querySelectorAll('#stepper .stpL > i'));\n      stps.forEach(s => {\n        const n = +s.dataset.s, ok = listos[n], circ = s.querySelector('.stpN'), t = s.querySelector('.stpT');\n        const act = ok || (n === 1) || listos[n-1];\n        circ.style.background = ok ? 'var(--nar)' : 'var(--surf)';\n        circ.style.borderColor = ok ? 'var(--nar)' : (act ? 'var(--nar)' : 'var(--brd2)');\n        circ.style.color = ok ? '#fff' : (act ? 'var(--nar2)' : 'var(--tx3)');\n        circ.style.boxShadow = ok ? 'var(--shN)' : 'none';\n        circ.innerHTML = ok\n          ? '<svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12.5 4.6 4.5L19 7\"/><\u002Fsvg>'\n          : String(n);\n        t.style.color = act ? 'var(--tx)' : 'var(--tx3)';\n      });\n      if (lns[0]) lns[0].style.width = listos[1] ? '100%' : '0%';\n      if (lns[1]) lns[1].style.width = listos[2] ? '100%' : '0%';\n    }\n    function paso(id, on){\n      const el = $(id);\n      el.style.opacity = on ? '1' : '.45';\n      el.style.pointerEvents = on ? 'auto' : 'none';\n    }\n    function pill(txt){\n      const p = $('pillEstado');\n      if (!txt){ p.style.display = 'none'; return; }\n      p.style.display = 'flex';\n      p.innerHTML = '<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m5 12.5 4.6 4.5L19 7\"/><\u002Fsvg>' + esc(txt);\n    }\n    stepper();\n\n    /* ---------- carga del archivo ---------- */\n    const drop = $('drop');\n    const dropOn = () => { drop.style.borderColor = 'var(--nar)'; drop.style.background = 'var(--narL)'; drop.style.transform = 'scale(1.01)'; };\n    const dropOff = () => { drop.style.borderColor = 'var(--brd2)'; drop.style.background = 'var(--surf2)'; drop.style.transform = 'none'; };\n    drop.onclick = () => $('file').click();\n    drop.onmouseenter = dropOn;\n    drop.onmouseleave = dropOff;\n    drop.ondragover = e => { e.preventDefault(); dropOn(); };\n    drop.ondragleave = dropOff;\n    drop.ondrop = e => { e.preventDefault(); dropOff(); if (e.dataTransfer.files[0]) cargar(e.dataTransfer.files[0]); };\n    $('file').onchange = e => { if (e.target.files[0]) cargar(e.target.files[0]); };\n\n    const aviso = (box, cls, html) => {\n      const col = cls === 'warn' ? 'var(--nar)' : cls === 'ok' ? 'var(--ok)' : 'var(--azul)';\n      const bg = cls === 'warn' ? 'var(--narL)' : cls === 'ok' ? 'var(--okL)' : 'var(--azulL)';\n      $(box).innerHTML = '<div style=\"border:1px solid var(--brd);border-left:4px solid ' + col +\n        ';background:' + bg + ';border-radius:12px;padding:14px 17px;margin-top:14px;font-size:13px;line-height:1.6;color:var(--tx2);' +\n        'animation:tq-in .3s ease both\">' + html + '<\u002Fdiv>';\n    };\n    const limpia = box => $(box).innerHTML = '';\n    const sk = on => { $('sk1').style.display = on ? 'block' : 'none'; };\n\n    /* El paso 1 se palomea hasta que la lectura sali\u00f3 bien: antes se prend\u00eda\n       nada m\u00e1s con escoger el archivo, as\u00ed que un archivo ilegible dejaba el\n       paso en verde contradiciendo al aviso rojo de junto. */\n    const falloArchivo = f => {\n      listos[1] = false; stepper();\n      $('st1').textContent = f.name + ' \u00b7 no se pudo leer';\n    };\n    async function cargar(f){\n      limpia('err1'); sk(true);\n      $('st1').textContent = 'Leyendo ' + f.name + '\u2026';\n      const ext = f.name.split('.').pop().toLowerCase();\n      try {\n        if (ext === 'csv' || ext === 'txt'){\n          S.rows = window.parseCSV(await f.text());\n          listos[1] = true; $('st1').textContent = f.name + ' \u00b7 ' + (f.size/1024).toFixed(0) + ' KB'; stepper();\n          paso('p2', false);\n          $('st2').textContent = 'CSV \u00b7 una sola hoja';\n          sk(false);\n          construir(+$('headerrow').value || 1);\n          return;\n        }\n        if (ext === 'xls'){\n          sk(false);\n          falloArchivo(f);\n          aviso('err1','warn','<b style=\"color:var(--tx)\">El formato .xls (Excel viejo) no se puede leer aqu\u00ed.<\u002Fb><br>' +\n            '\u00c1brelo en Excel y usa <i>Archivo \u2192 Guardar como \u2192 Libro de Excel (*.xlsx)<\u002Fi>. ' +\n            'Desde Google Sheets: <i>Archivo \u2192 Descargar \u2192 Microsoft Excel (.xlsx)<\u002Fi>.');\n          return;\n        }\n        S.wb = await window.XLSXReader.parse(await f.arrayBuffer());\n        listos[1] = true; $('st1').textContent = f.name + ' \u00b7 ' + (f.size/1024).toFixed(0) + ' KB'; stepper();\n        $('sheetsel').innerHTML = S.wb.sheets\n          .map((n,i) => '<option value=\"'+i+'\">'+esc(n)+'<\u002Foption>').join('');\n        paso('p2', true);\n        $('st2').textContent = S.wb.sheets.length + (S.wb.sheets.length === 1 ? ' hoja' : ' hojas');\n        const auto = await autoHoja();\n        sk(false);\n        await leerHoja();\n        /* El aviso de que s\u00ed jal\u00f3: dice cu\u00e1ntos domicilios ley\u00f3 y qu\u00e9 sigue. Sin\n           esto lo \u00fanico que se ve\u00eda tras subir el archivo era la pantalla de\n           columnas, y nadie sab\u00eda si hab\u00eda salido bien. */\n        if (S.data.length)\n          aviso('err1','ok','<b style=\"color:var(--tx)\">Listo: le\u00ed ' + S.data.length +\n            (S.data.length === 1 ? ' domicilio' : ' domicilios') + '.<\u002Fb>' +\n            (S.wb.sheets.length > 1 && auto.score > 0\n              ? ' De la hoja <b style=\"color:var(--tx)\">' + esc(S.wb.sheets[auto.hoja]) +\n                '<\u002Fb>, con los encabezados en la <b style=\"color:var(--tx)\">fila ' + auto.hr +\n                '<\u002Fb>. Si necesitas otra hoja, c\u00e1mbiala aqu\u00ed abajo.'\n              : '') +\n            '<br>Ya puedes pasar a <b style=\"color:var(--tx)\">elegir cu\u00e1les imprimes<\u002Fb>.');\n      } catch(e){\n        sk(false);\n        const m = String(e.message || e);\n        const t = m === 'NAV_VIEJO'\n          ? '<b style=\"color:var(--tx)\">Tu navegador no puede descomprimir el Excel.<\u002Fb><br>Abre este archivo con Google Chrome o Microsoft Edge.'\n          : m === 'NO_ZIP'\n          ? '<b style=\"color:var(--tx)\">El archivo no parece un .xlsx v\u00e1lido.<\u002Fb><br>Vuelve a guardarlo desde Excel como <i>Libro de Excel (*.xlsx)<\u002Fi>.'\n          : m === 'ZIP64'\n          ? '<b style=\"color:var(--tx)\">El archivo es demasiado grande o usa formato ZIP64.<\u002Fb><br>Quita hojas que no uses o exp\u00f3rtalo a CSV.'\n          : '<b style=\"color:var(--tx)\">No pude leer el archivo.<\u002Fb><br>Detalle: ' + esc(m);\n        falloArchivo(f);\n        aviso('err1','warn',t);\n        toast('No se pudo leer el archivo.','err');\n      }\n    }\n    $('loadsheet').onclick = () => leerHoja();\n    $('sheetsel').onchange = async () => {\n      const rows = await S.wb.readSheet(+$('sheetsel').value).catch(() => null);\n      if (rows) $('headerrow').value = String(mejorEncabezado(rows).hr);\n      leerHoja();\n    };\n\n    /* Un libro real trae hojas de respaldo, cat\u00e1logos y notas sueltas. En vez de\n       abrir siempre la primera, se puntean todas y gana la que de verdad parece\n       el listado de domicilios: la que empata m\u00e1s campos de la ficha. */\n    function mejorEncabezado(rows){\n      let best = { hr:1, score:-1 };\n      const tope = Math.min(rows.length, 12);\n      for (let i = 0; i < tope; i++){\n        const head = (rows[i] || []).map(v => v instanceof Date ? fmtFecha(v) : String(v ?? '').trim());\n        const cols = head.filter(h => h !== '').length;\n        if (cols < 2) continue;\n        let datos = 0;\n        for (let j = i + 1; j < rows.length; j++){\n          const r = rows[j];\n          if (r && r.some(v => v !== null && v !== undefined && String(v).trim() !== '')) datos++;\n        }\n        if (!datos) continue;\n        const empatados = Object.keys(adivinar(head)).length;\n        const score = empatados * 12 + Math.min(cols, 30) + Math.min(datos, 60);\n        if (score > best.score) best = { hr: i + 1, score };\n      }\n      return best;\n    }\n\n    async function autoHoja(){\n      let best = { hoja:0, hr:1, score:-1 };\n      for (let i = 0; i < S.wb.sheets.length; i++){\n        let rows;\n        try { rows = await S.wb.readSheet(i); } catch(e){ continue; }\n        const c = mejorEncabezado(rows);\n        if (c.score > best.score) best = { hoja:i, hr:c.hr, score:c.score };\n      }\n      $('sheetsel').value = String(best.hoja);\n      $('headerrow').value = String(best.hr);\n      return best;\n    }\n\n    async function leerHoja(){\n      limpia('err1'); sk(true);\n      try {\n        S.rows = await S.wb.readSheet(+$('sheetsel').value);\n        sk(false);\n        construir(+$('headerrow').value || 1);\n      } catch(e){ sk(false); aviso('err1','warn','<b style=\"color:var(--tx)\">No pude leer esa hoja.<\u002Fb><br>Detalle: ' + esc(e.message || e)); }\n    }\n\n    function construir(hr){\n      const head = (S.rows[hr-1] || []).map(v => v instanceof Date ? fmtFecha(v) : String(v ?? '').trim());\n      while (head.length && head[head.length-1] === '') head.pop();\n      if (!head.length){ aviso('err1','warn','<b style=\"color:var(--tx)\">La fila ' + hr + ' est\u00e1 vac\u00eda.<\u002Fb> Prueba con otra fila de encabezados.'); return; }\n\n      S.headers = head;\n      /* Se guarda de qu\u00e9 rengl\u00f3n del Excel sali\u00f3 cada fila: es lo que despu\u00e9s\n         deja recuperar la liga de Maps o de Drive que cuelga de esa celda. */\n      S.todas = []; S.data = []; S.estatusOff.clear();\n      for (let i = hr; i < S.rows.length; i++){\n        const r = S.rows[i];\n        if (r && r.some(v => v !== null && v !== undefined && String(v).trim() !== '')){\n          r.__fila = i;\n          S.todas.push(r);\n        }\n      }\n      if (!S.todas.length){ aviso('err1','warn','<b style=\"color:var(--tx)\">No encontr\u00e9 filas de datos debajo del encabezado.<\u002Fb>'); return; }\n\n      listos[2] = true; stepper();\n      $('st2').textContent = S.todas.length + ' filas \u00b7 encabezados en la fila ' + hr;\n\n      const fc = S.rows.__fcols, vacias = [];\n      if (fc && fc.size) head.forEach((h,i) => {\n        if (fc.has(i) && h && S.todas.every(r => r[i] === null || r[i] === undefined || String(r[i]).trim() === ''))\n          vacias.push(h);\n      });\n      $('avisoform').innerHTML = vacias.length ?\n        '<div style=\"border:1px solid var(--brd);border-left:4px solid var(--nar);background:var(--narL);border-radius:12px;' +\n        'padding:14px 17px;margin-bottom:16px;font-size:13px;line-height:1.6;color:var(--tx2)\">' +\n        '<b style=\"color:var(--tx)\">' + vacias.length + ' columna(s) llegaron vac\u00edas porque son f\u00f3rmulas.<\u002Fb><br>' +\n        esc(vacias.slice(0,8).join(' \u00b7 ')) + (vacias.length > 8 ? ' \u2026' : '') + '<br><br>' +\n        'Excel guard\u00f3 la f\u00f3rmula pero no el resultado. En el Sheet, copia esas columnas y usa ' +\n        '<i>Editar \u2192 Pegado especial \u2192 Pegar solo valores<\u002Fi>; luego vuelve a descargar. ' +\n        'Mientras tanto puedes mapear esos campos a otra columna que s\u00ed traiga texto.<\u002Fdiv>' : '';\n\n      S.map = adivinar(head);\n      porContenido();\n      pintarMapeo();\n      /* Sin domicilio ni folio, esa hoja no es la de los domicilios: es un\n         respaldo, un cat\u00e1logo o las instrucciones. Antes segu\u00eda de largo como si\n         nada y se llegaba hasta el PDF con fichas en blanco. */\n      if (S.map.DOMICILIO === undefined && S.map.FOLIO === undefined){\n        paso('p3', false);\n        const otras = S.wb ? S.wb.sheets.filter((_,i) => i !== +$('sheetsel').value) : [];\n        aviso('err1','warn','<b style=\"color:var(--tx)\">En esta hoja no encontr\u00e9 ni domicilios ni folios.<\u002Fb><br>' +\n          'Seguro no es la de la bit\u00e1cora' +\n          (otras.length ? ': prueba con otra hoja aqu\u00ed abajo \u2014' + esc(otras.slice(0,4).join(', ')) +\n            (otras.length > 4 ? '\u2026' : '') + '\u2014.' : '.') +\n          '<br>Si s\u00ed es la buena, \u00e1brela en <i>Revisar columnas<\u002Fi> y apunta a mano el domicilio.');\n        return;\n      }\n      recargarDomicilios();\n      paso('p3', true);\n      /* El men\u00fa se prende aqu\u00ed, no hasta que le atinen al bot\u00f3n del fondo: el\n         reflejo de cualquiera es subir el archivo y picarle a \"Domicilios\". */\n      desbloquear();\n      /* La vista se lleva al paso 3, que ahora es un resumen de dos renglones con\n         el bot\u00f3n para seguir. Antes esto ca\u00eda en 71 desplegables y el bot\u00f3n\n         quedaba medio metro abajo del borde de la pantalla. */\n      $('p3').scrollIntoView({behavior:'smooth', block:'start'});\n    }\n\n    /* Las dictadas van al final para que los \u00edndices ya seleccionados de las\n       filas del Excel sigan apuntando a lo mismo. */\n    /* Un segundo intento de empate, ya no por el nombre de la columna sino por\n       lo que traen sus celdas. Existe por la columna del expediente judicial de\n       la bit\u00e1cora maestra: en el Sheet su encabezado es un espacio en blanco, as\u00ed\n       que adivinar() no tiene por d\u00f3nde agarrarla, pero sus celdas dicen todas\n       \"EXP. JUDICIAL BNC_HSBC_040\". As\u00ed queda empatada en el paso 3 aunque hoy\n       ninguno de los dos documentos la imprima; el QR sale de EXP. DIGITAL. */\n    function porContenido(){\n      if (S.map.EXP_JUDICIAL !== undefined) return;\n      const usadas = new Set(Object.values(S.map));\n      const muestra = Math.min(S.todas.length, 60);\n      for (let ci = 0; ci < S.headers.length; ci++){\n        if (usadas.has(ci)) continue;\n        let dice = 0, hay = 0;\n        for (let i = 0; i < muestra; i++){\n          const t = String(S.todas[i][ci] ?? '').trim();\n          if (!t) continue;\n          hay++;\n          if (/^exp\\.? *judicial\\b/i.test(t)) dice++;\n        }\n        if (hay >= 3 && dice / hay > .7){ S.map.EXP_JUDICIAL = ci; return; }\n      }\n    }\n\n    /* Las dictadas van al final para que los \u00edndices ya seleccionados de las\n       filas del Excel sigan apuntando a lo mismo. Como S.sel y S.cur guardan\n       posiciones y no llaves, aqu\u00ed se tira lo que qued\u00f3 fuera de rango: al\n       borrar las dictadas la lista se encoge, y sin esto la selecci\u00f3n segu\u00eda\n       apuntando a renglones que ya no existen y el PDF sal\u00eda vac\u00edo sin decir\n       nada. Tambi\u00e9n se vac\u00eda lo armado para imprimir, que ya no corresponde. */\n    function rehacerDatos(){\n      S.data = S.todas.concat(S.dictadas);\n      for (const i of [...S.sel]) if (!S.data[i]) S.sel.delete(i);\n      if (S.cur >= S.data.length) S.cur = 0;\n      $('printarea').innerHTML = '';\n      setNum($('ctFilas'), S.data.length);\n    }\n\n    /* Deja prendidos solo los estatus con convenio confirmado. Arranca de cero\n       en vez de ir quitando: se llama al cargar el archivo, al reapuntar ESTATUS\n       a otra columna y al limpiar filtros, y los tres quieren volver al estado\n       de reci\u00e9n llegado. Un estatus vac\u00edo no se apaga nunca, porque tampoco\n       tiene casilla con qu\u00e9 volver a prenderlo. */\n    /* Apagar un estatus tiene que soltar tambi\u00e9n lo que ya estaba palomeado de\n       ese estatus: si no, la casa se esconde de la tabla pero se sigue\n       imprimiendo, y no hay ni c\u00f3mo darse cuenta \u2014la fila ya no est\u00e1 en pantalla\n       para poder desmarcarla\u2014. Cada casilla de estatus ya hac\u00eda esta poda; el\n       bot\u00f3n \"Quitar filtros\" no, y por ah\u00ed se colaban al PDF. */\n    function apagarSinConvenio(){\n      S.estatusOff.clear();\n      for (const r of S.data){\n        const v = valor(r,'ESTATUS');\n        if (v && !CON_CONVENIO.test(norm(v))) S.estatusOff.add(v);\n      }\n      for (const i of [...S.sel])\n        if (S.data[i] && S.estatusOff.has(valor(S.data[i],'ESTATUS'))) S.sel.delete(i);\n    }\n\n    /* Se corre despu\u00e9s de pintarMapeo porque ah\u00ed es donde la configuraci\u00f3n\n       guardada puede reapuntar ESTATUS a otra columna. */\n    function recargarDomicilios(){\n      rehacerDatos();\n      S.sel.clear();\n      S.cur = 0;\n      apagarSinConvenio();\n      /* El palomeo inicial se hace aqu\u00ed, en cuanto hay datos, y no al entrar por\n         primera vez a Domicilios: as\u00ed el men\u00fa lateral ya trae el n\u00famero desde\n         que se sube el archivo, y subir un segundo Excel encima vuelve a\n         palomear en vez de dejar todo en cero con el bot\u00f3n de generar muerto. */\n      S.data.forEach((r,i) => { if (!S.estatusOff.has(valor(r,'ESTATUS'))) S.sel.add(i); });\n      const on = S.data.filter(r => !S.estatusOff.has(valor(r,'ESTATUS'))).length;\n      const off = S.data.length - on;\n      pill(S.data.length + (S.data.length === 1 ? ' domicilio' : ' domicilios'));\n      toast('<b>' + on + '<\u002Fb> por trabajar: pr\u00f3ximas recuperaciones y recuperadas.' +\n        (off ? '<br>Dej\u00e9 apagado' + (off === 1 ? '' : 's') + ' <b>' + off + '<\u002Fb> de otros estatus: ' +\n               'pr\u00e9ndelo' + (off === 1 ? '' : 's') +\n               ' en <i>Estatus de ruta<\u002Fi> si lo necesitas.' : ''), 'ok');\n      /* La lista de domicilios y los contadores se quedaban con las cifras del\n         archivo anterior hasta que uno entraba a Domicilios. */\n      llenarSelector();\n      contadores();\n      /* Y si el usuario est\u00e1 viendo Domicilios cuando cambian los datos \u2014subi\u00f3\n         otro Excel, cambi\u00f3 de hoja o reapunt\u00f3 la columna de estatus\u2014, hay que\n         repintar ah\u00ed mismo: si no, se queda viendo la tabla del archivo\n         anterior, con cero palomeadas y el bot\u00f3n de generar muerto. */\n      if (vista === 'casas') ir('casas');\n    }\n\n    /* ---------- mapeo ---------- */\n    const CHEV = '<span class=\"chev\"><svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><polyline points=\"6 9 12 15 18 9\"/><\u002Fsvg><\u002Fspan>';\n\n    function pintarMapeo(){\n      const opts = '<option value=\"\">\u2014 vac\u00edo \u2014<\u002Foption>' +\n        S.headers.map((h,i) => '<option value=\"'+i+'\">' + esc(h || ('Columna ' + (i+1))) + '<\u002Foption>').join('');\n\n      $('maps').innerHTML = GRUPOS.map((g,i) =>\n        '<div class=\"mapsec' + (g.open ? '' : ' cerrada') + '\">' +\n          '<h4>' + CHEV + esc(g.t) + '<span class=\"cnt\" data-c=\"' + i + '\"><\u002Fspan><\u002Fh4>' +\n          '<div class=\"body\"><div class=\"inner\"><div class=\"fgrid\">' +\n            g.f.map(x => '<label data-k=\"' + x[0] + '\"><span>' + esc(x[1]) + '<\u002Fspan>' +\n              '<select data-key=\"' + x[0] + '\">' + opts + '<\u002Fselect><\u002Flabel>').join('') +\n          '<\u002Fdiv><\u002Fdiv><\u002Fdiv>' +\n        '<\u002Fdiv>').join('');\n\n      const guardado = leerGuardado();\n      if (guardado.byName) for (const k in guardado.byName){\n        const i = S.headers.findIndex(h => norm(h) === norm(guardado.byName[k]));\n        if (i >= 0) S.map[k] = i;\n      }\n      if (guardado.autocalc !== undefined) $('autocalc').checked = guardado.autocalc;\n\n      for (const s of $('maps').querySelectorAll('select')){\n        const k = s.dataset.key;\n        s.value = S.map[k] !== undefined ? String(S.map[k]) : '';\n        s.closest('label').classList.toggle('ok', s.value !== '');\n        s.onchange = () => {\n          if (s.value === '') delete S.map[k]; else S.map[k] = +s.value;\n          s.closest('label').classList.toggle('ok', s.value !== '');\n          cuentaMapeo();\n          /* Reapuntar ESTATUS cambia qu\u00e9 filas traen convenio: hay que rehacer\n             el apagado con la columna nueva. */\n          if (k === 'ESTATUS' && S.todas.length) recargarDomicilios();\n        };\n      }\n      for (const h of $('maps').querySelectorAll('.mapsec > h4'))\n        h.onclick = () => h.parentElement.classList.toggle('cerrada');\n      cuentaMapeo();\n    }\n    function cuentaMapeo(){\n      let tot = 0;\n      GRUPOS.forEach((g,i) => {\n        const n = g.f.filter(x => S.map[x[0]] !== undefined).length;\n        tot += n;\n        const el = $('maps').querySelector('[data-c=\"'+i+'\"]');\n        if (el) el.textContent = n + ' / ' + g.f.length;\n      });\n      $('st3').textContent = tot + ' de ' + CAMPOS.length + ' campos empatados';\n      /* El resumen de arriba es lo \u00fanico que la mayor\u00eda necesita leer de este\n         paso: el detalle son 71 desplegables y espantaba a quien apenas ven\u00eda\n         llegando. Se abre s\u00f3lo si algo sali\u00f3 mal. */\n      /* S.data todav\u00eda no se rehace cuando esto corre al cargar el archivo, por\n         eso el conteo sale de S.todas. */\n      const n = S.data.length || (S.todas.length + S.dictadas.length);\n      $('p3nota').innerHTML = '<b style=\"color:var(--tx)\">Listo: le\u00ed ' + n +\n        (n === 1 ? ' domicilio' : ' domicilios') + ' y empat\u00e9 ' + tot + ' de ' + CAMPOS.length +\n        ' campos solo.<\u002Fb> Los que quedan en blanco salen como l\u00ednea para llenar a mano, as\u00ed que ' +\n        'puedes seguir de largo; abre <i>Revisar columnas<\u002Fi> nada m\u00e1s si algo no cuadra.';\n      $('tocasasTxt').textContent = n ? 'Ver los ' + n + ' domicilios' : 'Ver domicilios';\n      listos[3] = tot > 0; stepper();\n    }\n    $('vermapeo').onclick = () => {\n      const d = $('p3det'), abierto = d.style.display !== 'none';\n      d.style.display = abierto ? 'none' : 'block';\n      $('vermapeo').textContent = abierto ? 'Revisar columnas' : 'Ocultar columnas';\n      if (!abierto) d.scrollIntoView({be
