ss=\"val\" data-field=\"HONORARIO_FIJO\">{{HONORARIO_FIJO}}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"panel\" style=\"padding:7px 13px\">\n    <div class=\"grid-7\">\n      <div class=\"field\"><span class=\"lbl\">Exp. Digital<\u002Fspan><span class=\"val\" data-field=\"EXP_DIGITAL\">{{EXP_DIGITAL}}<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><span class=\"lbl\">F. Asignación<\u002Fspan><span class=\"val\" data-field=\"F_ASIGNACION\">{{F_ASIGNACION}}<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><span class=\"lbl\">F. Desalojo<\u002Fspan><span class=\"val\" data-field=\"F_DESALOJO\">{{F_DESALOJO}}<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><span class=\"lbl\">F. Convenio<\u002Fspan><span class=\"val\" data-field=\"F_CONVENIO\">{{F_CONVENIO}}<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><span class=\"lbl\">Carta Poder<\u002Fspan><span class=\"val\" data-field=\"CARTA_PODER\">{{CARTA_PODER}}<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><span class=\"lbl\">Cuenta Predial<\u002Fspan><span class=\"val\" data-field=\"CUENTA_PREDIAL\">{{CUENTA_PREDIAL}}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"leader\" style=\"width:100%; height:54px\">\n    <div class=\"avatar\"><span>Foto<\u002Fspan><img data-field=\"FOTO_LIDER\" onerror=\"this.removeAttribute('src')\" alt=\"\"><\u002Fdiv>\n    <div class=\"field\" style=\"flex:1\"><span class=\"lbl\">Líder de Cuadrilla<\u002Fspan><span class=\"val\" data-field=\"LIDER\">{{LIDER}}<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"panel\" style=\"gap:5px; padding:7px 13px\">\n    <div class=\"caption\">Presupuesto de honorarios y bonos · Pago del monto de recuperación.<\u002Fdiv>\n    <div class=\"grid-5\">\n      <div class=\"field\"><span class=\"lbl\">Honorario Fijo<\u002Fspan><span class=\"money\" data-field=\"HONORARIO_FIJO_2\">{{HONORARIO_FIJO}}<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><span class=\"lbl\">Bono<\u002Fspan><span class=\"money\" data-field=\"BONO_2\">{{BONO}}<\u002Fspan><\u002Fdiv>\n      <div class=\"field accent\"><span class=\"lbl\">Total a Pagar<\u002Fspan><span class=\"money-or\" data-field=\"TOTAL_PAGAR\">{{TOTAL_PAGAR}}<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><span class=\"lbl\">Monto Acordado<\u002Fspan><span class=\"money\" data-field=\"MONTO_ACORDADO\">{{MONTO_ACORDADO}}<\u002Fspan><\u002Fdiv>\n      <div class=\"field accent\"><span class=\"lbl\">Promedio $$<\u002Fspan><span class=\"money-or\" data-field=\"PROMEDIO\">{{PROMEDIO}}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sec-title\">Etapas de Seguimiento<\u002Fdiv>\n\n  <div class=\"stages\">\n\n    <div class=\"row-2\">\n      <div class=\"stage\">\n        <span class=\"badge\">1 · Solicitud de Recurso<\u002Fspan>\n        <div class=\"f2\">\n          <div class=\"field\"><span class=\"lbl-s\">Responsable<\u002Fspan><div class=\"val-sig\" data-field=\"E1_RESP\">{{E1_RESP}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl-s\">Fecha<\u002Fspan><div class=\"val-sig\" data-field=\"E1_FECHA\">{{E1_FECHA}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field span2\"><span class=\"lbl-s\">Nombre y Firma<\u002Fspan><div class=\"val-sig\" data-field=\"E1_FIRMA\">{{E1_FIRMA}}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stage key\">\n        <span class=\"badge\">2 · Entrega de Recurso<\u002Fspan>\n        <div class=\"f22\">\n          <div class=\"field\"><span class=\"lbl-s\">Fecha<\u002Fspan><div class=\"val-or\" data-field=\"E2_FECHA\">{{E2_FECHA}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl-s\">Cantidad<\u002Fspan><div class=\"val-or\" data-field=\"E2_CANTIDAD\">{{E2_CANTIDAD}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl-s\">Responsable<\u002Fspan><div class=\"val-or\" data-field=\"E2_RESP\">{{E2_RESP}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl-s\">Nombre y Firma<\u002Fspan><div class=\"val-or\" data-field=\"E2_FIRMA\">{{E2_FIRMA}}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"stage\" style=\"gap:6px\">\n      <span class=\"badge\">3 · Solicitud de Materiales y Tapeos<\u002Fspan>\n      <div class=\"f3\">\n        <div class=\"field\"><span class=\"lbl-s\">Responsable<\u002Fspan><div class=\"val-sig\" data-field=\"E3_RESP\">{{E3_RESP}}<\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><span class=\"lbl-s\">Fecha<\u002Fspan><div class=\"val-sig\" data-field=\"E3_FECHA\">{{E3_FECHA}}<\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><span class=\"lbl-s\">Nombre y Firma<\u002Fspan><div class=\"val-sig\" data-field=\"E3_FIRMA\">{{E3_FIRMA}}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mats\">\n        <div class=\"field\" style=\"gap:3px\">\n          <span class=\"lbl\">Material Utilizado · Cant.<\u002Fspan>\n          <div class=\"mat-list\">\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"BLOCK\"><\u002Fi><b>Block<\u002Fb><i data-field=\"CANT_BLOCK\"><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"CEMENTO\"><\u002Fi><b>Cemento<\u002Fb><i data-field=\"CANT_CEMENTO\"><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"ARENA\"><\u002Fi><b>Varilla<\u002Fb><i data-field=\"CANT_ARENA\"><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"GRAVA\"><\u002Fi><b>Arena<\u002Fb><i data-field=\"CANT_GRAVA\"><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"VARILLA\"><\u002Fi><b>Alambre recocido<\u002Fb><i data-field=\"CANT_VARILLA\"><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"ARMEX\"><\u002Fi><b>Estuco<\u002Fb><i data-field=\"CANT_ARMEX\"><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"ALAMBRE\"><\u002Fi><i data-field=\"CANT_ALAMBRE\"><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"CAL\"><\u002Fi><i data-field=\"CANT_CAL\"><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"CIMBRA\"><\u002Fi><i data-field=\"CANT_CIMBRA\"><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"CLAVOS\"><\u002Fi><i data-field=\"CANT_CLAVOS\"><\u002Fi><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:5px\">\n          <div class=\"field\">\n            <span class=\"lbl\">Medidas de Tapeos<\u002Fspan>\n            <span class=\"thin\" data-field=\"TAPEO_1\">{{TAPEO_1}}<\u002Fspan>\n            <span class=\"thin\" data-field=\"TAPEO_2\">{{TAPEO_2}}<\u002Fspan>\n            <span class=\"thin\" data-field=\"TAPEO_3\">{{TAPEO_3}}<\u002Fspan>\n            <span class=\"thin\" data-field=\"TAPEO_4\">{{TAPEO_4}}<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"field accent\">\n            <span class=\"lbl\">Total Materiales<\u002Fspan>\n            <span class=\"money-or\" data-field=\"TOTAL_MATERIALES\">{{TOTAL_MATERIALES}}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\" style=\"gap:3px\">\n          <span class=\"lbl\">Foto Materiales<\u002Fspan>\n          <div class=\"slot wide\"><em>Foto<\u002Fem><img data-field=\"FOTO_MATERIALES\" onerror=\"this.removeAttribute('src')\" alt=\"\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"stage\" style=\"gap:6px\">\n      <span class=\"badge\">4 · Avance de Obra<\u002Fspan>\n      <div class=\"f3\">\n        <div class=\"field\"><span class=\"lbl-s\">Responsable<\u002Fspan><div class=\"val-sig\" data-field=\"E4_RESP\">{{E4_RESP}}<\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><span class=\"lbl-s\">Fecha<\u002Fspan><div class=\"val-sig\" data-field=\"E4_FECHA\">{{E4_FECHA}}<\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><span class=\"lbl-s\">Nombre y Firma<\u002Fspan><div class=\"val-sig\" data-field=\"E4_FIRMA\">{{E4_FIRMA}}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"photo-groups\">\n        <div class=\"field\" style=\"gap:3px\">\n          <span class=\"lbl\">Antes<\u002Fspan>\n          <div class=\"photo-pair\">\n            <div class=\"slot sq\"><em>Foto antes<\u002Fem><img data-field=\"FOTO_ANTES_1\" onerror=\"this.removeAttribute('src')\" alt=\"\"><\u002Fdiv>\n            <div class=\"slot sq\"><em>Foto antes<\u002Fem><img data-field=\"FOTO_ANTES_2\" onerror=\"this.removeAttribute('src')\" alt=\"\"><\u002Fdiv>\n            <div class=\"slot sq\"><em>Foto extra<\u002Fem><img data-field=\"FOTO_ANTES_3\" onerror=\"this.removeAttribute('src')\" alt=\"\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"field\" style=\"gap:3px\">\n          <span class=\"lbl\">Después<\u002Fspan>\n          <div class=\"photo-pair\">\n            <div class=\"slot sq\"><em>Foto después<\u002Fem><img data-field=\"FOTO_DESPUES_1\" onerror=\"this.removeAttribute('src')\" alt=\"\"><\u002Fdiv>\n            <div class=\"slot sq\"><em>Foto después<\u002Fem><img data-field=\"FOTO_DESPUES_2\" onerror=\"this.removeAttribute('src')\" alt=\"\"><\u002Fdiv>\n            <div class=\"slot sq\"><em>Foto extra<\u002Fem><img data-field=\"FOTO_DESPUES_3\" onerror=\"this.removeAttribute('src')\" alt=\"\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"row-2\">\n      <div class=\"stage\">\n        <span class=\"badge\">5 · Supervisión del Encargado<\u002Fspan>\n        <div class=\"f2\">\n          <div class=\"field\"><span class=\"lbl-s\">Responsable<\u002Fspan><div class=\"val-sig\" data-field=\"E5_RESP\">{{E5_RESP}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl-s\">Fecha<\u002Fspan><div class=\"val-sig\" data-field=\"E5_FECHA\">{{E5_FECHA}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field span2\"><span class=\"lbl-s\">Nombre y Firma<\u002Fspan><div class=\"val-sig\" data-field=\"E5_FIRMA\">{{E5_FIRMA}}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stage key\">\n        <span class=\"badge\">6 · Entrega de Honorarios<\u002Fspan>\n        <div class=\"f22\">\n          <div class=\"field\"><span class=\"lbl-s\">Fecha<\u002Fspan><div class=\"val-or\" data-field=\"E6_FECHA\">{{E6_FECHA}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl-s\">Cantidad<\u002Fspan><div class=\"val-or\" data-field=\"E6_CANTIDAD\">{{E6_CANTIDAD}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field span2\"><span class=\"lbl-s\">Nombre y Firma<\u002Fspan><div class=\"val-or\" data-field=\"E6_FIRMA\">{{E6_FIRMA}}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div class=\"notes\" style=\"width:761px; height:8px\"><\u002Fdiv>\n\n  <div class=\"foot\">\n    <div class=\"foot-grid\">\n      <div class=\"field\"><div class=\"foot-line\"><\u002Fdiv><span class=\"foot-cap\">Autorizado · Nombre y firma<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><div class=\"foot-line\"><\u002Fdiv><span class=\"foot-cap\">Recibido · Nombre y firma<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot-note\">Documento interno THIQA · Recuperación de Vivienda · Tlajomulco de Zúñiga, Jalisco<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>`;\n\n    /* Recortes heredados de la ficha anterior: la hoja mide fijo y desborda en\n       silencio, así que un texto larguísimo empujaría el resto fuera de la\n       página en vez de avisar. */\n    const FICHA_MAX = { ESTATUS:34, CARTERA:22, RUTA:10, FOLIO:18, FECHA:12,\n      DOMICILIO:72, MONTO_RECUPERACION:18, FECHA_RECUPERACION:18, BONO:18,\n      HONORARIO_FIJO:18, EXP_DIGITAL:18, F_ASIGNACION:14, F_DESALOJO:14,\n      F_CONVENIO:14, CARTA_PODER:14, CUENTA_PREDIAL:16, LIDER:34,\n      E1_RESP:26, E1_FECHA:14, E1_FIRMA:48, E2_RESP:22, E2_FECHA:16,\n      E2_CANTIDAD:16, E2_FIRMA:22, E3_RESP:26, E3_FECHA:14, E3_FIRMA:48,\n      E4_RESP:26, E4_FECHA:14, E4_FIRMA:48, E5_RESP:26, E5_FECHA:14,\n      E5_FIRMA:48, E6_FECHA:16, E6_CANTIDAD:16, E6_FIRMA:52,\n      TAPEO_1:34, TAPEO_2:34, TAPEO_3:34, TAPEO_4:34 };\n\n    /* Campos que se imprimen como liga viva: al guardar como PDF, Chrome\n       conserva el <a>, así que desde el celular se abre Maps o la carpeta de\n       Drive sin teclear nada. El domicilio siempre lleva mapa, aunque el Sheet\n       no traiga la liga: mapaUrl() la arma con la dirección. */\n    const FICHA_LIGAS = { DOMICILIO: r => mapaUrl(r), EXP_DIGITAL: r => liga(r,'EXP_DIGITAL') };\n\n    function ficha(r){\n      const v = {};\n      for (const k of CAMPOS) v[k] = String(valor(r,k) ?? '');\n\n      if ($('autocalc').checked && !v.TOTAL_PAGAR){\n        const h = toNumber(v.HONORARIO_FIJO), b = toNumber(v.BONO);\n        if (!isNaN(h) || !isNaN(b)) v.TOTAL_PAGAR = fmtMoney((isNaN(h)?0:h) + (isNaN(b)?0:b));\n      }\n      if (!v.FECHA) v.FECHA = fmtFecha(new Date());\n      /* El formato repite honorario y bono abajo, en el presupuesto. */\n      v.HONORARIO_FIJO_2 = v.HONORARIO_FIJO;\n      v.BONO_2 = v.BONO;\n      /* La bitácora trae una sola columna de dinero acordado, \"MONTO ACORDADO\",\n         y esa ya alimenta el monto de recuperación de arriba. El formato lo pide\n         otra vez en el presupuesto, así que sin columna propia se repite en vez\n         de dejar el recuadro en blanco. */\n      if (!v.MONTO_ACORDADO) v.MONTO_ACORDADO = v.MONTO_RECUPERACION;\n\n      const d = document.createElement('div');\n      d.innerHTML = FICHA_TPL;\n\n      const logo = d.querySelector('.brand img');\n      if (logo) logo.src = LOGO;\n\n      /* La foto del líder sale del catálogo por nombre; sin foto se queda el\n         círculo punteado para pegarla a mano. */\n      const foto = fotoLider(r), av = d.querySelector('.avatar');\n      if (av && foto){\n        av.classList.add('con-foto');\n        av.querySelector('img').src = foto;\n        const ph = av.querySelector('span');\n        if (ph) ph.remove();\n      }\n\n      for (const el of d.querySelectorAll('[data-field]')){\n        const k = el.dataset.field;\n        /* Los huecos de foto se quedan vacíos: son para pegar en campo. El\n           CSS del formato los esconde mientras no tengan src. */\n        if (el.tagName === 'IMG'){ if (!el.getAttribute('src')) el.removeAttribute('src'); continue; }\n        const txt = clip(v[k] || '', FICHA_MAX[k] || 120);\n        const u = FICHA_LIGAS[k] ? FICHA_LIGAS[k](r) : '';\n        el.textContent = '';\n        if (txt && /^https?:\\/\\//i.test(u)){\n          const a = document.createElement('a');\n          a.href = u; a.textContent = txt;\n          el.appendChild(a);\n        } else if (txt){\n          el.textContent = txt;\n        }\n      }\n\n      const nc = norm(v.CARTERA);\n      for (const el of d.querySelectorAll('[data-cb]')){\n        const k = el.dataset.cb;\n        if (CARTERA_CB[k]) el.classList.toggle('on', CARTERA_CB[k].some(a => nc.includes(a)));\n        else el.classList.toggle('on', !!v['CANT_' + k]);\n      }\n\n      return d.innerHTML;\n    }\n\n    /* ---------- PDF ---------- */\n    $('btnpdf').onclick = () => {\n      const rows = [...S.sel].sort((a,b) => a-b).map(i => S.data[i]);\n      if (!rows.length) return;\n      $('printarea').innerHTML = rows.map(ficha).join('');\n      abrirModal('Se abrió el cuadro de impresión',\n        '<p style=\"margin:0;font-size:13.5px;color:var(--tx2);line-height:1.7\">En <b style=\"color:var(--tx)\">Destino<\u002Fb> elige ' +\n        '<b style=\"color:var(--tx)\">Guardar como PDF<\u002Fb>. Deja <b style=\"color:var(--tx)\">Márgenes: Ninguno<\u002Fb> y activa ' +\n        '<b style=\"color:var(--tx)\">Gráficos de fondo<\u002Fb> (está en “Más ajustes”), si no los recuadros salen en blanco.<\u002Fp>' +\n        '<p style=\"margin:12px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.7\">El PDF va a tener ' +\n        '<b style=\"color:var(--tx)\">' + rows.length + ' páginas<\u002Fb>, una por domicilio.<\u002Fp>');\n      const t = document.title;\n      document.title = 'Fichas de Seguimiento THIQA (' + rows.length + ')';\n      setTimeout(() => { window.print(); document.title = t; }, 220);\n    };\n\n    window.addEventListener('resize', () => {\n      const b = links.find(x => x.dataset.v === vista);\n      if (b) movePill(b);\n    });\n\n    contadores();\n    ir('datos');\n    requestAnimationFrame(() => movePill(links[0]));\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
