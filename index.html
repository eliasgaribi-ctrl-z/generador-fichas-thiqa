document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

11px;background:var(--surf);color:var(--tx2);font-weight:600;font-size:13px;cursor:pointer;transition:.18s\" style-hover=\"border-color:var(--nar);color:var(--nar2)\">Desenredar con IA<\u002Fbutton>\n            <button id=\"iaUndo\" style=\"display:none;align-items:center;gap:7px;min-height:38px;padding:8px 14px;border:1px solid transparent;\n              border-radius:11px;background:transparent;color:#C45454;font-weight:600;font-size:13px;cursor:pointer;transition:.18s\" style-hover=\"background:var(--surf2)\">Deshacer lo de la IA<\u002Fbutton>\n          <\u002Fdiv>\n          <div id=\"iaProg\" style=\"display:none;margin-top:16px\">\n            <div style=\"height:8px;border-radius:999px;background:var(--surf2);overflow:hidden\">\n              <div id=\"iaBar\" style=\"height:100%;width:0%;background:var(--nar);border-radius:999px;transition:width .3s\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex;gap:12px;align-items:center;margin-top:9px\">\n              <div id=\"iaEstado\" style=\"font-size:13px;color:var(--tx2)\">…<\u002Fdiv>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <button id=\"iaStop\" style=\"min-height:32px;padding:6px 12px;border:1px solid var(--brd2);border-radius:9px;\n                background:var(--surf);color:var(--tx2);font-weight:600;font-size:12.5px;cursor:pointer\">Detener<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div id=\"iaMsg\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);overflow:hidden\">\n          <div style=\"overflow:auto;max-height:min(60vh,600px)\"><sc-raw-table id=\"tbl\"><sc-raw-thead><\u002Fsc-raw-thead><sc-raw-tbody><\u002Fsc-raw-tbody><\u002Fsc-raw-table><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ================= EDITAR FICHA ================= -->\n      <div class=\"view\" id=\"v-ficha\" style=\"display:none\">\n        <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:20px;margin-bottom:16px\">\n          <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);margin-bottom:14px\">Domicilio<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n            <button id=\"prevCasa\" style=\"width:40px;height:44px;border:1px solid var(--brd2);border-radius:11px;background:var(--surf);\n              color:var(--tx2);cursor:pointer;display:grid;place-items:center;flex:none;transition:.18s\" style-hover=\"border-color:var(--nar);color:var(--nar2)\">\n              <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m14 6-6 6 6 6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n            <sc-raw-select id=\"casasel\" style=\"flex:1;min-width:240px\"><\u002Fsc-raw-select>\n            <button id=\"nextCasa\" style=\"width:40px;height:44px;border:1px solid var(--brd2);border-radius:11px;background:var(--surf);\n              color:var(--tx2);cursor:pointer;display:grid;place-items:center;flex:none;transition:.18s\" style-hover=\"border-color:var(--nar);color:var(--nar2)\">\n              <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m10 6 6 6-6 6\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n            <span id=\"edTag\"><\u002Fspan>\n            <button id=\"resetCasa\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:40px;padding:9px 14px;\n              border:1px solid rgba(196,84,84,.5);border-radius:11px;background:transparent;color:#C45454;font-weight:600;font-size:13px;\n              cursor:pointer;transition:.18s\" style-hover=\"background:rgba(196,84,84,.1)\">Deshacer mis cambios<\u002Fbutton>\n          <\u002Fdiv>\n          <p style=\"margin:13px 0 0;font-size:12.5px;color:var(--tx3);line-height:1.6;text-wrap:pretty\">\n            Lo que escribas aquí queda atado a este domicilio y se guarda solo en este navegador.\n            Los campos en blanco vienen vacíos del archivo: llénalos aquí o déjalos como línea para firmar a mano.\n          <\u002Fp>\n        <\u002Fdiv>\n\n        <div id=\"split\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,540px);gap:16px;align-items:start\">\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:20px;min-width:0\">\n            <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);margin-bottom:6px\">Datos de la ficha<\u002Fdiv>\n            <div id=\"editor\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div id=\"previaCard\" style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);\n            overflow:hidden;position:sticky;top:90px;min-width:0\">\n            <div style=\"padding:14px 18px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;background:var(--surf2)\">\n              <span style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3)\">Vista previa<\u002Fspan>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <button id=\"zoomOut\" style=\"width:32px;height:32px;border:1px solid var(--brd2);border-radius:9px;background:var(--surf);\n                color:var(--tx2);cursor:pointer;font-weight:700;transition:.18s\" style-hover=\"border-color:var(--nar);color:var(--nar2)\">−<\u002Fbutton>\n              <span id=\"zoomTxt\" style=\"font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;min-width:38px;text-align:center\">62%<\u002Fspan>\n              <button id=\"zoomIn\" style=\"width:32px;height:32px;border:1px solid var(--brd2);border-radius:9px;background:var(--surf);\n                color:var(--tx2);cursor:pointer;font-weight:700;transition:.18s\" style-hover=\"border-color:var(--nar);color:var(--nar2)\">+<\u002Fbutton>\n            <\u002Fdiv>\n            <div id=\"previa\" style=\"background:var(--surf2);padding:16px;overflow:auto\">\n              <div id=\"escala\" style=\"width:816px;transform-origin:top left;filter:drop-shadow(0 8px 24px rgba(16,38,56,.22))\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ================= AYUDA ================= -->\n      <!-- ================= DICTAR ================= -->\n      <div class=\"view\" id=\"v-dictar\" style=\"display:none\">\n        <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:24px 26px;margin-bottom:16px\">\n          <h3 style=\"margin:0;font-family:var(--ttl);font-size:20px;font-weight:700;color:var(--tx);letter-spacing:-.02em\">Dicta los domicilios<\u002Fh3>\n          <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">\n            Habla normal, de corrido y de varias casas si quieres: <i>“Boulevard República de Honduras 134,\n            Hacienda Santa Fe, Tlajomulco, cuadrilla de Teófilo, monto sesenta mil, bono quinientos”<\u002Fi>.\n            Al terminar, la IA separa cada domicilio y llena los campos de la ficha. Puedes corregir el\n            texto antes de crearlas, y también escribirlo o pegarlo en vez de dictarlo.\n          <\u002Fp>\n          <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:20px\">\n            <button id=\"dicMic\" style=\"display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:14px 22px;border:0;\n              border-radius:14px;background:var(--nar);color:#fff;font-weight:700;font-size:15px;cursor:pointer;\n              box-shadow:var(--shN);transition:transform .16s,filter .16s\" style-hover=\"transform:translateY(-2px)\">\n              <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"2.5\" width=\"6\" height=\"11\" rx=\"3\"><\u002Frect><path d=\"M5.5 11a6.5 6.5 0 0 0 13 0\"><\u002Fpath><path d=\"M12 17.5V21\"><\u002Fpath><\u002Fsvg>\n              <span id=\"dicMicTxt\">Empezar a dictar<\u002Fspan>\n            <\u002Fbutton>\n            <div id=\"dicEstado\" style=\"font-size:13.5px;color:var(--tx3)\"><\u002Fdiv>\n          <\u002Fdiv>\n          <label style=\"display:block;margin-top:18px\">\n            <span style=\"display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--tx3);margin-bottom:6px\">Lo que se oyó<\u002Fspan>\n            <textarea id=\"dicTexto\" rows=\"6\" placeholder=\"Aquí va apareciendo lo que dictes. También puedes escribir o pegar el texto.\"><\u002Ftextarea>\n          <\u002Flabel>\n          <div style=\"display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-top:14px\">\n            <button id=\"dicCrear\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:12px 20px;border:0;\n              border-radius:12px;background:var(--azul);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;\n              box-shadow:0 6px 18px rgba(30,74,114,.28);transition:transform .16s\" style-hover=\"transform:translateY(-2px)\">Crear fichas con esto<\u002Fbutton>\n            <button id=\"dicLimpiar\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 14px;border:1px solid transparent;\n              border-radius:11px;background:transparent;color:var(--tx3);font-weight:600;font-size:13px;cursor:pointer;transition:.18s\" style-hover=\"background:var(--surf2);color:var(--tx2)\">Borrar el texto<\u002Fbutton>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <button id=\"dicBorrarTodas\" style=\"display:none;align-items:center;gap:7px;min-height:38px;padding:8px 14px;border:1px solid transparent;\n              border-radius:11px;background:transparent;color:#C45454;font-weight:600;font-size:13px;cursor:pointer;transition:.18s\" style-hover=\"background:var(--surf2)\">Borrar las fichas dictadas<\u002Fbutton>\n          <\u002Fdiv>\n          <div id=\"dicMsg\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);overflow:hidden\">\n          <header style=\"display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--brd);background:var(--surf2)\">\n            <h3 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx);letter-spacing:-.01em\">Tu API key<\u002Fh3>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <div id=\"iaEstadoKey\" style=\"font-size:12.5px;color:var(--tx3)\">—<\u002Fdiv>\n          <\u002Fheader>\n          <div style=\"padding:20px\">\n            <p style=\"margin:0 0 14px;font-size:13px;color:var(--tx2);line-height:1.6;text-wrap:pretty\">\n              Esta página es un archivo estático: <b style=\"color:var(--tx)\">no hay servidor donde esconder una key<\u002Fb>,\n              así que usa la tuya. Se guarda solo en este navegador. Lo que dictes sí se manda completo al proveedor\n              que elijas, porque de ahí salen los datos de la ficha; el desenredado de direcciones del Excel, en cambio,\n              sigue mandando nada más la dirección y su ubicación.\n            <\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:15px;margin-bottom:14px\">\n              <label style=\"display:block\"><span style=\"display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--tx3);margin-bottom:6px\">Proveedor<\u002Fspan><sc-raw-select id=\"iaProv\"><\u002Fsc-raw-select><\u002Flabel>\n              <label style=\"display:block\"><span style=\"display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--tx3);margin-bottom:6px\">Modelo<\u002Fspan><input type=\"text\" id=\"iaModelo\" placeholder=\"modelo\"><\u002Flabel>\n              <label style=\"display:block\" id=\"iaBaseBox\"><span style=\"display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--tx3);margin-bottom:6px\">URL base<\u002Fspan><input type=\"text\" id=\"iaBase\" placeholder=\"https://api.groq.com/openai/v1\"><\u002Flabel>\n              <label style=\"display:block\"><span style=\"display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--tx3);margin-bottom:6px\">Tu API key<\u002Fspan><span style=\"position:relative;display:block\"><input type=\"password\" id=\"iaKey\" placeholder=\"pega aquí tu key\" autocomplete=\"new-password\" name=\"thiqa-api-key\" spellcheck=\"false\" autocapitalize=\"off\" autocorrect=\"off\" data-lpignore=\"true\" data-1p-ignore=\"true\" style=\"padding-right:70px\"><button type=\"button\" id=\"iaVer\" style=\"position:absolute;right:7px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--tx3);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.08em;cursor:pointer;padding:7px 8px;border-radius:8px\">ver<\u002Fbutton><\u002Fspan><\u002Flabel>\n            <\u002Fdiv>\n            <div id=\"iaDonde\" style=\"font-size:12.5px;color:var(--tx3);line-height:1.6;margin-bottom:14px\"><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;flex-wrap:wrap\">\n              <button id=\"iaSave\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 14px;border:1px solid var(--brd2);\n                border-radius:11px;background:var(--surf);color:var(--tx2);font-weight:600;font-size:13px;cursor:pointer;transition:.18s\" style-hover=\"border-color:var(--nar);color:var(--nar2)\">Guardar en este navegador<\u002Fbutton>\n              <button id=\"iaProbar\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 14px;border:1px solid var(--brd2);\n                border-radius:11px;background:var(--surf);color:var(--tx2);font-weight:600;font-size:13px;cursor:pointer;transition:.18s\">Probar mi key<\u002Fbutton>\n              <button id=\"iaForget\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 14px;border:1px solid transparent;\n                border-radius:11px;background:transparent;color:var(--tx3);font-weight:600;font-size:13px;cursor:pointer;transition:.18s\" style-hover=\"background:var(--surf2);color:var(--tx2)\">Olvidar mi key<\u002Fbutton>\n            <\u002Fdiv>\n            <div id=\"iaKeyMsg\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"view\" id=\"v-ayuda\" style=\"display:none\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:16px\">\n          <div style=\"grid-column:1/-1;background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:24px 26px\">\n            <h3 style=\"margin:0;font-family:var(--ttl);font-weight:700;font-size:22px;color:var(--tx);letter-spacing:-.02em\">Cuatro pasos, del Drive al PDF<\u002Fh3>\n            <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin-top:20px\">\n              <div style=\"padding:16px;border:1px solid var(--brd);border-radius:13px;background:var(--surf2)\">\n                <div style=\"width:28px;height:28px;border-radius:9px;background:var(--nar);color:#fff;display:grid;place-items:center;\n                  font-family:var(--ttl);font-weight:700;font-size:13px\">1<\u002Fdiv>\n                <b style=\"display:block;margin-top:11px;font-size:14px;color:var(--tx)\">Baja el archivo<\u002Fb>\n                <p style=\"margin:5px 0 0;font-size:13px;color:var(--tx2);line-height:1.6;text-wrap:pretty\">En el Sheet maestro: <i>Archivo → Descargar → Microsoft Excel (.xlsx)<\u002Fi>. Trae todo lo que las cuadrillas capturaron en AppSheet.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"padding:16px;border:1px solid var(--brd);border-radius:13px;background:var(--surf2)\">\n                <div style=\"width:28px;height:28px;border-radius:9px;background:var(--nar);color:#fff;display:grid;place-items:center;\n                  font-family:var(--ttl);font-weight:700;font-size:13px\">2<\u002Fdiv>\n                <b style=\"display:block;margin-top:11px;font-size:14px;color:var(--tx)\">Súbelo y revisa<\u002Fb>\n                <p style=\"margin:5px 0 0;font-size:13px;color:var(--tx2);line-height:1.6;text-wrap:pretty\">La app sola busca la hoja de los domicilios, la fila de encabezados y a qué campo va cada columna. Tú nada más corriges lo que no acertó, y se recuerda para la próxima.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"padding:16px;border:1px solid var(--brd);border-radius:13px;background:var(--surf2)\">\n                <div style=\"width:28px;height:28px;border-radius:9px;background:var(--nar);color:#fff;display:grid;place-items:center;\n                  font-family:var(--ttl);font-weight:700;font-size:13px\">3<\u002Fdiv>\n                <b style=\"display:block;margin-top:11px;font-size:14px;color:var(--tx)\">Elige los domicilios<\u002Fb>\n                <p style=\"margin:5px 0 0;font-size:13px;color:var(--tx2);line-height:1.6;text-wrap:pretty\">Llegan prendidas las que traen convenio confirmado —<b style=\"color:var(--tx)\">Próximas Recuperaciones<\u002Fb> y <b style=\"color:var(--tx)\">Recuperadas<\u002Fb>—; los demás estatus vienen apagados y se prenden con su casilla. Afina por cartera, cuadrilla o ruta, y palomea los que quieres imprimir.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"padding:16px;border:1px solid var(--brd);border-radius:13px;background:var(--surf2)\">\n                <div style=\"width:28px;height:28px;border-radius:9px;background:var(--nar);color:#fff;display:grid;place-items:center;\n                  font-family:var(--ttl);font-weight:700;font-size:13px\">4<\u002Fdiv>\n                <b style=\"display:block;margin-top:11px;font-size:14px;color:var(--tx)\">Ajusta y genera<\u002Fb>\n                <p style=\"margin:5px 0 0;font-size:13px;color:var(--tx2);line-height:1.6;text-wrap:pretty\">En <i>Editar ficha<\u002Fi> cambias montos, fechas y responsables. Luego <i>Generar PDF<\u002Fi> saca un archivo con una ficha por página.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">Sin Excel: dictar<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">En <b style=\"color:var(--tx)\">Dictar<\u002Fb> hablas de corrido —hasta varias casas seguidas— y la IA separa cada domicilio y llena los campos. Las fichas que salen de ahí se juntan con las del Excel: se filtran, se editan y se imprimen igual, y entran con el estatus <b style=\"color:var(--tx)\">Dictada<\u002Fb> para que las distingas. Se quedan guardadas en este navegador aunque cierres la página. Necesita tu API key y funciona en Chrome o Edge; si tu navegador no dicta, escribe o pega el texto y sirve igual.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">La liga del mapa<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">Cada ficha sale con el <b style=\"color:var(--tx)\">Cómo llegar<\u002Fb> ligado: si el Sheet ya traía la liga de Maps en la celda, se respeta ésa; si no, se arma sola con el domicilio, la colonia, el C.P. y el municipio. No cuesta nada ni sale nada de tu navegador. En el PDF la liga sigue viva: desde el celular abre el mapa.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">Desenredar direcciones con IA<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">Es opcional y sirve para las direcciones que llegan pegadas, tipo <i>AV BOGOTA275SANTA FE00630TLAJOMULCO<\u002Fi>. Como esta página no tiene servidor, <b style=\"color:var(--tx)\">no hay dónde esconder una API key<\u002Fb>: pones la tuya y se guarda solo en este navegador. De cada domicilio sale <b style=\"color:var(--tx)\">nada más la dirección, colonia, C.P., municipio y estado<\u002Fb> — nunca el nombre, el crédito, el expediente ni los montos. Lo que reescriba queda marcado como edición tuya y puedes deshacerlo.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">Dictar por voz<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">Los campos de texto traen micrófono. Pícalo, habla, y el texto se escribe solo. Necesita internet y permiso del navegador; funciona en Chrome y Edge.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">Al guardar el PDF<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">Se abre el cuadro de impresión: en <b style=\"color:var(--tx)\">Destino<\u002Fb> elige <b style=\"color:var(--tx)\">Guardar como PDF<\u002Fb>, deja <b style=\"color:var(--tx)\">Márgenes: Ninguno<\u002Fb> y activa <b style=\"color:var(--tx)\">Gráficos de fondo<\u002Fb>. Si no, los recuadros salen en blanco.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">Ojo con las fórmulas<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">Google Sheets a veces exporta las columnas de fórmula sin el resultado y llegan vacías. Si la app te avisa, en el Sheet copia esas columnas y usa <i>Editar → Pegado especial → Pegar solo valores<\u002Fi> antes de descargar.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:22px\">\n            <h4 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx)\">Dónde se guarda lo que escribes<\u002Fh4>\n            <p style=\"margin:8px 0 0;font-size:13.5px;color:var(--tx2);line-height:1.65;text-wrap:pretty\">Solo en este navegador y en esta computadora. Si borras los datos del navegador o abres la app en otro equipo, esas ediciones no están. Lo que viene del Sheet siempre se vuelve a leer del archivo.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"savebar\" style=\"position:fixed;left:calc(var(--side) + 24px);right:24px;bottom:18px;z-index:70;\n  background:color-mix(in srgb,var(--surf) 88%,transparent);backdrop-filter:blur(16px) saturate(1.5);\n  border:1px solid var(--brd);border-radius:18px;padding:12px 18px;box-shadow:var(--sh2);\n  transform:translateY(160%);opacity:0;transition:transform .42s cubic-bezier(.34,1.15,.5,1),opacity .3s\">\n  <div style=\"display:flex;gap:14px;align-items:center;flex-wrap:wrap\">\n    <div style=\"width:40px;height:40px;border-radius:12px;background:var(--narL);display:grid;place-items:center;flex:none\">\n      <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--nar2)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 2h9l5 5v15H6z\"><\u002Fpath><path d=\"M15 2v5h5\"><\u002Fpath><path d=\"M9.5 13.5h5M9.5 17h5\"><\u002Fpath><\u002Fsvg>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3)\">Listas para imprimir<\u002Fdiv>\n      <div style=\"font-family:var(--ttl);font-weight:700;font-size:21px;color:var(--tx);font-variant-numeric:tabular-nums;letter-spacing:-.02em\">\n        <span id=\"nsel\">0<\u002Fspan> <span style=\"font-size:14px;font-weight:600;color:var(--tx3)\">fichas<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1\"><\u002Fdiv>\n    <button id=\"btnEditar\" style=\"display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:12px 18px;\n      border:1px solid var(--azul);border-radius:13px;background:transparent;color:var(--azul);font-weight:700;font-size:14px;\n      cursor:pointer;transition:.18s\" style-hover=\"background:var(--azulL)\">Editar la seleccionada<\u002Fbutton>\n    <button id=\"btnpdf\" style=\"display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:12px 24px;border:0;\n      border-radius:13px;background:var(--nar);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;box-shadow:var(--shN);\n      transition:transform .16s,box-shadow .16s\" style-hover=\"transform:translateY(-2px);box-shadow:0 12px 30px rgba(240,126,34,.45)\" style-active=\"transform:translateY(0)\">\n      <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M6 9V3h12v6\"><\u002Fpath><path d=\"M6 18H4v-6h16v6h-2\"><\u002Fpath><path d=\"M6 14h12v7H6z\"><\u002Fpath><\u002Fsvg>\n      Generar PDF<\u002Fbutton>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"modal\" style=\"position:fixed;inset:0;background:rgba(10,24,38,.55);backdrop-filter:blur(6px);z-index:120;\n  display:none;align-items:center;justify-content:center;padding:20px;opacity:0;transition:opacity .25s\">\n  <div id=\"modalBox\" style=\"background:var(--surf);max-width:640px;width:100%;max-height:86vh;overflow:auto;border-radius:18px;\n    border:1px solid var(--brd);box-shadow:var(--sh2);transform:scale(.94) translateY(14px);transition:transform .3s cubic-bezier(.34,1.2,.5,1)\">\n    <header style=\"display:flex;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--brd)\">\n      <h3 id=\"mTitle\" style=\"margin:0;font-family:var(--ttl);font-size:18px;font-weight:700;color:var(--tx)\">Cómo se usa<\u002Fh3>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <button id=\"mClose\" style=\"width:36px;height:36px;border:0;border-radius:10px;background:var(--surf2);color:var(--tx2);\n        cursor:pointer;display:grid;place-items:center;transition:.18s\" style-hover=\"background:var(--narL);color:var(--nar2)\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\"><path d=\"M6 6l12 12M18 6 6 18\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n    <\u002Fheader>\n    <div id=\"mBody\" style=\"padding:22px\"><\u002Fdiv>\n    <footer style=\"padding:16px 22px;border-top:1px solid var(--brd);text-align:right\">\n      <button id=\"mOk\" style=\"display:inline-flex;align-items:center;min-height:44px;padding:11px 22px;border:0;border-radius:12px;\n        background:var(--azul);color:#fff;font-weight:700;font-size:14px;cursor:pointer;transition:.18s\" style-hover=\"filter:brightness(1.12)\">Entendido<\u002Fbutton>\n    <\u002Ffooter>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"toasts\" style=\"position:fixed;top:18px;right:18px;z-index:300;display:flex;flex-direction:column;gap:10px;pointer-events:none\"><\u002Fdiv>\n\n<div id=\"printarea\"><\u002Fdiv>\n\n\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;acento&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F07E22&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#F07E22&quot;,&quot;#E8892B&quot;,&quot;#D9534F&quot;,&quot;#1F7A5A&quot;],&quot;section&quot;:&quot;Marca&quot;},&quot;tema&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Claro&quot;,&quot;options&quot;:[&quot;Claro&quot;,&quot;Oscuro&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Marca&quot;},&quot;densidad&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;Cómoda&quot;,&quot;options&quot;:[&quot;Cómoda&quot;,&quot;Compacta&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Interfaz&quot;},&quot;animaciones&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Interfaz&quot;}}\">\nclass Component extends DCLogic {\n  componentDidUpdate(){ this.aplicaProps(); }\n\n  aplicaProps(){\n    const p = this.props || {}, R = document.documentElement;\n    const ac = p.acento || '#F07E22';\n    R.style.setProperty('--nar', ac);\n    R.style.setProperty('--shN', '0 8px 24px ' + ac + '55');\n    R.dataset.anim = (p.animaciones === false) ? '0' : '1';\n    const d = p.densidad || 'Cómoda';\n    R.style.setProperty('--pad', d === 'Compacta' ? '14px' : '20px');\n    if (p.tema === 'Oscuro') this.setTema('dark');\n    else if (p.tema === 'Claro') this.setTema('light');\n  }\n\n  setTema(t){\n    document.documentElement.dataset.theme = t;\n    try { localStorage.setItem('thiqa_tema', t); } catch(e){}\n    const i = document.getElementById('icoTema');\n    if (i) i.innerHTML = t === 'dark'\n      ? '<path d=\"M20.5 14.6A8.6 8.6 0 0 1 9.4 3.5a8.7 8.7 0 1 0 11.1 11.1Z\"><\u002Fpath>'\n      : '<circle cx=\"12\" cy=\"12\" r=\"4.2\"><\u002Fcircle><path d=\"M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4\"><\u002Fpath>';\n  }\n\n  componentDidMount(){\n    const self = this;\n    let saved = 'light';\n    try { saved = localStorage.getItem('thiqa_tema') || 'light'; } catch(e){}\n    this.setTema(saved);\n    this.aplicaProps();\n\n    const $ = id => document.getElementById(id);\n    const esc = s => String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));\n    const LOGO = window.THIQA_LOGO || '';\n    if ($('logo')) $('logo').src = LOGO;\n\n    /* ---------- toasts ---------- */\n    function toast(msg, tipo){\n      const box = $('toasts'); if (!box) return;\n      const col = tipo === 'err' ? '#C45454' : tipo === 'ok' ? 'var(--ok)' : 'var(--nar)';\n      const el = document.createElement('div');\n      el.style.cssText = 'pointer-events:auto;max-width:340px;background:var(--surf);border:1px solid var(--brd);' +\n        'border-left:4px solid ' + col + ';border-radius:13px;box-shadow:var(--sh2);padding:13px 16px;' +\n        'font-size:13.5px;color:var(--tx);line-height:1.5;animation:tq-slide .34s cubic-bezier(.2,.7,.3,1) both';\n      el.innerHTML = msg;\n      box.appendChild(el);\n      setTimeout(() => { el.style.transition = 'opacity .3s,transform .3s';\n        el.style.opacity = '0'; el.style.transform = 'translateX(24px)';\n        setTimeout(() => el.remove(), 320); }, 3400);\n    }\n\n    /* ---------- campos de la ficha ---------- */\n    const GRUPOS = [\n      { t:'Encabezado', open:true, f:[\n        ['FOLIO','N° Folio','t',['folio thiqa','folio','no folio','numero de folio','id']],\n        ['CARTERA','Cartera / Proyecto','t',['fuente','cartera','proyecto','origen','base']],\n        ['RUTA','Ruta','t',['no, ruta','no. ruta','no ruta','ruta','num ruta','numero de ruta']],\n        ['ORDEN_VISITA','Orden de visita','t',['orden visita','orden de visita','no visita','orden']],\n        ['FECHA','Fecha de la ficha','f',['fecha','fecha ficha','f. ficha','fecha de emision']],\n        ['ESTATUS','Estatus','t',['estatus ruta','estatus recup.','estatus recuperacion','estatus','status','estado']],\n      ]},\n      { t:'Datos de la casa', open:true, f:[\n        ['DOMICILIO','Domicilio','t',['direccion','domicilio','dirección','calle','ubicacion','direccion completa']],\n        ['COLONIA','Colonia','t',['colonia','fraccionamiento','fracc','col']],\n        ['CP','C.P.','t',['cp','c.p.','codigo postal','codigo_postal']],\n        ['MUNICIPIO','Municipio','t',['municipio','delegacion','alcaldia']],\n        ['ENTIDAD','Entidad','t',['entidad','estado','entidad federativa']],\n        ['MAPA','Liga de ubicación','t',['link','liga','mapa','google maps','maps','link mapa','ubicacion maps']],\n        ['ACREDITADO','Acreditado / Ocupante','t',['nombre','acreditado','deudor','titular','demandado','nombre del acreditado']],\n        ['LIDER','Líder de cuadrilla','t',['cuadrilla','lider','líder','lider de cuadrilla','responsable','equipo','brigada']],\n        ['CARACTERISTICAS','Características del domicilio','t',['caracteristicas del domicilio','caracteristicas','descripcion del inmueble','descripcion']],\n        ['COMENTARIOS','Pendientes / Comentarios','t',['notas','comentarios','observaciones','pendientes','alerta / accion','nota']],\n      ]},\n      { t:'Expediente y cartera', open:false, f:[\n        ['EXP_DIGITAL','Exp. digital (liga)','t',['exp digital','exp. digital','expediente digital','carpeta digital']],\n        ['EXP_JUDICIAL','Exp. judicial (liga)','t',['exp judicial','exp. judicial','expediente judicial','carpeta judicial']],\n        ['EXPEDIENTE','N° de expediente','t',['expediente','no expediente','numero de expediente','no. expediente']],\n        ['JUZGADO','Juzgado','t',['juzgado','juzgado que conoce','tribunal']],\n        ['ETAPA_JUDICIAL','Etapa judicial','t',['etapa judicial','etapa procesal','etapa']],\n        ['ACREEDOR','Acreedor','t',['acreedor','institucion','banco','fideicomiso']],\n        ['NO_CREDITO','N° de crédito','t',['no credito','no. credito','numero de credito','credito','no_credito']],\n        ['FOLIO_REAL','Folio real','t',['folio real','folio_real','folio registral']],\n        ['CARTA_PODER','Carta poder','t',['carta poder','carta_poder','poder']],\n        ['CUENTA_PREDIAL','Cuenta predial','t',['cuenta predial','cuenta_predial','predial']],\n        ['ADEUDO_PREDIAL','Adeudo predial','n',['adeudo predial','adeudo_predial','adeudo de predial','adeudo']],\n      ]},\n      { t:'Fechas clave', open:false, f:[\n        ['F_ASIGNACION','F. asignación','f',['f. asignacion','f asignacion','fecha asignacion','fecha de asignacion']],\n        ['F_DESALOJO','F. desalojo acordada','f',['f. desalojo acordada','f desalojo acordada','fecha desalojo','f. desalojo','desalojo acordada']],\n        ['F_CONVENIO','F. convenio firmado','f',['f. convenio firmado','f convenio firmado','fecha convenio','f. convenio','convenio firmado']],\n      ]},\n      { t:'Dinero', open:true, f:[\n        ['MONTO_RECUPERACION','Monto de recuperación','n',['monto acordado','monto recuperacion','monto de recuperacion','monto','importe','monto recup']],\n        ['FECHA_RECUPERACION','Fecha de recuperación','f',['f. recuperacion','fecha recuperacion','fecha de recuperacion','f recuperacion']],\n        ['HONORARIO_FIJO','Honorario fijo','n',['monto honorarios','honorario fijo','honorarios','honorario']],\n        ['BONO','Bono','n',['bono','bonos','incentivo']],\n        ['TOTAL_PAGAR','Total a pagar','n',['total a pagar','total pagar','total']],\n        ['MONTO_MAXIMO','Monto máximo por casa','n',['monto maximo por casa','monto maximo','tope por casa','maximo por casa']],\n        ['PRESUPUESTO','Presupuesto autorizado','n',['presupuesto autorizado','presupuesto','autorizado']],\n        ['MONTO_TOTAL','Monto total','n',['monto total','gran total','total general']],\n        ['PROMEDIO','Promedio $$','n',['promedio','promedio $$','prom']],\n      ]},\n      { t:'Etapa 1 · Solicitud de recurso', open:false, f:[\n        ['E1_RESP','Responsable','t',['e1 responsable','responsable e1','solicita recurso']],\n        ['E1_FECHA','Fecha','f',['e1 fecha','fecha solicitud recurso','f. solicitud recurso','solicitar anticipo hon']],\n        ['E1_FIRMA','Nombre y firma','t',['e1 firma','firma solicitud']],\n      ]},\n      { t:'Etapa 2 · Entrega de recurso', open:false, f:[\n        ['E2_FECHA','Fecha','f',['e2 fecha','fecha entrega recurso','f. entrega recurso','f. entrega acordada']],\n        ['E2_CANTIDAD','Cantidad','n',['e2 cantidad','cantidad recurso','monto recurso','anticipo']],\n        ['E2_RESP','Responsable','t',['e2 responsable','entrega recurso']],\n        ['E2_FIRMA','Nombre y firma','t',['e2 firma','firma entrega recurso']],\n      ]},\n      { t:'Etapa 3 · Materiales y tapeos', open:false, f:[\n        ['E3_RESP','Responsable','t',['e3 responsable','responsable materiales']],\n        ['E3_FECHA','Fecha','f',['e3 fecha','fecha materiales']],\n        ['E3_FIRMA','Nombre y firma','t',['e3 firma','firma materiales']],\n        ['TAPEO_1','Medida de tapeo 1','t',['tapeo 1','tapeo1','medida tapeo 1','tapeo']],\n        ['TAPEO_2','Medida de tapeo 2','t',['tapeo 2','tapeo2','medida tapeo 2']],\n        ['TAPEO_3','Medida de tapeo 3','t',['tapeo 3','medida tapeo 3']],\n        ['TAPEO_4','Medida de tapeo 4','t',['tapeo 4','medida tapeo 4']],\n        /* Sin el alias 'monto acordado': esa columna ya la reclama\n           MONTO_RECUPERACION y quitársela dejaría sin monto a los archivos\n           que hoy funcionan. Si el Sheet trae las dos, esta se empata a mano. */\n        ['MONTO_ACORDADO','Monto acordado','n',['monto convenido','convenido','acordado']],\n        ['TOTAL_MATERIALES','Total materiales','n',['total materiales','costo materiales','importe materiales']],\n      ]},\n      { t:'Cantidades de material', open:false, f:[\n        ['CANT_BLOCK','Block','c',['block','blocks','cant block']],\n        ['CANT_CEMENTO','Cemento','c',['cemento','cant cemento']],\n        ['CANT_ARENA','Arena','c',['arena','cant arena']],\n        ['CANT_GRAVA','Grava','c',['grava','cant grava']],\n        ['CANT_VARILLA','Varilla','c',['varilla','cant varilla']],\n        ['CANT_ARMEX','Armex / Castillo','c',['armex','castillo','cant armex']],\n        ['CANT_ALAMBRE','Alambre recocido','c',['alambre','alambre recocido']],\n        ['CANT_CAL','Cal / Mortero','c',['cal','mortero','cal mortero']],\n        ['CANT_CIMBRA','Cimbra (madera)','c',['cimbra','madera']],\n        ['CANT_CLAVOS','Clavos','c',['clavos','clavo']],\n      ]},\n      { t:'Etapas 4 a 6', open:false, f:[\n        ['E4_RESP','E4 · Responsable (avance de obra)','t',['e4 responsable','responsable obra']],\n        ['E4_FECHA','E4 · Fecha','f',['e4 fecha','fecha avance obra']],\n        ['E4_FIRMA','E4 · Nombre y firma','t',['e4 firma']],\n        ['E5_RESP','E5 · Responsable (supervisión)','t',['e5 responsable','supervisor','encargado']],\n        ['E5_FECHA','E5 · Fecha','f',['e5 fecha','fecha supervision']],\n        ['E5_FIRMA','E5 · Nombre y firma','t',['e5 firma']],\n        ['E6_FECHA','E6 · Fecha (entrega honorarios)','f',['f. pago honorarios','pago honorarios prog.','e6 fecha','fecha honorarios']],\n        ['E6_CANTIDAD','E6 · Cantidad','n',['e6 cantidad','cantidad honorarios','monto honorarios']],\n        ['E6_FIRMA','E6 · Nombre y firma','t',['e6 firma','firma honorarios']],\n      ]},\n      { t:'Control', open:false, f:[\n        ['ACTUALIZADO_POR','Actualizado por','t',['actualizado por','capturo','responsable de captura']],\n        ['ULTIMA_ACTUALIZACION','Última actualización','f',['ultima actualizacion','ultima_actualizacion','fecha actualizacion']],\n      ]},\n    ];\n    const CAMPOS = GRUPOS.flatMap(g => g.f.map(x => x[0]));\n    const TIPO = Object.fromEntries(GRUPOS.flatMap(g => g.f.map(x => [x[0], x[2]])));\n    const MONEY_FIELDS = new Set(CAMPOS.filter(k => TIPO[k] === 'n'));\n\n    const norm = s => String(s ?? '').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'')\n      .toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();\n\n    /* Dos pasadas globales: primero se reparten TODOS los nombres que\n       coinciden exactos y hasta después se intenta el parecido. Si fuera una\n       sola pasada por campo, un alias corto como \"monto\" se robaría\n       \"MONTO HONORARIOS\" antes de que le tocara su turno a Honorario fijo. */\n    function adivinar(headers){\n      const H = headers.map(norm), map = {}, usadas = new Set();\n      const CAMPOS_AL = GRUPOS.flatMap(g => g.f.map(x => [x[0], x[3].map(norm)]));\n\n      for (const [key, alias] of CAMPOS_AL){\n        for (const na of alias){\n          const i = H.findIndex((h,ix) => h === na && !usadas.has(ix));\n          if (i >= 0){ map[key] = i; usadas.add(i); break; }\n        }\n      }\n      for (const [key, alias] of CAMPOS_AL){\n        if (map[key] !== undefined) continue;\n        for (const na of alias){\n          if (na.length < 5) continue;\n          const i = H.findIndex((h,ix) => h && !usadas.has(ix) && (' '+h+' ').includes(' '+na+' '));\n          if (i >= 0){ map[key] = i; usadas.add(i); break; }\n        }\n      }\n      return map;\n    }\n\n    const pad = n => String(n).padStart(2,'0');\n    const fmtFecha = d => pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '/' + d.getFullYear();\n    const fmtMoney = n => '$' + n.toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});\n\n    function toNumber(v){\n      if (typeof v === 'number') return v;\n      if (v instanceof Date) return NaN;\n      const s = String(v ?? '').replace(/[^0-9.,\\-]/g,'').replace(/,/g,'');\n      const n = parseFloat(s);\n      return isNaN(n) ? NaN : n;\n    }\n    function fmt(v, campo){\n      if (v === null || v === undefined || v === '') return '';\n      if (v instanceof Date) return fmtFecha(v);\n      if (typeof v === 'number')\n        return MONEY_FIELDS.has(campo) ? fmtMoney(v)\n          : (Number.isInteger(v) ? String(v) : String(Math.round(v*100)/100));\n      const s = String(v).trim();\n      if (['#N/A','#REF!','#VALUE!','null','undefined'].includes(s)) return '';\n      if (MONEY_FIELDS.has(campo)){\n        const n = toNumber(s);\n        if (!isNaN(n) && /\\d/.test(s)) return fmtMoney(n);\n      }\n      return s;\n    }\n    const clip = (s, max) => { s = String(s); return s.length > max ? s.slice(0, max-1) + '…' : s; };\n\n    /* ---------- estado ---------- */\n    const S = { rows:[], headers:[], todas:[], dictadas:[], data:[], map:{}, sel:new Set(),\n                estatusOff:new Set(), ov:{}, cur:0, wb:null, zoom:.62 };\n    /* Una ficha solo tiene caso cuando el convenio ya está confirmado, y eso son\n       dos estatus: próxima recuperación y recuperada. Esos llegan prendidos; todo\n       lo demás llega apagado en el filtro, no descartado, así que si de veras\n       hace falta una ficha basta prender su casilla. Se compara contra norm(),\n       que ya quitó acentos y dejó la puntuación en espacios: \"Próx. Recuperación\"\n       llega aquí como \"prox recuperacion\". */\n    const CON_CONVENIO = /^(?:prox|proximas?)? ?recupera(?:d[ao]s?|cion(?:es)?)$/;\n    const LSKEY = 'thiqa_fichas_v2';\n    /* Una fila dictada no sale de ninguna columna: trae sus valores encima. */\n    const crudo = (r,k) => r.__dict\n      ? fmt(r.__dict[k], k)\n      : (S.map[k] === undefined ? '' : fmt(r[S.map[k]], k));\n    function llave(r){\n      if (r.__id) return r.__id;\n      const f = norm(crudo(r,'FOLIO')), d = norm(crudo(r,'DOMICILIO'));\n      return (f && d) ? f + '|' + d : (f || d || 'fila');\n    }\n    /* Lo que trae el archivo para un campo, ya sin las ediciones a mano.\n\n       El domicilio bueno vive en la columna Link, no en DOMICILIO: en el Sheet\n       esa celda guarda el texto de la dirección ya corregida y la URL de Maps\n       cuelga aparte, mientras que DOMICILIO es la que llega pegada o ilegible\n       (\"AV TEMUCO286SANTA FE00630TLAJOMULCO\"). Se usa el texto de Link cuando lo\n       hay; si esa celda trae una URL como texto no sirve de dirección y manda\n       DOMICILIO. Ojo: llave() sigue calculándose con crudo(), para que las\n       ediciones guardadas antes de este cambio no pierdan su fila. */\n    function base(r,k){\n      if (k === 'DOMICILIO'){\n        const t = String(crudo(r,'MAPA') || '').trim();\n        if (t && !/^https?:\\/\\//i.test(t)) return t;\n      }\n      return crudo(r,k) || liga(r,k);\n    }\n    function valor(r,k){\n      const o = S.ov[llave(r)];\n      if (o && o[k] !== undefined && o[k] !== null) return o[k];\n      return base(r,k);\n    }\n    /* La URL de una celda no vive en la celda: el Excel la guarda aparte y el\n       lector la deja en __links. Sin esto, la columna LINK sale como texto y\n       la liga de Maps se pierde al imprimir. */\n    function liga(r,k){\n      const ci = S.map[k], L = S.rows && S.rows.__links;\n      if (ci === undefined || r.__fila === undefined || !L) return '';\n      return (L[r.__fila] && L[r.__fila][ci]) || '';\n    }\n\n    /* Foto de perfil de cada líder de cuadrilla, para que la ficha la ponga sola\n       en vez de andarla subiendo domicilio por domicilio.\n\n       La llave es el nombre ya norm
