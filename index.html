havior:'smooth', block:'nearest'});\n    };\n    $('savemap').onclick = () => {\n      guardar(true);\n      $('savemap').textContent = '\u2713 Guardada';\n      toast('Configuraci\u00f3n de columnas recordada.','ok');\n      setTimeout(() => $('savemap').textContent = 'Recordar esta configuraci\u00f3n', 1800);\n    };\n    $('clearmap').onclick = () => {\n      S.map = {};\n      for (const s of $('maps').querySelectorAll('select')){ s.value = ''; s.closest('label').classList.remove('ok'); }\n      cuentaMapeo();\n    };\n    function desbloquear(){\n      datosListos = true;\n      links.forEach(b => {\n        if (b.dataset.v === 'casas' || b.dataset.v === 'ficha'){\n          b.disabled = false; b.style.opacity = '1'; b.style.cursor = 'pointer';\n        }\n      });\n    }\n    $('tocasas').onclick = () => {\n      if (!S.data.length) return;\n      desbloquear();\n      ir('casas');\n    };\n\n    $('obraBtn').onclick = () => $('obraFile').click();\n    $('obraFile').onchange = async e => {\n      const f = e.target.files[0];\n      if (!f) return;\n      $('obraSt').textContent = 'Leyendo ' + f.name + '\u2026';\n      try {\n        const n = await cargarObra(f);\n        const conObra = S.data.filter(r => obraDe(r)).length;\n        $('obraSt').innerHTML = '<b style=\"color:var(--tx)\">' + f.name + '<\u002Fb> \u00b7 ' + n +\n          (n === 1 ? ' vivienda tapeada' : ' viviendas tapeadas') +\n          (S.data.length ? ', ' + conObra + ' empatada' + (conObra === 1 ? '' : 's') + ' con tus domicilios' : '') + '.';\n        $('obraQuita').style.display = 'inline-flex';\n        toast('Control de obra cargado: <b>' + n + '<\u002Fb> viviendas.','ok');\n        refrescarObra();\n      } catch(err){\n        S.obra = [];\n        /* Nunca el mensaje crudo del navegador: aqu\u00ed acaba mucha gente que quiso\n           subir la bit\u00e1cora y le atin\u00f3 al selector de al lado, y un error en\n           ingl\u00e9s la deja creyendo que rompi\u00f3 algo. */\n        $('obraSt').innerHTML = '<span style=\"color:#C45454\">Ese archivo no trae la forma del ' +\n          'control de obra.<\u002Fspan><br><span style=\"color:var(--tx3)\">Si es la bit\u00e1cora de ' +\n          'domicilios, s\u00fabela aqu\u00ed arriba, en el recuadro punteado.<\u002Fspan>';\n      }\n      e.target.value = '';\n    };\n    $('obraQuita').onclick = () => {\n      S.obra = [];\n      $('obraSt').textContent = '';\n      $('obraQuita').style.display = 'none';\n      refrescarObra();\n    };\n    /* El control de obra cambia lo que ya est\u00e1 pintado, as\u00ed que hay que rehacer\n       la tabla y la previa; si todav\u00eda no hay domicilios no hay nada que rehacer. */\n    function refrescarObra(){\n      if (!S.data.length) return;\n      tabla();\n      if (typeof previa === 'function' && S.data[S.cur]) previa();\n    }\n\n    /* ---------- domicilios ---------- */\n    function unicos(k){\n      const set = new Set();\n      for (const r of S.data){ const v = valor(r,k); if (v) set.add(v); }\n      return [...set].sort((a,b) => String(a).localeCompare(String(b),'es'));\n    }\n    function filtros(){\n      [['fCartera','CARTERA','Todas'],['fLider','LIDER','Todas'],['fRuta','RUTA','Todas']].forEach(x => {\n        /* Se repinta al entrar a la vista, as\u00ed que hay que conservar lo que el\n           usuario ya ten\u00eda elegido: reemplazar el innerHTML lo borrar\u00eda. */\n        const antes = $(x[0]).value;\n        $(x[0]).innerHTML = '<option value=\"\">' + x[2] + '<\u002Foption>' +\n          unicos(x[1]).map(v => '<option>' + esc(v) + '<\u002Foption>').join('');\n        if (antes) $(x[0]).value = antes;\n      });\n      pintarEstatus();\n    }\n\n    /* El estatus lo mueven los l\u00edderes desde la app de campo, as\u00ed que un archivo\n       reci\u00e9n bajado trae la ruta repartida entre varios estados. Van como\n       casillas y no como desplegable porque una corrida normal junta m\u00e1s de uno\n       (p. ej. \"Prox. Recuperacion\" con \"Recuperada\"). Arrancan prendidas las que\n       traen convenio confirmado. */\n    function pintarEstatus(){\n      const vals = unicos('ESTATUS');\n      S.estatusOff = new Set([...S.estatusOff].filter(v => vals.includes(v)));\n      /* Un estatus casi por casa quiere decir que la columna est\u00e1 mal apuntada:\n         antes eso llenaba la pantalla con 210 casillas y dejaba la lista en cero\n         sin decir nada. Mejor no dibujarlas y explicar qu\u00e9 pas\u00f3. */\n      if (vals.length > 30 && vals.length > S.data.length * .5){\n        $('festatusBox').style.display = 'block';\n        $('festatus').innerHTML =\n          '<div style=\"border:1px solid var(--brd);border-left:4px solid var(--nar);background:var(--narL);' +\n          'border-radius:12px;padding:13px 16px;font-size:13px;line-height:1.6;color:var(--tx2)\">' +\n          'Con esa columna salen <b style=\"color:var(--tx)\">' + vals.length + ' estatus distintos<\u002Fb>, ' +\n          'casi uno por casa, as\u00ed que seguro no es la del estatus de ruta. ' +\n          'C\u00e1mbiala en <i>Paso 3 \u2192 Revisar columnas<\u002Fi>.<\u002Fdiv>';\n        return;\n      }\n      /* Con un solo estatus el filtro sobrar\u00eda, salvo que ese \u00fanico estatus venga\n         apagado: sin la casilla la lista se ver\u00eda vac\u00eda y sin manera de prenderla. */\n      $('festatusBox').style.display =\n        (vals.length > 1 || S.estatusOff.size) ? 'block' : 'none';\n      $('festatus').innerHTML = vals.map(v => {\n        const n = S.data.filter(r => valor(r,'ESTATUS') === v).length;\n        return '<button class=\"chip\" data-est=\"' + esc(v) + '\">' +\n          '<i><\u002Fi>' + esc(v) + '<b>' + n + '<\u002Fb><\u002Fbutton>';\n      }).join('');\n      for (const b of $('festatus').querySelectorAll('[data-est]')){\n        b.classList.toggle('off', S.estatusOff.has(b.dataset.est));\n        b.onclick = () => {\n          if (S.estatusOff.has(b.dataset.est)) S.estatusOff.delete(b.dataset.est);\n          else S.estatusOff.add(b.dataset.est);\n          b.classList.toggle('off', S.estatusOff.has(b.dataset.est));\n          /* Cartera/cuadrilla/ruta solo acotan la b\u00fasqueda y la selecci\u00f3n\n             sobrevive, pero apagar un estatus quiere decir \"esto no va en la\n             corrida\": si siguiera seleccionado se colar\u00eda en el PDF. Solo se\n             quita, nunca se agrega, para no deshacer una selecci\u00f3n a mano. */\n          for (const i of [...S.sel])\n            if (S.estatusOff.has(valor(S.data[i],'ESTATUS'))) S.sel.delete(i);\n          tabla();\n        };\n      }\n    }\n\n    ['fCartera','fLider','fRuta'].forEach(id => $(id).onchange = tabla);\n    $('fBuscar').oninput = tabla;\n    $('limpiaf').onclick = () => {\n      ['fCartera','fLider','fRuta'].forEach(id => $(id).value = '');\n      $('fBuscar').value = '';\n      /* Limpiar deja la vista como reci\u00e9n cargado el archivo, y ah\u00ed solo est\u00e1n\n         prendidas las que traen convenio: vaciar el filtro del todo destapar\u00eda\n         domicilios que nadie pidi\u00f3. */\n      apagarSinConvenio();\n      pintarEstatus(); tabla();\n    };\n\n    function visibles(){\n      const c = $('fCartera').value, l = $('fLider').value, ru = $('fRuta').value;\n      /* Se busca por palabras sueltas y en cualquier orden, no como un pedazo\n         literal: con cientos de domicilios nadie se acuerda de c\u00f3mo viene\n         escrita la calle, pero s\u00ed de dos datos sueltos (\"cerro 129\"). */\n      const q = norm($('fBuscar').value).split(' ').filter(Boolean);\n      const out = [];\n      S.data.forEach((r,i) => {\n        if (c && valor(r,'CARTERA') !== c) return;\n        if (l && valor(r,'LIDER') !== l) return;\n        if (ru && valor(r,'RUTA') !== ru) return;\n        if (S.estatusOff.has(valor(r,'ESTATUS'))) return;\n        if (q.length){\n          const heno = norm([valor(r,'FOLIO'), valor(r,'DOMICILIO'), valor(r,'COLONIA'),\n                             valor(r,'MUNICIPIO'), valor(r,'RUTA'), valor(r,'LIDER')].join(' '));\n          if (!q.every(t => heno.includes(t))) return;\n        }\n        out.push(i);\n      });\n      return out;\n    }\n\n    const TAG = (bg,col,txt) => '<span style=\"display:inline-block;padding:3px 9px;border-radius:999px;font-size:10.5px;' +\n      'font-weight:700;text-transform:uppercase;letter-spacing:.07em;white-space:nowrap;background:' + bg + ';color:' + col + '\">' + txt + '<\u002Fspan>';\n\n    function tabla(){\n      const vis = visibles();\n      $('tbl').tHead.innerHTML =\n        '<tr><th style=\"width:44px\"><\u002Fth><th>Folio<\u002Fth><th>Domicilio<\u002Fth><th>Cartera<\u002Fth>' +\n        '<th>Cuadrilla<\u002Fth><th>Ruta<\u002Fth><th>Estatus<\u002Fth><th><\u002Fth><th style=\"width:96px\"><\u002Fth><\u002Ftr>';\n      $('tbl').tBodies[0].innerHTML = vis.length ? vis.map((i,n) => {\n        const r = S.data[i];\n        return '<tr class=\"tq-row\" data-i=\"' + i + '\" data-sel=\"' + (S.sel.has(i) ? '1' : '0') + '\" style=\"animation-delay:' + Math.min(n*14, 320) + 'ms\">' +\n          '<td><input type=\"checkbox\" data-i=\"' + i + '\"' + (S.sel.has(i) ? ' checked' : '') + '><\u002Ftd>' +\n          '<td class=\"clave\">' + esc(valor(r,'FOLIO') || '\u2014') + '<\u002Ftd>' +\n          '<td class=\"wrap\">' + esc(valor(r,'DOMICILIO') || '\u2014') + '<\u002Ftd>' +\n          '<td>' + esc(valor(r,'CARTERA')) + '<\u002Ftd>' +\n          '<td>' + esc(valor(r,'LIDER')) + '<\u002Ftd>' +\n          '<td>' + esc(valor(r,'RUTA')) + '<\u002Ftd>' +\n          '<td>' + esc(valor(r,'ESTATUS')) + '<\u002Ftd>' +\n          '<td>' + (editado(r) ? TAG('var(--narL)','var(--nar2)','editada') : '') +\n            (S.fotos[llave(r)] ? TAG('var(--surf2)','var(--tx3)','con foto') : '') + '<\u002Ftd>' +\n          '<td><button data-ed=\"' + i + '\" style=\"min-height:32px;padding:6px 12px;border:1px solid var(--brd2);border-radius:9px;' +\n            'background:var(--surf);color:var(--tx2);font-weight:600;font-size:12.5px;cursor:pointer\">Editar<\u002Fbutton><\u002Ftd><\u002Ftr>';\n      }).join('')\n        : '<tr><td colspan=\"9\" style=\"padding:44px 20px;text-align:center;color:var(--tx3);font-size:14px\">' +\n          'Ning\u00fan domicilio coincide con los filtros.<\u002Ftd><\u002Ftr>';\n\n      for (const cb of $('tbl').querySelectorAll('input[type=checkbox]'))\n        cb.onclick = e => { e.stopPropagation(); marca(cb); };\n      for (const b of $('tbl').querySelectorAll('[data-ed]'))\n        b.onclick = e => { e.stopPropagation(); S.cur = +b.dataset.ed; llenarSelector(); ir('ficha'); };\n      for (const tr of $('tbl').tBodies[0].rows){\n        const cb = tr.querySelector('input');\n        if (cb) tr.onclick = () => { cb.checked = !cb.checked; marca(cb); };\n      }\n      setNum($('kVis'), vis.length);\n      contadores();\n      iaPintar();\n    }\n    function marca(cb){\n      const i = +cb.dataset.i;\n      if (cb.checked) S.sel.add(i); else S.sel.delete(i);\n      cb.closest('tr').setAttribute('data-sel', cb.checked ? '1' : '0');\n      contadores();\n    }\n    function barra(){\n      const b = $('savebar');\n      const show = (vista === 'casas' || vista === 'ficha');\n      b.style.transform = show ? 'none' : 'translateY(160%)';\n      b.style.opacity = show ? '1' : '0';\n      b.style.pointerEvents = show ? 'auto' : 'none';\n    }\n    function contadores(){\n      /* Cambi\u00f3 la selecci\u00f3n o un dato: lo que qued\u00f3 armado para imprimir ya no\n         corresponde. Sin esto, un Ctrl+P sacaba las hojas de la vez pasada. */\n      $('printarea').innerHTML = '';\n      setNum($('kTot'), S.data.length);\n      setNum($('kSel'), S.sel.size);\n      setNum($('nsel'), S.sel.size);\n      setNum($('ctSel'), S.sel.size);\n      const ed = S.data.filter(editado).length;\n      setNum($('kEd'), ed);\n      setNum($('ctEd'), ed);\n      const p = $('btnpdf');\n      p.disabled = S.sel.size === 0;\n      p.style.opacity = S.sel.size === 0 ? '.45' : '1';\n      p.style.cursor = S.sel.size === 0 ? 'not-allowed' : 'pointer';\n    }\n    $('selall').onclick = () => { visibles().forEach(i => S.sel.add(i)); tabla(); };\n    $('selnone').onclick = () => { S.sel.clear(); tabla(); };\n    $('btnEditar').onclick = () => {\n      const v = visibles().filter(i => S.sel.has(i));\n      if (v.length) S.cur = v[0];\n      llenarSelector(); ir('ficha');\n    };\n\n    /* ============================================================\n       IA \u00b7 desenredar direcciones (opcional, con tu propia key)\n\n       La liga de Maps NO necesita IA: se arma sola en mapaUrl() a partir del\n       domicilio, gratis y sin salir del navegador. Lo que s\u00ed requiere criterio\n       es el texto crudo que viene pegado o abreviado \u2014\n       \"AV BOGOTA275SANTA FE00630TLAJOMULCO DE ZUNIGA45653STMJL\"\u2014, porque ah\u00ed\n       ni el domicilio se lee ni la b\u00fasqueda del mapa cae en el lugar correcto.\n       Para eso, y s\u00f3lo para eso, se usa el modelo.\n       ============================================================ */\n    const IA_LS = 'thiqa_ia_v1';\n\n    /* Groq, OpenRouter, Cerebras y cualquier otro compatible hablan el mismo\n       formato \u2014el de OpenAI\u2014 y s\u00f3lo cambian en la URL base y en c\u00f3mo escriben\n       el nombre de los modelos, as\u00ed que se arman de una sola pieza.\n       El response_format no se pide en todos: varios modelos gratuitos\n       contestan 400 en cuanto se los mandas, y como iaJSON ya sabe pelarle las\n       comillas de bloque a la respuesta, sale m\u00e1s seguro no pedirlo donde el\n       modelo que te toca puede cambiar de un d\u00eda para otro. */\n    const provOAI = (n, base, modelo, donde, pedirJson = true) => ({\n      n, base, modelo, donde, oai:true,\n      url:c => c.base.replace(/\\/+$/,'') + '/chat/completions',\n      head:c => ({ 'content-type':'application/json', 'authorization':'Bearer ' + c.key }),\n      body:(c,p) => {\n        const b = { model:c.modelo, temperature:0, messages:[{ role:'user', content:p }] };\n        if (pedirJson) b.response_format = { type:'json_object' };\n        return b;\n      },\n      txt:j => ((j.choices||[])[0]||{}).message?.content || '',\n      mods:c => c.base.replace(/\\/+$/,'') + '/models',\n      modsTxt:j => (j.data||[]).map(m => m.id).filter(Boolean),\n    });\n\n    const IA_PROV = {\n      gemini: {\n        n:'Google Gemini (capa gratuita)', modelo:'gemini-3.5-flash', base:'',\n        donde:'Saca tu key gratis en <b style=\"color:var(--tx)\">aistudio.google.com/apikey<\u002Fb>. ' +\n              'La capa gratuita tiene tope por minuto, as\u00ed que los lotes van despacio a prop\u00f3sito. ' +\n              'Google puede usar lo que mandes para entrenar en la capa gratuita.',\n        url:c => 'https://generativelanguage.googleapis.com/v1beta/models/' + c.modelo + ':generateContent',\n        head:c => ({ 'content-type':'application/json', 'x-goog-api-key':c.key }),\n        body:(c,p) => ({ contents:[{ parts:[{ text:p }] }],\n                         generationConfig:{ responseMimeType:'application/json', temperature:0 } }),\n        txt:j => (((j.candidates||[])[0]||{}).content||{}).parts?.map(x=>x.text||'').join('') || '',\n        mods:() => 'https://generativelanguage.googleapis.com/v1beta/models',\n        modsTxt:j => (j.models||[])\n          .filter(m => (m.supportedGenerationMethods||[]).includes('generateContent'))\n          .map(m => String(m.name||'').replace(/^models\\//,'')).filter(Boolean),\n      },\n      anthropic: {\n        n:'Anthropic Claude (de paga, centavos)', modelo:'claude-haiku-4-5-20251001', base:'',\n        donde:'Saca tu key en <b style=\"color:var(--tx)\">console.anthropic.com<\u002Fb>. No tiene capa gratuita, ' +\n              'pero desenredar tus 201 domicilios con Haiku cuesta centavos. Es el \u00fanico proveedor cuyo ' +\n              'permiso para llamarlo desde el navegador pude verificar.',\n        url:() => 'https://api.anthropic.com/v1/messages',\n        head:c => ({ 'content-type':'application/json', 'x-api-key':c.key,\n                     'anthropic-version':'2023-06-01',\n                     'anthropic-dangerous-direct-browser-access':'true' }),\n        body:(c,p) => ({ model:c.modelo, max_tokens:4096, temperature:0,\n                         messages:[{ role:'user', content:p }] }),\n        txt:j => (j.content||[]).map(x=>x.text||'').join(''),\n        mods:() => 'https://api.anthropic.com/v1/models',\n        modsTxt:j => (j.data||[]).map(m => m.id).filter(Boolean),\n      },\n      groq: provOAI('Groq (capa gratuita)',\n        'https://api.groq.com/openai/v1', 'openai/gpt-oss-120b',\n        'Saca tu key gratis en <b style=\"color:var(--tx)\">console.groq.com/keys<\u002Fb>, sin tarjeta. ' +\n        'Ojo: Groq apag\u00f3 <i>llama-3.3-70b-versatile<\u002Fi> en agosto de 2026, que era el que tra\u00eda puesto ' +\n        'esta p\u00e1gina; los que sirven hoy son <b style=\"color:var(--tx)\">openai/gpt-oss-120b<\u002Fb> y ' +\n        '<b style=\"color:var(--tx)\">qwen/qwen3.6-27b<\u002Fb>. Si te dice que el modelo no existe, p\u00edcale a ' +\n        '<i>ver modelos<\u002Fi> y escoge de la lista.'),\n      openrouter: provOAI('OpenRouter (modelos gratis)',\n        'https://openrouter.ai/api/v1', 'openrouter/free',\n        'Saca tu key gratis en <b style=\"color:var(--tx)\">openrouter.ai/keys<\u002Fb>. Su lista de modelos ' +\n        'gratis cambia cada semana, por eso aqu\u00ed va puesto <b style=\"color:var(--tx)\">openrouter/free<\u002Fb>, ' +\n        'que deja que OpenRouter escoja uno que est\u00e9 vivo en ese momento. Sin comprar cr\u00e9ditos son unas ' +\n        '50 llamadas al d\u00eda, as\u00ed que para los lotes grandes conviene Gemini o Groq.',\n        false),\n      cerebras: provOAI('Cerebras (capa gratuita)',\n        'https://api.cerebras.ai/v1', 'gpt-oss-120b',\n        'Saca tu key gratis en <b style=\"color:var(--tx)\">cloud.cerebras.ai<\u002Fb>, sin tarjeta. Es el m\u00e1s ' +\n        'r\u00e1pido, pero en la capa gratuita cada llamada no puede pasar de 8 mil tokens, as\u00ed que los lotes ' +\n        'se parten m\u00e1s chicos. Su lista tambi\u00e9n rota: <i>ver modelos<\u002Fi> dice cu\u00e1les hay hoy.'),\n      openai: provOAI('Otro compatible con OpenAI',\n        '', '',\n        'Sirve para cualquier API que hable el formato de OpenAI (DeepSeek, Together, o un modelo tuyo ' +\n        'en la red local). Pon la URL base que publique tu proveedor \u2014la que termina en ' +\n        '<b style=\"color:var(--tx)\">/v1<\u002Fb>\u2014 y el nombre del modelo tal cual lo escribe \u00e9l.'),\n    };\n\n    /* El campo de la key se ve de contrase\u00f1a, as\u00ed que el gestor del navegador a\n       veces la rellena con una contrase\u00f1a guardada, y pegarla desde un correo o\n       un chat arrastra comillas, saltos de l\u00ednea o el \"API key:\" de adelante.\n       Ninguna key lleva espacios, as\u00ed que todo eso se puede quitar sin riesgo. */\n    const limpiarKey = s => String(s == null ? '' : s)\n      .replace(/[\\u200B-\\u200D\\uFEFF]/g, '')\n      .replace(/^\\s*(?:api\\s*key|key|bearer)\\s*[:=]?\\s*/i, '')\n      .replace(/^[\"'`]+|[\"'`]+$/g, '')\n      .replace(/\\s+/g, '');\n\n    /* Cada proveedor emite las keys con una forma fija. Revisarla aqu\u00ed ahorra la\n       llamada perdida y, sobre todo, deja decir qu\u00e9 se ve mal en lugar de repetir\n       el \"API key not valid\" del servidor. Los compatibles con OpenAI no entran:\n       cada uno usa su propio prefijo. */\n    const IA_FORMA = {\n      gemini:    { re:/^AIza[\\w-]{30,}$/,    dice:'empieza con AIza y mide 39 caracteres' },\n      anthropic: { re:/^sk-ant-[\\w-]{20,}$/, dice:'empieza con sk-ant-' },\n    };\n    function keyMalFormada(prov, key){\n      if (!key) return 'El campo de la key est\u00e1 vac\u00edo.';\n      const f = IA_FORMA[prov];\n      if (!f || f.re.test(key)) return null;\n      return 'La key de ' + esc(IA_PROV[prov].n.replace(/\\s*\\(.*\\)$/,'')) + ' ' + f.dice +\n        ', y la que est\u00e1 puesta mide <b style=\"color:var(--tx)\">' + key.length +\n        '<\u002Fb> caracteres y empieza con \u201c' + esc(key.slice(0,4)) + '\u201d. ' +\n        'P\u00edcale a <i>ver<\u002Fi> junto al campo para comprobar qu\u00e9 dice: si el navegador rellen\u00f3 ah\u00ed ' +\n        'una contrase\u00f1a guardada, b\u00f3rrala y pega tu key completa.';\n    }\n\n    let iaCfg = { prov:'gemini', modelo:IA_PROV.gemini.modelo, base:'', key:'' };\n    try { Object.assign(iaCfg, JSON.parse(localStorage.getItem(IA_LS) || '{}')); } catch(e){}\n    iaCfg.key = limpiarKey(iaCfg.key);\n    /* Antes Groq y OpenRouter se pon\u00edan a mano dentro de un solo proveedor\n       llamado 'openai'. Ahora cada uno tiene su lugar en la lista, con su aviso\n       y su bot\u00f3n de ver modelos, as\u00ed que a quien venga de la versi\u00f3n anterior\n       se le reconoce por la URL que traiga escrita y se le pasa al que le toca.\n       El que puso una URL que no es de ninguno se queda en el gen\u00e9rico. */\n    if (iaCfg.prov === 'openai' && iaCfg.base){\n      const suya = iaCfg.base.replace(/\\/+$/,'');\n      const casa = Object.keys(IA_PROV).find(k => IA_PROV[k].base &&\n        IA_PROV[k].base.replace(/\\/+$/,'') === suya);\n      if (casa) iaCfg.prov = casa;\n    }\n\n    /* Un modelo apagado contesta 404 aunque la key est\u00e9 perfecta, y no hay\n       manera de adivinarlo desde el mensaje del servidor. \u00c9stos ya no existen:\n       'gemini-3-flash' nunca fue un id v\u00e1lido (son gemini-3.5-flash y\n       gemini-3-flash-preview), y los cuatro de Groq los apag\u00f3 el propio Groq en\n       agosto de 2026. A quien los traiga guardados se le corrigen solos; si\n       escribi\u00f3 cualquier otro modelo, se respeta. */\n    const MODELOS_MUERTOS = {\n      'gemini-3-flash':'gemini-3.5-flash',\n      'llama-3.3-70b-versatile':'openai/gpt-oss-120b',\n      'llama-3.1-8b-instant':'openai/gpt-oss-20b',\n      'qwen/qwen3-32b':'qwen/qwen3.6-27b',\n      'meta-llama/llama-4-scout-17b-16e-instruct':'openai/gpt-oss-120b',\n    };\n    if (MODELOS_MUERTOS[iaCfg.modelo]) iaCfg.modelo = MODELOS_MUERTOS[iaCfg.modelo];\n\n    /* Manda lo que est\u00e1 escrito en el campo, no lo \u00faltimo que se guard\u00f3: si\n       escribiste la key y le picaste directo a crear las fichas, \u00e9sa se usa y se\n       guarda sola. Lo que no tiene forma de key nunca tapa a una que s\u00ed la tiene,\n       para que un autorrelleno del navegador no borre la buena. */\n    function iaKeyDelCampo(){\n      const campo = $('iaKey');\n      const limpia = campo ? limpiarKey(campo.value) : '';\n      if (!limpia || limpia === iaCfg.key) return iaCfg.key;\n      if (keyMalFormada(iaCfg.prov, limpia) && !keyMalFormada(iaCfg.prov, iaCfg.key)) return iaCfg.key;\n      iaCfg.key = limpia;\n      try { localStorage.setItem(IA_LS, JSON.stringify(iaCfg)); } catch(e){}\n      return iaCfg.key;\n    }\n    let iaAbort = false, iaCorriendo = false;\n    const iaTocadas = new Set();\n\n    /* Se considera enredada la que trae el domicilio pegado con la colonia, el\n       CP y el municipio, o la que es tan larga que en la ficha sale recortada. */\n    function enredada(r){\n      const d = String(valor(r,'DOMICILIO') || '');\n      if (!d) return false;\n      return d.length > 55 || (!d.includes(',') && (d.match(/\\d{4,5}/g) || []).length >= 2);\n    }\n    const iaPendientes = () => visibles().map(i => S.data[i]).filter(enredada);\n\n    function iaPintar(){\n      const n = iaPendientes().length;\n      $('iaResumen').innerHTML = n\n        ? '<b style=\"color:var(--tx)\">' + n + '<\u002Fb> con la direcci\u00f3n pegada o ilegible, de ' +\n          visibles().length + ' visibles.'\n        : 'Ninguna de las ' + visibles().length + ' visibles necesita arreglo.';\n      $('iaRun').disabled = !n || iaCorriendo;\n      $('iaRun').style.opacity = (!n || iaCorriendo) ? '.45' : '1';\n      $('iaRun').style.cursor = (!n || iaCorriendo) ? 'not-allowed' : 'pointer';\n      $('iaRun').textContent = 'Desenredar con IA';\n      $('iaUndo').style.display = iaTocadas.size ? 'inline-flex' : 'none';\n    }\n\n    function iaFormPintar(){\n      $('iaProv').innerHTML = Object.keys(IA_PROV)\n        .map(k => '<option value=\"' + k + '\"' + (k === iaCfg.prov ? ' selected' : '') + '>' +\n          esc(IA_PROV[k].n) + '<\u002Foption>').join('');\n      $('iaProv').value = iaCfg.prov;\n      $('iaModelo').value = iaCfg.modelo;\n      $('iaBase').value = iaCfg.base;\n      $('iaKey').value = iaCfg.key;\n      $('iaBaseBox').style.display = IA_PROV[iaCfg.prov].oai ? 'block' : 'none';\n      $('iaDonde').innerHTML = IA_PROV[iaCfg.prov].donde;\n      $('iaEstadoKey').textContent = iaCfg.key\n        ? 'guardada en este navegador \u00b7 ' + iaCfg.key.length + ' caracteres'\n        : 'sin key \u00b7 el dictado y el desenredado no funcionan';\n    }\n    /* La key vive en un solo lugar (la vista Dictar) para no tener dos\n       formularios pele\u00e1ndose por el mismo dato. */\n    $('iaConfig').onclick = () => ir('dictar');\n    $('iaProv').onchange = () => {\n      const p = IA_PROV[$('iaProv').value];\n      iaCfg.prov = $('iaProv').value;\n      iaCfg.modelo = p.modelo;\n      iaCfg.base = p.base;\n      iaFormPintar();\n    };\n    $('iaSave').onclick = () => {\n      iaCfg.prov = $('iaProv').value;\n      iaCfg.modelo = $('iaModelo').value.trim() || IA_PROV[iaCfg.prov].modelo;\n      /* Vaciar la URL base dejar\u00eda la llamada apuntando a esta misma p\u00e1gina;\n         si se borra, se repone la del proveedor elegido, igual que el modelo. */\n      iaCfg.base = $('iaBase').value.trim() || IA_PROV[iaCfg.prov].base;\n      iaCfg.key = limpiarKey($('iaKey').value);\n      try { localStorage.setItem(IA_LS, JSON.stringify(iaCfg)); } catch(e){}\n      iaFormPintar(); iaPintar();\n      const mal = iaCfg.key && keyMalFormada(iaCfg.prov, iaCfg.key);\n      if (mal){\n        aviso('iaKeyMsg', 'warn','<b style=\"color:var(--tx)\">Se guard\u00f3, pero as\u00ed no va a servir.<\u002Fb><br>' + mal);\n        return;\n      }\n      $('iaKeyMsg').innerHTML = '';\n      toast(iaCfg.key ? 'Key guardada en este navegador.' : 'Configuraci\u00f3n guardada.','ok');\n    };\n    /* Sin poder ver lo que hay en el campo no se distingue una key de una\n       contrase\u00f1a que el navegador meti\u00f3 sola, que es justo lo que confunde. */\n    $('iaVer').onclick = e => {\n      e.preventDefault();\n      const campo = $('iaKey'), oculta = campo.type === 'password';\n      campo.type = oculta ? 'text' : 'password';\n      $('iaVer').textContent = oculta ? 'ocultar' : 'ver';\n    };\n    /* Una llamada m\u00ednima para saber si el proveedor acepta la key, sin tener que\n       dictar algo primero y quedarse con la duda de qu\u00e9 fall\u00f3. */\n    $('iaProbar').onclick = async () => {\n      const key = iaKeyDelCampo();\n      const mal = keyMalFormada(iaCfg.prov, key);\n      if (mal){ aviso('iaKeyMsg', 'warn', mal); return; }\n      const btn = $('iaProbar'), etiqueta = btn.textContent;\n      btn.disabled = true; btn.style.opacity = '.5'; btn.textContent = 'Probando\u2026';\n      aviso('iaKeyMsg', '', 'Pregunt\u00e1ndole al proveedor\u2026');\n      try {\n        await iaLlamar('Contesta \u00fanicamente con este JSON: {\"ok\":1}');\n        aviso('iaKeyMsg', 'ok','<b style=\"color:var(--tx)\">Tu key sirve.<\u002Fb><br>' +\n          'Ya puedes dictar fichas y desenredar direcciones.');\n      } catch(e){\n        aviso('iaKeyMsg', 'warn', iaErrorHtml(e));\n      } finally {\n        btn.disabled = false; btn.style.opacity = '1'; btn.textContent = etiqueta;\n      }\n    };\n    /* Los proveedores gratuitos apagan y renombran modelos cada pocas semanas\n       \u2014as\u00ed fue como muri\u00f3 el que tra\u00eda puesta esta p\u00e1gina\u2014, y desde afuera no\n       hay manera de adivinar cu\u00e1les quedaron vivos. Todos publican su lista en\n       el mismo lugar, as\u00ed que m\u00e1s vale preguntarles que traer una escrita a\n       mano que se vuelve a vencer sola. Los ids que devuelven incluyen cosas\n       que aqu\u00ed no sirven (voz, embeddings, filtros), y \u00e9sas nada m\u00e1s estorban. */\n    const MODELO_NO_SIRVE = /whisper|tts|audio|speech|embed|guard|rerank|moderat|image|video/i;\n\n    $('iaModelos').onclick = async () => {\n      const p = IA_PROV[iaCfg.prov];\n      const key = iaKeyDelCampo();\n      const mal = keyMalFormada(iaCfg.prov, key);\n      if (mal){ iaKeyAviso('warn', mal); return; }\n      if (p.oai && !$('iaBase').value.trim()){\n        iaKeyAviso('warn','<b style=\"color:var(--tx)\">Falta la URL base.<\u002Fb><br>' +\n          'Escribe la del proveedor \u2014la que termina en /v1\u2014 y vuelve a picarle.');\n        return;\n      }\n      /* La lista se pide con lo que est\u00e1 escrito ahorita en el formulario, no\n         con lo \u00faltimo guardado, para poder tantear una URL sin guardarla. */\n      const cfg = { key, base:$('iaBase').value.trim() || p.base, modelo:iaCfg.modelo };\n      const btn = $('iaModelos'), etiqueta = btn.textContent;\n      btn.disabled = true; btn.style.opacity = '.5'; btn.textContent = 'Preguntando\u2026';\n      iaKeyAviso('', 'Pregunt\u00e1ndole al proveedor qu\u00e9 modelos tiene\u2026');\n      try {\n        const res = await fetch(p.mods(cfg), { headers:p.head(cfg) });\n        if (!res.ok){\n          const cuerpo = await res.text().catch(() => '');\n          const e = new Error(res.status + ' ' + res.statusText + (cuerpo ? ' \u00b7 ' + cuerpo.slice(0,180) : ''));\n          e.status = res.status;\n          throw e;\n        }\n        const ids = (p.modsTxt(await res.json()) || []).filter(x => !MODELO_NO_SIRVE.test(x)).sort();\n        if (!ids.length){\n          iaKeyAviso('warn','<b style=\"color:var(--tx)\">El proveedor no devolvi\u00f3 ning\u00fan modelo de texto.<\u002Fb><br>' +\n            'Puede que tu cuenta todav\u00eda no tenga acceso a ninguno, o que la URL base apunte a otro lado.');\n          return;\n        }\n        iaKeyAviso('ok','<b style=\"color:var(--tx)\">' + ids.length + ' modelos disponibles ahora mismo.<\u002Fb><br>' +\n          'P\u00edcale a uno para ponerlo, y luego a <i>Probar mi key<\u002Fi>.' +\n          '<div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:10px\">' +\n          ids.map(id => '<button type=\"button\" data-modelo=\"' + esc(id) + '\" ' +\n            'style=\"border:1px solid var(--brd2);border-radius:9px;background:var(--surf);color:var(--tx2);' +\n            'font-size:12px;font-weight:600;padding:5px 9px;cursor:pointer\">' + esc(id) + '<\u002Fbutton>').join('') +\n          '<\u002Fdiv>');\n      } catch(e){\n        iaKeyAviso('warn', iaErrorHtml(e));\n      } finally {\n        btn.disabled = false; btn.style.opacity = '1'; btn.textContent = etiqueta;\n      }\n    };\n\n    /* Los botones de la lista nacen y mueren con cada consulta, as\u00ed que el\n       clic se escucha en el contenedor, que \u00e9se s\u00ed siempre est\u00e1. */\n    $('iaKeyMsg').addEventListener('click', e => {\n      const b = e.target.closest('[data-modelo]');\n      if (!b) return;\n      $('iaModelo').value = b.getAttribute('data-modelo');\n      iaCfg.modelo = $('iaModelo').value;\n      try { localStorage.setItem(IA_LS, JSON.stringify(iaCfg)); } catch(e){}\n      toast('Modelo puesto: ' + iaCfg.modelo, 'ok');\n    });\n\n    $('iaForget').onclick = () => {\n      iaCfg.key = '';\n      $('iaKey').value = '';\n      $('iaKeyMsg').innerHTML = '';\n      try { localStorage.removeItem(IA_LS); } catch(e){}\n      iaFormPintar(); iaPintar();\n      toast('Se borr\u00f3 tu key de este navegador.');\n    };\n    $('iaStop').onclick = () => { iaAbort = true; $('iaEstado').textContent = 'Deteniendo\u2026'; };\n    $('iaUndo').onclick = () => {\n      for (const k of iaTocadas) delete S.ov[k];\n      iaTocadas.clear();\n      guardar(); tabla(); iaPintar();\n      $('iaMsg').innerHTML = '';\n      toast('Se deshizo todo lo que escribi\u00f3 la IA.');\n    };\n\n    const PROMPT = filas =>\n      'Normaliza domicilios de un padr\u00f3n de vivienda del estado de Jalisco, M\u00e9xico.\\n' +\n      'Te doy un arreglo JSON. Cada elemento trae la direcci\u00f3n tal como se captur\u00f3 (\"dir\"), ' +\n      'que puede venir con palabras pegadas, abreviada o con el c\u00f3digo postal y el municipio ' +\n      'concatenados, y por separado la colonia, el C.P., el municipio y el estado ya conocidos.\\n\\n' +\n      'Devuelve SOLO un arreglo JSON, un elemento por cada uno que recibas, con estas llaves:\\n' +\n      '  \"i\": el mismo n\u00famero que recibiste.\\n' +\n      '  \"calle\": la direcci\u00f3n legible: vialidad, n\u00famero y, si vienen, manzana/lote/interior. ' +\n      'Separa las palabras pegadas y desarrolla las abreviaturas (BLVD \u2192 Boulevard, AV \u2192 Avenida, ' +\n      'LT \u2192 Lote, MZ \u2192 Manzana, NIV \u2192 Nivel). Respeta may\u00fasculas y acentos del espa\u00f1ol.\\n\\n' +\n      'Reglas estrictas:\\n' +\n      '- NO inventes nada. Si la entrada no dice el n\u00famero, no lo pongas.\\n' +\n      '- En \"calle\" NO repitas la colonia, el C.P., el municipio ni el estado: \u00e9sos ya los tengo aparte.\\n' +\n      '- Quita la basura de captura tipo \"NA\", \"NO APLICA\", \"SMZ NA\", \"EDIF NA\" y las claves ' +\n      'internas pegadas al final tipo \"STMJL\".\\n' +\n      '- Si de plano no puedes leer la direcci\u00f3n, devuelve \"calle\" igual a \"dir\".\\n\\n' +\n      JSON.stringify(filas);\n\n    /* Una sola puerta de salida hacia el proveedor: de aqu\u00ed cuelgan las fichas\n       del dictado, el desenredado de direcciones y la prueba de la key. */\n    async function iaLlamar(prompt){\n      const p = IA_PROV[iaCfg.prov];\n      /* Sin URL base la llamada se ir\u00eda contra esta misma p\u00e1gina y volver\u00eda un\n         404 de GitHub Pages que no explica nada de lo que en realidad falta. */\n      if (p.oai && !iaCfg.base)\n        throw new Error('Falta la URL base del proveedor: es la que termina en /v1.');\n      const res = await fetch(p.url(iaCfg), {\n        method:'POST', headers:p.head(iaCfg), body:JSON.stringify(p.body(iaCfg, prompt))\n      });\n      if (!res.ok){\n        const cuerpo = await res.text().catch(() => '');\n        const e = new Error(res.status + ' ' + res.statusText + (cuerpo ? ' \u00b7 ' + cuerpo.slice(0,180) : ''));\n        e.status = res.status;\n        throw e;\n      }\n      return p.txt(await res.json()) || '';\n    }\n\n    async function iaJSON(prompt){\n      let txt = await iaLlamar(prompt);\n      txt = txt.replace(/^\\s*```(?:json)?/i,'').replace(/```\\s*$/,'').trim();\n      /* A los proveedores gratuitos les toca el modelo que tengan libre, y a\n         varios no se les puede exigir el formato JSON, as\u00ed que a veces sueltan\n         una frase antes o despu\u00e9s del arreglo (\"Aqu\u00ed tienes:\"). Si el texto tal\n         cual no se deja leer, se recorta desde el primer corchete o llave hasta\n         el \u00faltimo y se intenta otra vez, en lugar de perder todo el lote. */\n      const recortar = s => {\n        const i = s.search(/[[{]/), f = Math.max(s.lastIndexOf(']'), s.lastIndexOf('}'));\n        return i >= 0 && f > i ? s.slice(i, f + 1) : s;\n      };\n      let dato;\n      try { dato = JSON.parse(txt); }\n      catch(e){ dato = JSON.parse(recortar(txt)); }\n      /* Algunos modelos envuelven el arreglo en un objeto; se busca el arreglo. */\n      const arr = Array.isArray(dato) ? dato\n        : Object.values(dato).find(Array.isArray);\n      if (!Array.isArray(arr)) throw new Error('El modelo no devolvi\u00f3 un arreglo JSON.');\n      return arr;\n    }\n\n    const dormir = ms => new Promise(r => setTimeout(r, ms));\n\n    /* 429 es el tope por minuto de la capa gratuita: se espera y se reintenta,\n       no es un error del que haya que salirse. */\n    async function iaConReintento(prompt, aviso){\n      for (let intento = 0; ; intento++){\n        try { return await iaJSON(prompt); }\n        catch(e){\n          if ((e.status === 429 || e.status >= 500) && intento < 2){\n            const espera = 8000 * (intento + 1);\n            if (aviso) aviso('El proveedor pidi\u00f3 esperar; reintento en ' + (espera/1000) + ' s\u2026');\n            await dormir(espera);\n            continue;\n          }\n          throw e;\n        }\n      }\n    }\n\n    /* fetch tira TypeError cuando el navegador no logra la llamada, que es\n       distinto de que el proveedor conteste con un error. Y Google contesta 400\n       \u2014no 401\u2014 cuando la key no sirve, as\u00ed que el rechazo hay que leerlo del\n       cuerpo y no nada m\u00e1s del n\u00famero. */\n    const RECHAZO_KEY = /api[_ ]key not valid|api_key_invalid|invalid[_ ]api[_ ]key|invalid x-api-key|incorrect api key|api key expired/i;\n\n    /* Un modelo que nunca existi\u00f3 y uno que el proveedor apag\u00f3 no vuelven con el\n       mismo n\u00famero \u2014Groq manda 404 model_not_found para el primero y 400\n       model_decommissioned para el segundo\u2014, pero a quien le pasa le importa lo\n       mismo: hay que cambiar de modelo. Por eso se atienden juntos. */\n    const MODELO_MURIO = /model_decommissioned|model_not_found|decommissioned|does not exist|is not a valid model|no longer (?:available|supported)/i;\n\n    function iaErrorHtml(e){\n      const m = String(e && e.message || e);\n      const mal = keyMalFormada(iaCfg.prov, iaCfg.key);\n      return e instanceof TypeError\n        ? '<b style=\"color:var(--tx)\">No se pudo llegar al proveedor.<\u002Fb><br>' +\n          'O no hay internet, o ese proveedor no permite que se le llame directo desde una ' +\n          'p\u00e1gina web (lo que se llama CORS). Revisa tu conexi\u00f3n y, si sigue igual, prueba con ' +\n          'otro proveedor de la lista: los de Google y Anthropic s\u00ed permiten la llamada directa.'\n        : (/^(401|403)/.test(m) || (/^400/.test(m) && RECHAZO_KEY.test(m)))\n        ? '<b style=\"color:var(--tx)\">El proveedor rechaz\u00f3 tu key.<\u002Fb><br>' +\n          (mal || 'La forma se ve bien, as\u00ed que el problema no es lo que escribiste: la key pudo ' +\n                  'borrarse, ser de otro proyecto o traer restricciones. Genera una nueva en el ' +\n                  'sitio del proveedor y p\u00e9gala aqu\u00ed abajo.') +\n          '<br><span style=\"color:var(--tx3)\">Detalle: ' + esc(m) + '<\u002Fspan>'\n        : (/^404/.test(m) || MODELO_MURIO.test(m))\n        ? '<b style=\"color:var(--tx)\">Ese modelo ya no est\u00e1.<\u002Fb><br>' +\n          'Los proveedores gratuitos apagan y renombran modelos cada pocas semanas, as\u00ed que uno ' +\n          'que serv\u00eda el mes pasado hoy contesta esto, aunque tu key est\u00e9 perfecta. P\u00edcale a ' +\n          '<i>Ver modelos<\u002Fi> aqu\u00ed abajo: el proveedor te dice cu\u00e1les est\u00e1 sirviendo ahora y los ' +\n          'pones con un clic.<br><span style=\"color:var(--tx3)\">Detalle: ' + esc(m) + '<\u002Fspan>'\n        : '<b style=\"color:var(--tx)\">No se pudo completar.<\u002Fb><br>Detalle: ' + esc(m);\n    }\n\n    $('iaRun').onclick = async () => {\n      /* El formulario de la key vive en la vista Dictar, as\u00ed que para pedirla\n         hay que llevar all\u00e1; aqu\u00ed no hay d\u00f3nde mostrarla. */\n      const key = iaKeyDelCampo();\n      if (!key){\n        ir('dictar'); iaFormPintar();\n        toast('Para desenredar hace falta tu API key. P\u00e9gala aqu\u00ed abajo, en <i>Tu API key<\u002Fi>.'); return;\n      }\n      const mal = keyMalFormada(iaCfg.prov, key);\n      if (mal){ ir('dictar'); iaFormPintar(); aviso('iaKeyMsg', 'warn', mal); return; }\n      const pend = iaPendientes();\n      if (!pend.length || iaCorriendo) return;\n\n      iaCorriendo = true; iaAbort = false;\n      $('iaMsg').innerHTML = ''; $('iaProg').style.display = 'block';\n      iaPintar();\n\n      const TAM = 20;\n      let hechas = 0, cambiadas = 0, fallos = 0;\n      try {\n        for (let k = 0; k < pend.length && !iaAbort; k += TAM){\n          const trozo = pend.slice(k, k + TAM);\n          /* S\u00f3lo salen la direcci\u00f3n y la ubicaci\u00f3n. Nunca el nombre del\n             acreditado, el cr\u00e9dito, el expediente ni los montos. */\n          const carga = trozo.map((r,j) => ({\n            i:j, dir:valor(r,'DOMICILIO'), colonia:valor(r,'COLONIA'), cp:valor(r,'CP'),\n            municipio:valor(r,'MUNICIPIO'), estado:valor(r,'ENTIDAD'),\n          }));\n          $('iaEstado').textContent = 'Desenredando ' + (hechas + 1) + '\u2013' +\n            Math.min(hechas + trozo.length, pend.length) + ' de ' + pend.length + '\u2026';\n\n          const arr = await iaConReintento(PROMPT(carga), t => { $('iaEstado').textContent = t; });\n          if (!arr) break;\n\n          for (const it of arr){\n            const r = trozo[+it.i];\n            const calle = String(it && it.calle || '').trim();\n            if (!r || !calle) { fallos++; continue; }\n            if (calle === String(valor(r,'DOMICILIO')).trim()) continue;\n            const key = llave(r);\n            (S.ov[key] || (S.ov[key] = {})).DOMICILIO = calle;\n            iaTocadas.add(key);\n            cambiadas++;\n          }\n          hechas += trozo.length;\n          $('iaBar').style.width = Math.round(hechas / pend.length * 100) + '%';\n          guardar(); tabla(); iaPintar();\n        }\n\n        aviso('iaMsg', cambiadas ? 'ok' : 'warn',\n          '<b style=\"color:var(--tx)\">' + cambiadas + ' direcciones reescritas<\u002Fb>' +\n          (iaAbort ? ' (te detuviste antes de terminar)' : '') + '.' +\n          (fallos ? ' ' + fallos + ' no las pudo leer y quedaron igual.' : '') +\n          '<br>Quedaron marcadas como edici\u00f3n tuya: rev\u00edsalas en la tabla y, si alguna no te ' +\n          'convence, corr\u00edgela en <i>Editar ficha<\u002Fi> o usa <i>Deshacer lo de la IA<\u002Fi>.');\n      } catch(e){\n        aviso('iaMsg', 'warn', iaErrorHtml(e));\n      } finally {\n        iaCorriendo = false;\n        $('iaProg').style.display = 'none';\n        $('iaBar').style.width = '0%';\n        iaPintar();\n      }\n    };\n\n    /* ============================================================\n       Dictar fichas \u00b7 voz \u2192 campos \u2192 PDF, sin Excel de por medio\n       ============================================================ */\n    const DICT_LS = 'thiqa_dictadas_v1';\n    /* S\u00f3lo los campos que alguien puede decir en voz alta parado frente a la\n       casa. Meter los 73 har\u00eda el prompt enorme y la extracci\u00f3n m\u00e1s floja. */\n    const DICTABLES = ['FOLIO','CARTERA','RUTA','ESTATUS','DOMICILIO','COLONIA','CP','MUNICIPIO',\n      'ENTIDAD','ACREDITADO','LIDER','CARACTERISTICAS','COMENTARIOS','MONTO_RECUPERACION',\n      'HONORARIO_FIJO','BONO','F_DESALOJO','ETAPA_JUDICIAL'];\n    const ETIQUETA = Object.fromEntries(GRUPOS.flatMap(g => g.f.map(x => [x[0], x[1]])));\n\n    try { S.dictadas = (JSON.parse(localStorage.getItem(DICT_LS) || '[]') || []).map(hacerDictada); }\n    catch(e){ S.dictadas = []; }\n\n    /* Una ficha dictada no viene de ninguna columna, as\u00ed que carga sus valores\n       encima en __dict y crudo() la lee de ah\u00ed. Se queda como arreglo para que\n       el resto del c\u00f3digo la trate igual que a una fila del Excel. */\n    function hacerDictada(obj){\n      const r = [];\n      r.__dict = obj;\n      r.__id = obj.__id || ('dic-' + Math.random().toString(36).slice(2,10));\n      obj.__id = r.__id;\n      return r;\n    }\n    function guardarDictadas(){\n      try { localStorage.setItem(DICT_LS, JSON.stringify(S.dictadas.map(r => r.__dict))); } catch(e){}\n    }\n\n    const PROMPT_DICT = txt =>\n      'Eres capturista de fichas de recuperaci\u00f3n de vivienda en Jalisco, M\u00e9xico.\\n' +\n      'Abajo viene la transcripci\u00f3n de un dictado por voz. Puede mencionar uno o varios domicilios.\\n\\n' +\n      'Devuelve SOLO un arreglo JSON, un elemento por cada domicilio mencionado. Llaves posibles ' +\n      '(todas opcionales: omite la que no se haya dicho):\\n' +\n      DICTABLES.map(k => '  \"' + k + '\": ' + ETIQUETA[k]).join('\\n') + '\\n\\n' +\n      'Reglas estrictas:\\n' +\n      '- NO inventes nada. Si algo no se dijo, omite la llave.\\n' +\n      '- Los montos dictados con palabras van como n\u00famero, sin signo ni comas: ' +\n      '\"sesenta mil\" \u2192 60000, \"diez mil quinientos\" \u2192 10500.\\n' +\n      '- Las fechas en formato dd/mm/aaaa.\\n' +\n      '- Es voz: corrige errores obvios de transcripci\u00f3n en nombres de calles y colonias de la ' +\n      'zona metropolitana de Guadalajara, pero no cambies n\u00fameros.\\n' +\n      '- Separa la calle y el n\u00famero en \"DOMICILIO\"; la colonia, el C.P. y el municipio van en ' +\n      'sus propias llaves, no dentro de \"DOMICILIO\".\\n' +\n      '- Si s\u00f3lo se mencion\u00f3 un domicilio, devuelve un arreglo de un solo elemento.\\n\\n' +\n      'Transcripci\u00f3n:\\n' + JSON.stringify(txt);\n\n    let dicRec = null, dicBase = '';\n    function dicEstado(t){ $('dicEstado').textContent = t || ''; }\n    function dicPintar(){\n      setNum($('ctDict'), S.dictadas.length);\n      $('dicBorrarTodas').style.display = S.dictadas.length ? 'inline-flex' : 'none';\n      $('dicBorrarTodas').textContent = 'Borrar las ' + S.dictadas.length + ' fichas dictadas';\n    }\n\n    $('dicMic').onclick = () => {\n      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;\n      if (!Rec){\n        toast('Este navegador no trae dictado por voz. Usa Chrome o Edge, o escribe el texto.','err');\n        return;\n      }\n      if (dicRec){ dicRec.stop(); return; }\n      const rec = dicRec = new Rec();\n      rec.lang = 'es-MX'; rec.continuous = true; rec.interimResults = true;\n      dicBase = $('dicTexto').value;\n      rec.onresult = e => {\n        let firme = '', tanteo = '';\n        for (let i = e.resultIndex; i < e.results.length; i++){\n          const t = e.results[i][0].transcript;\n          if (e.results[i].isFinal) firme += t + ' '; else tanteo += t;\n        }\n        if (firme) dicBase = (dicBase ? dicBase.trim() + ' ' : '') + firme.trim();\n        $('dicTexto').value = (dicBase + (tanteo ? ' ' + tanteo : '')).trim();\n      };\n      rec.onerror = e => {\n        if (e.error === 'not-allowed')\n          toast('El navegador bloque\u00f3 el micr\u00f3fono. Dale permiso y vuelve a intentar.','err');\n        else if (e.error === 'network') toast('El dictado necesita internet.','err');\n        else if (e.error !== 'aborted' && e.error !== 'no-speech') toast('Se cort\u00f3 el dictado: ' + e.error,'err');\n      };\n      rec.onend = () => {\n        dicRec = null;\n        $('dicMic').classList.remove('grabando');\n        $('dicMicTxt').textContent = 'Empezar a dictar';\n        dicEstado($('dicTexto').value.trim() ? 'Listo. Revisa el texto y crea las fichas.' : '');\n      };\n      try {\n        rec.start();\n        $('dicMic').classList.add('grabando');\n        $('dicMicTxt').textContent = 'Detener';\n        dicEstado('Escuchando\u2026 habla normal, puedes decir varias casas seguidas.');\n      } catch(e){ dicRec = null; toast('No se pudo iniciar el dictado.','err'); }\n    };\n\n    $('dicLimpiar').onclick = () => { $('dicTexto').value = ''; dicBase = ''; $('dicMsg').innerHTML = ''; };\n    $('dicBorrarTodas').onclick = () => {\n      for (const r of S.dictadas) delete S.ov[r.__id];\n      S.dictadas = [];\n      guardarDictadas(); guardar(); rehacerDatos(); dicPintar();\n      if (datosListos) tabla();\n      toast('Se borraron las fichas dictadas.');\n    };\n\n    $('dicCrear').onclick = async () => {\n      const txt = $('dicTexto').value.trim();\n      if (!txt){ toast('Primero dicta o escribe algo.'); return; }\n      const key = iaKeyDelCampo();\n      if (!key){\n        aviso('dicMsg', 'warn','<b style=\"color:var(--tx)\">Falta tu API key.<\u002Fb><br>' +\n          'La necesito para convertir el dictado en campos de la ficha. Ponla aqu\u00ed abajo, en <i>Tu API key<\u002Fi>.');\n        return;\n      }\n      /* Con la key mal copiada la llamada sale igual y vuelve con un error del\n         servidor que no dice qu\u00e9 corregir; mejor atajarla aqu\u00ed. */\n      const malKey = keyMalFormada(iaCfg.prov, key);\n      if (malKey){\n        aviso('dicMsg', 'warn','<b style=\"color:var(--tx)\">Esa key no va a servir.<\u002Fb><br>' + malKey);\n        return;\n      }\n      if (dicRec) dicRec.stop();\n      const btn = $('dicCrear'), etiqueta = btn.textContent;\n      btn.disabled = true; btn.style.opacity = '.5'; btn.textContent = 'Leyendo el dictado\u2026';\n      $('dicMsg').innerHTML = '';\n      try {\n        const arr = await iaConReintento(PROMPT_DICT(txt), dicEstado);\n        dicEstado('');\n        const nuevas = [];\n        for (const it of arr){\n          if (!it || typeof it !== 'object') continue;\n          const obj = {};\n          for (const k of DICTABLES){\n            const v = it[k];\n            if (v !== undefined && v !== null && String(v).trim() !== '') obj[k] = String(v).trim();\n          }\n          if (!Object.keys(obj).length) continue;\n          if (!obj.ESTATUS) obj.ESTATUS = 'Dictada';\n          nuevas.push(hacerDictada(obj));\n        }\n        if (!nuevas.length){\n          aviso('dicMsg', 'warn','<b style=\"color:var(--tx)\">No saqu\u00e9 ning\u00fan domicilio de ah\u00ed.<\u002Fb><br>' +\n            'Revisa que el texto mencione al menos una direcci\u00f3n y vuelve a intentar.');\n          return;\n        }\n        S.dictadas = S.dictadas.concat(nuevas);\n        guardarDictadas(); rehacerDatos(); dicPintar(); desbloquear();\n        /* Las nuevas se agregan al final, as\u00ed que los \u00edndices ya seleccionados\n           siguen siendo v\u00e1lidos y se pueden palomear las reci\u00e9n creadas. */\n        for (let i = S.data.length - nuevas.length; i < S.data.length; i++) S.sel.add(i);\n        filtros(); tabla();\n        $('dicTexto').value = ''; dicBase = '';\n        aviso('dicMsg', 'ok','<b style=\"color:var(--tx)\">' + nuevas.length +\n          (nuevas.length === 1 ? ' ficha creada' : ' fichas creadas') + '<\u002Fb> y ya seleccionadas.<br>' +\n          nuevas.map(r => '\u00b7 ' + esc(r.__dict.DOMICILIO || '(sin domicilio)')).join('<br>') +\n          '<br><br>Rev\u00edsalas en <i>Domicilios<\u002Fi> o <i>Editar ficha<\u002Fi>, y de ah\u00ed sale el PDF.');\n        toast('<b>' + nuevas.length + '<\u002Fb> ficha(s) desde tu dictado.','ok');\n      } catch(e){\n        dicEstado('');\n        aviso('dicMsg', 'warn', iaErrorHtml(e));\n      } finally {\n        btn.disabled = false; btn.style.opacity = '1'; btn.textContent = etiqueta;\n      }\n    };\n\n    dicPintar();\n    iaFormPintar();\n    if (S.dictadas.length){ rehacerDatos(); desbloquear(); }\n\n    /* ---------- editor ---------- */\n    function llenarSelector(){\n      $('casasel').innerHTML = S.data.map((r,i) =>\n        '<option value=\"' + i + '\"' + (i === S.cur ? ' selected' : '') + '>' +\n        esc((valor(r,'FOLIO') ? valor(r,'FOLIO') + ' \u00b7 ' : '') + (valor(r,'DOMICILIO') || 'Fila ' + (i+1))) +\n        (editado(r) ? '  \u270e' : '') + '<\u002Foption>').join('');\n    }\n    $('casasel').onchange = () => { S.cur = +$('casasel').value; pintarEditor(); };\n    $('prevCasa').onclick = () => { if (!S.data.length) return; S.cur = (S.cur - 1 + S.data.length) % S.data.length; llenarSelector(); pintarEditor(); };\n    $('nextCasa').onclick = () => { if (!S.data.length) return; S.cur = (S.cur + 1) % S.data.length; llenarSelector(); pintarEditor(); };\n    $('resetCasa').onclick = () => {\n      if (!S.data.length) return;\n      delete S.ov[llave(S.data[S.cur])];\n      guardar(); llenarSelector(); pintarEditor(); tabla();\n      toast('Se descartaron tus cambios en este domicilio.');\n    };\n\n    const VOZ_OK = 'webkitSpeechRecognition' in window || 'SpeechRecognition' in window;\n\n    function pintarEditor(){\n      if (!S.data.length) return;\n      const r = S.data[S.cur];\n      /* Se compara contra la lista real: con el candado viejo, al subir un\n         segundo archivo el selector se quedaba con los domicilios del primero. */\n      if ($('casasel').options.length !== S.data.length) llenarSelector();\n      $('casasel').value = String(S.cur);\n      marcaTag(r);\n\n      const o = S.ov[llave(r)] || {};\n      /* La car\u00e1tula lleva ocho datos: sacar los sesenta de la ficha s\u00f3lo estorba,\n         as\u00ed que en ese modo el editor se queda con los que s\u00ed se imprimen y con\n         el nombre que llevan en la car\u00e1tula (\"Fuente\", no \"Cartera / Proyecto\"). */\n      const grupos = S.doc === 'caratula'\n        ? CAR_EDIT.map(g => ({ t:g.t, open:g.open, f:g.f.map(x => [x[0], x[1], TIPO[x[0]], x[2]]) }))\n        : GRUPOS;\n      $('editor').innerHTML = grupos.map(g =>\n        '<div class=\"mapsec' + (g.open ? '' : ' cerrada') + '\">' +\n          '<h4>' + CHEV + esc(g.t) + '<\u002Fh4>' +\n          '<div class=\"body\"><div class=\"inner\"><div class=\"fgrid\">' +\n          g.f.map(x => {\n            const k = x[0], lab = x[1], tipo = x[2];\n            /* Un campo puede traer su propia forma de sacar el valor a la vista,\n               para que el editor ense\u00f1e lo que de verdad se va a imprimir y no\n               un recuadro vac\u00edo. */\n            const v = typeof x[3] === 'function' ? x[3](r) : valor(r,k);\n            const mod = o[k] !== undefined;\n            const largo = k === 'COMENTARIOS' || k === 'DOMICILIO';\n            const ctrl = largo\n              ? '<textarea data-k=\"' + k + '\" rows=\"2\">' + esc(v) + '<\u002Ftextarea>'\n              : '<input type=\"text\" data-k=\"' + k + '\" value=\"' + esc(v) + '\"' + (\n                  tipo === 'n' ? ' inputmode=\"decimal\" placeholder=\"$0.00\"' :\n                  tipo === 'f' ? ' placeholder=\"dd/mm/aaaa\"' :\n                  tipo === 'c' ? ' maxlength=\"12\" placeholder=\"ej. 120 pz\"' : '') + '>';\n            const mic = (tipo === 't' && VOZ_OK)\n              ? '<button class=\"mic\" data-mic=\"' + k + '\" title=\"Dictar\">' +\n                '<svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"2.5\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5.5 11a6.5 6.5 0 0 0 13 0\"/><path d=\"M12 17.5V21\"/><\u002Fsvg><\u002Fbutton>'\n              : '';\n            return '<label class=\"' + (mod ? 'mod' : '') + (mic ? ' conmic' : '') + '\" data-fk=\"' + k + '\">' +\n                   '<span>' + esc(lab) + '<\u002Fspan>' + ctrl + mic + '<\u002Flabel>';\n          }).join('') +\n          '<\u002Fdiv><\u002Fdiv><\u002Fdiv>' +\n        '<\u002Fdiv>').join('');\n\n      for (const el of $('editor').querySelectorAll('[data-k]'))\n        el.oninput = () => setCampo(el.dataset.k, el.value);\n      for (const h of $('editor').querySelectorAll('.mapsec > h4'))\n        h.onclick = () => h.parentElement.classList.toggle('cerrada');\n      for (const b of $('editor').querySelectorAll('[data-mic]'))\n        b.onclick = e => { e.preventDefault(); dictar(b); };\n\n      previa();\n    }\n    function marcaTag(r){\n      $('edTag').innerHTML = editado(r)\n        ? TAG('var(--narL)','var(--nar2)','con cambios')\n        : TAG('var(--surf2)','var(--tx3)','sin cambios');\n    }\n    function setCampo(k, v){\n      const r = S.data[S.cur], key = llave(r);\n      const o = S.ov[key] || (S.ov[key] = {});\n      if (String(v).trim() === String(base(r,k)).trim()) delete o[k];\n      else o[k] = v;\n      if (!Object.keys(o).length) delete S.ov[key];\n      const lab = $('editor').querySelector('[data-fk=\"' + k + '\"]');\n      if (lab) lab.classList.toggle('mod', !!(S.ov[key] && S.ov[key][k] !== undefined));\n      marcaTag(r);\n      guardar(); contadores(); previa();\n    }\n\n    let rec = null;\n    function dictar(btn){\n      const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;\n      if (!Rec){ toast('Este navegador no tiene dictado por voz. Usa Chrome o Edge.','err'); return; }\n      if (rec){ rec.stop(); rec = null; btn.classList.remove('grabando'); return; }\n      const campo = btn.parentElement.querySelector('[data-k]');\n      rec = new Rec();\n      rec.lang = 'es-MX'; rec.interimResults = false; rec.maxAlternatives = 1;\n      btn.classList.add('grabando');\n      rec.onresult = e => {\n        const t = e.results[0][0].transcript;\n        campo.value = (campo.value ? campo.value.trim() + ' ' : '') + t;\n        setCampo(campo.dataset.k, campo.value);\n      };\n      rec.onerror = e => {\n        btn.classList.remove('grabando'); rec = null;\n        if (e.error === 'not-allowed') toast('El navegador bloque\u00f3 el micr\u00f3fono. Dale permiso y vuelve a intentar.','err');\n        else if (e.error === 'network') toast('El dictado necesita internet.','err');\n      };\n      rec.onend = () => { btn.classList.remove('grabando'); rec = null; };\n      try { rec.start(); } catch(e){ btn.classList.remove('grabando'); rec = null; }\n    }\n\n    function previa(){\n      const r = S.data[S.cur];\n      /* En modo car\u00e1tula se muestra sola, sin la mitad de abajo: al imprimir se\n         emparejan de dos en dos, pero aqu\u00ed se est\u00e1 editando una. */\n      $('escala').innerHTML = S.doc === 'caratula' ? caratula(r) : ficha(r);\n      aplicaZoom();\n      fotoBarra();\n    }\n\n    /* ---------- la foto del domicilio, desde la app ----------\n       Pegar es el camino corto desde WhatsApp: copias la foto en el chat y la\n       pegas aqu\u00ed, sin bajarla ni ir a buscarla a Descargas. Arrastrarla del\n       chat sirve con WhatsApp de escritorio, y desde el celular el bot\u00f3n abre\n       la galer\u00eda, que es donde WhatsApp ya la dej\u00f3. */\n    function fotoBarra(){\n      const bar = $('fotoBar'), r = S.data[S.cur];\n      if (!bar) return;\n      bar.style.display = (S.doc === 'ficha' && r) ? 'flex' : 'none';\n      if (S.doc !== 'ficha' || !r) return;\n      const hay = !!S.fotos[llave(r)];\n      $('fotoSt').textContent = hay\n        ? 'Ya tiene foto y va a salir impresa en el PDF.'\n        : 'P\u00e9gala con Ctrl+V, arr\u00e1strala al recuadro o el\u00edgela del disco.';\n      $('fotoBtn').textContent = hay ? 'Cambiar foto' : 'Elegir foto';\n      $('fotoQuita').style.display = hay ? 'inline-flex' : 'none';\n    }\n    async function ponFoto(file){\n      const r = S.data[S.cur];\n      if (!r || !file) return;\n      const url = await fotoReducida(file);\n      if (!url){ $('fotoSt').textContent = 'Ese archivo no es una imagen que el navegador pueda abrir.'; return; }\n      await fotoGuardar(llave(r), url);\n      previa(); tabla();\n    }\n    const huecoFoto = e => e.target.closest && e.target.closest('.slot.dom');\n    $('fotoBtn').onclick = () => $('fotoFile').click();\n    $('fotoQuita').onclick = async () => {\n      const r = S.data[S.cur];\n      if (!r) return;\n      await fotoBorrar(llave(r));\n      previa(); tabla();\n    };\n    $('fotoFile').onchange = e => { ponFoto(e.target.files[0]); e.target.value = ''; };\n    $('escala').addEventListener('click', e => { if (huecoFoto(e)) $('fotoFile').click(); });\n    for (const ev of ['dragenter','dragover'])\n      $('escala').addEventListener(ev, e => {\n        const caja = huecoFoto(e);\n        if (!caja) return;\n        e.preventDefault();\n        e.dataTransfer.dropEffect = 'copy';\n        caja.style.borderColor = '#E8892B';\n      });\n    $('escala').addEventListener('dragleave', e => {\n      const caja = huecoFoto(e);\n      if (caja) caja.style.borderColor = '';\n    });\n    $('escala').addEventListener('drop', e => {\n      const caja = huecoFoto(e);\n      if (!caja) return;\n      e.preventDefault();\n      caja.style.borderColor = '';\n      ponFoto([...(e.dataTransfer.files || [])].find(f => /^image\\//.test(f.type)));\n    });\n    /* El pegado s\u00f3lo se atrapa con la ficha en pantalla: en las dem\u00e1s vistas\n       hay campos de texto y ah\u00ed Ctrl+V es de ellos. */\n    document.addEventListener('paste', e => {\n      if (vista !== 'ficha' || S.doc !== 'ficha') return;\n      const f = [...((e.clipboardData && e.clipboardData.files) || [])].find(x => /^image\\//.test(x.type));\n      if (!f) return;\n      e.preventDefault();\n      ponFoto(f);\n    });\n    function aplicaZoom(){\n      const e = $('escala');\n      e.style.transform = 'scale(' + S.zoom + ')';\n      /* scale() encoge lo dibujado pero no la caja: sin esto la vista previa\n         dejaba a los lados y abajo un vac\u00edo gris del tama\u00f1o de lo que se\n         encogi\u00f3, y al deslizar parec\u00eda que la hoja estaba cortada. */\n      e.style.marginRight = (-816 * (1 - S.zoom)) + 'px';\n      e.style.marginBottom = (-DOC_ALTO[S.doc] * (1 - S.zoom)) + 'px';\n      $('previa').style.height = (DOC_ALTO[S.doc] * S.zoom + 34) + 'px';\n      $('zoomTxt').textContent = Math.round(S.zoom * 100) + '%';\n    }\n    $('zoomIn').onclick = () => { S.zoom = Math.min(1, S.zoom + .12); aplicaZoom(); };\n    $('zoomOut').onclick = () => { S.zoom = Math.max(.3, S.zoom - .12); aplicaZoom(); };\n\n    /* ---------- ficha (documento oficial, sin cambios) ---------- */\n    /* SOJI \u2014Soluciones Jur\u00eddicas Infonavit\u2014 es la cartera que antes se llamaba\n       DAPA. Se palomea igual con el nombre viejo, para que una fila que no se\n       haya actualizado no salga sin cartera marcada. */\n    const CARTERA_CB = { BNC:['bnc','banc','bancaria','banco'], INF:['inf','infvt','infonavit'],\n                         PIC:['pic'], SOJI:['soji','dapa'] };\n    /* El dise\u00f1o de la ficha va tal cual lo entreg\u00f3 el formato oficial: se clona\n       y se rellena por [data-field] en vez de rearmarlo a mano, para que\n       actualizarlo ma\u00f1ana sea pegar el HTML nuevo y nada m\u00e1s.\n\n       El bloque de materiales tra\u00eda los r\u00f3tulos cruzados con las llaves\n       (\"Varilla\" apuntaba a CANT_ARENA, \"Arena\" a CANT_GRAVA). Se enderez\u00f3 a\n       pedido, junto con la lista: de los diez materiales del formato viejo solo\n       cinco aparecen en el control de obra \u2014block, arena y cemento en las 14\n       viviendas, estuco en 4, varilla en 1\u2014 y grava, armex, alambre, cal, cimbra\n       y clavos no salen ni una vez. Van esos cinco en orden de uso y cinco\n       renglones libres para lo que se salga de la lista.\n\n       El nombre iba dos veces en cada etapa: arriba en \"Responsable\" y otra\n       vez abajo en \"Nombre y Firma\". Abajo queda nada m\u00e1s \"Firma\", que es lo\n       \u00fanico que se pone de pu\u00f1o y letra. La etapa 6 no tiene Responsable, as\u00ed\n       que ah\u00ed s\u00ed se sigue pidiendo el nombre junto con la firma. */\n    const FICHA_TPL = `<div class=\"page\">\n\n  <div class=\"head\">\n    <div class=\"brand\">\n      <img alt=\"THIQA\">\n      <div>\n        <div class=\"title\">FICHA DE SEGUIMIENTO<\u002Fdiv>\n        <div class=\"subtitle\">Recuperaci\u00f3n de Vivienda \u00b7 Estatus: <b data-field=\"ESTATUS\">{{ESTATUS}}<\u002Fb><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"head-fields\">\n      <div class=\"field\"><span class=\"lbl\">Cartera / Proyecto<\u002Fspan><span class=\"val-hd\" style=\"width:100px\" data-field=\"CARTERA\">{{CARTERA}}<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><span class=\"lbl\">Ruta<\u002Fspan><span class=\"val-hd\" style=\"width:50px\" data-field=\"RUTA\">{{RUTA}}<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><span class=\"lbl\">N\u00b0 Folio<\u002Fspan><span class=\"val-hd\" style=\"width:92px\" data-field=\"FOLIO\">{{FOLIO}}<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><span class=\"lbl\">Fecha<\u002Fspan><span class=\"val-hd\" style=\"width:62px\" data-field=\"FECHA\">{{FECHA}}<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"doc-cols\">\n    <div class=\"doc-main\">\n      <div class=\"panel\">\n        <div class=\"grid-2\">\n          <div class=\"field\"><span class=\"lbl\">Domicilio<\u002Fspan><span class=\"val\" data-field=\"DOMICILIO\">{{DOMICILIO}}<\u002Fspan><\u002Fdiv>\n          <div class=\"field\" style=\"gap:3px\">\n            <span class=\"lbl\">Cartera<\u002Fspan>\n            <div class=\"cbs\">\n              <div><i class=\"cb\" data-cb=\"BNC\"><\u002Fi><span>BNC<\u002Fspan><\u002Fdiv>\n              <div><i class=\"cb\" data-cb=\"INF\"><\u002Fi><span>INF<\u002Fspan><\u002Fdiv>\n              <div><i class=\"cb\" data-cb=\"PIC\"><\u002Fi><span>PIC<\u002Fspan><\u002Fdiv>\n              <div><i class=\"cb\" data-cb=\"SOJI\"><\u002Fi><span>SOJI<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"grid-4\">\n          <div class=\"field\"><span class=\"lbl\">Monto Recuperaci\u00f3n<\u002Fspan><span class=\"val\" data-field=\"MONTO_RECUPERACION\">{{MONTO_RECUPERACION}}<\u002Fspan><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl\">Fecha Recuperaci\u00f3n<\u002Fspan><span class=\"val\" data-field=\"FECHA_RECUPERACION\">{{FECHA_RECUPERACION}}<\u002Fspan><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl\">Bono<\u002Fspan><span class=\"val\" data-field=\"BONO\">{{BONO}}<\u002Fspan><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl\">Honorario Fijo<\u002Fspan><span class=\"val\" data-field=\"HONORARIO_FIJO\">{{HONORARIO_FIJO}}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"panel\" style=\"padding:7px 13px\">\n        <div class=\"grid-7\">\n          <div class=\"field\"><span class=\"lbl\">Exp. Digital<\u002Fspan><span class=\"val\" data-field=\"EXP_DIGITAL\">{{EXP_DIGITAL}}<\u002Fspan><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl\">F. Asignaci\u00f3n<\u002Fspan><span class=\"val\" data-field=\"F_ASIGNACION\">{{F_ASIGNACION}}<\u002Fspan><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl\">F. Desalojo<\u002Fspan><span class=\"val\" data-field=\"F_DESALOJO\">{{F_DESALOJO}}<\u002Fspan><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl\">F. Convenio<\u002Fspan><span class=\"val\" data-field=\"F_CONVENIO\">{{F_CONVENIO}}<\u002Fspan><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl\">Carta Poder<\u002Fspan><span class=\"val\" data-field=\"CARTA_PODER\">{{CARTA_PODER}}<\u002Fspan><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl\">Cuenta Predial<\u002Fspan><span class=\"val\" data-field=\"CUENTA_PREDIAL\">{{CUENTA_PREDIAL}}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"leader\">\n        <div class=\"avatar\"><span>Foto<\u002Fspan><img data-field=\"FOTO_LIDER\" onerror=\"this.removeAttribute('src')\" alt=\"\"><\u002Fdiv>\n        <div class=\"field\" style=\"flex:1\"><span class=\"lbl\">L\u00edder de Cuadrilla<\u002Fspan><span class=\"val\" data-field=\"LIDER\">{{LIDER}}<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"panel presu\" style=\"gap:5px; padding:7px 13px\">\n        <div class=\"caption\">Presupuesto de honorarios y bonos \u00b7 Pago del monto de recuperaci\u00f3n.<\u002Fdiv>\n        <div class=\"grid-5\">\n          <div class=\"field\"><span class=\"lbl\">Honorario Fijo<\u002Fspan><span class=\"money\" data-field=\"HONORARIO_FIJO_2\">{{HONORARIO_FIJO}}<\u002Fspan><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl\">Bono<\u002Fspan><span class=\"money\" data-field=\"BONO_2\">{{BONO}}<\u002Fspan><\u002Fdiv>\n          <div class=\"field accent\"><span class=\"lbl\">Total a Pagar<\u002Fspan><span class=\"money-or\" data-field=\"TOTAL_PAGAR\">{{TOTAL_PAGAR}}<\u002Fspan><\u002Fdiv>\n          <div class=\"field accent\"><span class=\"lbl\">Monto Acordado<\u002Fspan><span class=\"money-or\" data-field=\"MONTO_ACORDADO\">{{MONTO_ACORDADO}}<\u002Fspan><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl\">Presupuesto M\u00e1ximo<\u002Fspan><span class=\"money\" data-field=\"MONTO_MAXIMO\">{{MONTO_MAXIMO}}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"doc-side\">\n      <div class=\"qr-cols\">\n        <div class=\"qr-map\" data-qr=\"mapa\">\n          <div class=\"qr\"><\u002Fdiv>\n          <span class=\"qr-cap\">Mapa<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"qr-map\" data-qr=\"exp\">\n          <div class=\"qr\"><\u002Fdiv>\n          <span class=\"qr-cap\">Expediente<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"field foto-dom\" style=\"gap:3px\">\n        <span class=\"lbl\">Foto del Domicilio<\u002Fspan>\n        <div class=\"slot dom\"><em>Al firmar el convenio<\u002Fem><img data-field=\"FOTO_DOMICILIO\" onerror=\"this.removeAttribute('src')\" alt=\"\"><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"sec-title\">Etapas de Seguimiento<\u002Fdiv>\n\n  <div class=\"stages\">\n\n    <div class=\"row-2\">\n      <div class=\"stage\">\n        <span class=\"badge\">1 \u00b7 Solicitud de Recurso<\u002Fspan>\n        <div class=\"f2\">\n          <div class=\"field\"><span class=\"lbl-s\">Responsable<\u002Fspan><div class=\"val-sig\" data-field=\"E1_RESP\">{{E1_RESP}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl-s\">Fecha<\u002Fspan><div class=\"val-sig\" data-field=\"E1_FECHA\">{{E1_FECHA}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field span2\"><span class=\"lbl-s\">Firma<\u002Fspan><div class=\"val-sig\" data-field=\"E1_FIRMA\">{{E1_FIRMA}}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stage key\">\n        <span class=\"badge\">2 \u00b7 Entrega de Recurso<\u002Fspan>\n        <div class=\"f22\">\n          <div class=\"field\"><span class=\"lbl-s\">Fecha<\u002Fspan><div class=\"val-or\" data-field=\"E2_FECHA\">{{E2_FECHA}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl-s\">Cantidad<\u002Fspan><div class=\"val-or\" data-field=\"E2_CANTIDAD\">{{E2_CANTIDAD}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl-s\">Responsable<\u002Fspan><div class=\"val-or\" data-field=\"E2_RESP\">{{E2_RESP}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl-s\">Firma<\u002Fspan><div class=\"val-or\" data-field=\"E2_FIRMA\">{{E2_FIRMA}}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"stage\" style=\"gap:6px\">\n      <span class=\"badge\">3 \u00b7 Solicitud de Materiales y Tapeos<\u002Fspan>\n      <div class=\"f3\">\n        <div class=\"field\"><span class=\"lbl-s\">Responsable<\u002Fspan><div class=\"val-sig\" data-field=\"E3_RESP\">{{E3_RESP}}<\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><span class=\"lbl-s\">Fecha<\u002Fspan><div class=\"val-sig\" data-field=\"E3_FECHA\">{{E3_FECHA}}<\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><span class=\"lbl-s\">Firma<\u002Fspan><div class=\"val-sig\" data-field=\"E3_FIRMA\">{{E3_FIRMA}}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"mats\">\n        <div class=\"field\" style=\"gap:3px\">\n          <span class=\"lbl\">Material Utilizado \u00b7 Cant.<\u002Fspan>\n          <div class=\"mat-list\">\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"BLOCK\"><\u002Fi><b>Block<\u002Fb><i data-field=\"CANT_BLOCK\"><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"ARENA\"><\u002Fi><b>Arena<\u002Fb><i data-field=\"CANT_ARENA\"><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"CEMENTO\"><\u002Fi><b>Cemento<\u002Fb><i data-field=\"CANT_CEMENTO\"><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"ESTUCO\"><\u002Fi><b>Estuco<\u002Fb><i data-field=\"CANT_ESTUCO\"><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\" data-cb=\"VARILLA\"><\u002Fi><b>Varilla<\u002Fb><i data-field=\"CANT_VARILLA\"><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\"><\u002Fi><b><\u002Fb><i><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\"><\u002Fi><b><\u002Fb><i><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\"><\u002Fi><b><\u002Fb><i><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\"><\u002Fi><b><\u002Fb><i><\u002Fi><\u002Fdiv>\n            <div class=\"mat\"><i class=\"cb\"><\u002Fi><b><\u002Fb><i><\u002Fi><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:5px\">\n          <div class=\"field\">\n            <span class=\"lbl\">Medidas de Tapeos<\u002Fspan>\n            <span class=\"thin\" data-field=\"TAPEO_1\">{{TAPEO_1}}<\u002Fspan>\n            <span class=\"thin\" data-field=\"TAPEO_2\">{{TAPEO_2}}<\u002Fspan>\n            <span class=\"thin\" data-field=\"TAPEO_3\">{{TAPEO_3}}<\u002Fspan>\n            <span class=\"thin\" data-field=\"TAPEO_4\">{{TAPEO_4}}<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"field accent\">\n            <span class=\"lbl\">Total Materiales<\u002Fspan>\n            <span class=\"money-or\" data-field=\"TOTAL_MATERIALES\">{{TOTAL_MATERIALES}}<\u002Fspan>\n            <span class=\"lbl-s\" data-field=\"NOTA_OBRA\" style=\"line-height:1.3\"><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"row-2\">\n      <div class=\"stage\">\n        <span class=\"badge\">4 \u00b7 Avance de Obra<\u002Fspan>\n        <div class=\"f2\">\n          <div class=\"field\"><span class=\"lbl-s\">Responsable<\u002Fspan><div class=\"val-sig\" data-field=\"E4_RESP\">{{E4_RESP}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl-s\">Fecha<\u002Fspan><div class=\"val-sig\" data-field=\"E4_FECHA\">{{E4_FECHA}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field span2\"><span class=\"lbl-s\">Firma<\u002Fspan><div class=\"val-sig\" data-field=\"E4_FIRMA\">{{E4_FIRMA}}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"stage\">\n        <span class=\"badge\">5 \u00b7 Supervisi\u00f3n del Encargado<\u002Fspan>\n        <div class=\"f2\">\n          <div class=\"field\"><span class=\"lbl-s\">Responsable<\u002Fspan><div class=\"val-sig\" data-field=\"E5_RESP\">{{E5_RESP}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field\"><span class=\"lbl-s\">Fecha<\u002Fspan><div class=\"val-sig\" data-field=\"E5_FECHA\">{{E5_FECHA}}<\u002Fdiv><\u002Fdiv>\n          <div class=\"field span2\"><span class=\"lbl-s\">Firma<\u002Fspan><div class=\"val-sig\" data-field=\"E5_FIRMA\">{{E5_FIRMA}}<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"stage key\" style=\"gap:6px\">\n      <span class=\"badge\">6 \u00b7 Entrega de Honorarios<\u002Fspan>\n      <div class=\"f3\">\n        <div class=\"field\"><span class=\"lbl-s\">Fecha<\u002Fspan><div class=\"val-or\" data-field=\"E6_FECHA\">{{E6_FECHA}}<\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><span class=\"lbl-s\">Cantidad<\u002Fspan><div class=\"val-or\" data-field=\"E6_CANTIDAD\">{{E6_CANTIDAD}}<\u002Fdiv><\u002Fdiv>\n        <div class=\"field\"><span class=\"lbl-s\">Nombre y Firma<\u002Fspan><div class=\"val-or\" data-field=\"E6_FIRMA\">{{E6_FIRMA}}<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"notes\" style=\"width:761px; height:8px\"><\u002Fdiv>\n\n  <div class=\"foot\">\n    <div class=\"foot-grid\">\n      <div class=\"field\"><div class=\"foot-line\"><\u002Fdiv><span class=\"foot-cap\">Autorizado \u00b7 Nombre y firma<\u002Fspan><\u002Fdiv>\n      <div class=\"field\"><div class=\"foot-line\"><\u002Fdiv><span class=\"foot-cap\">Recibido \u00b7 Nombre y firma<\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"foot-note\">Documento interno THIQA \u00b7 Recuperaci\u00f3n de Vivienda \u00b7 Tlajomulco de Z\u00fa\u00f1iga, Jalisco<\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>`;\n\n    /* Recortes heredados de la ficha anterior: la hoja mide fijo y desborda en\n       silencio, as\u00ed que un texto largu\u00edsimo empujar\u00eda el resto fuera de la\n       p\u00e1gina en vez de avisar. */\n    const FICHA_MAX = { ESTATUS:34, CARTERA:22, RUTA:10, FOLIO:18, FECHA:12,\n      DOMICILIO:72, MONTO_RECUPERACION:18, FECHA_RECUPERACION:18, BONO:18,\n      HONORARIO_FIJO:18, EXP_DIGITAL:18, F_ASIGNACION:14, F_DESALOJO:14,\n      F_CONVENIO:14, CARTA_PODER:14, CUENTA_PREDIAL:16, LIDER:34,\n      E1_RESP:26, E1_FECHA:14, E1_FIRMA:48, E2_RESP:22, E2_FECHA:16,\n      E2_CANTIDAD:16, E2_FIRMA:22, E3_RESP:26, E3_FECHA:14, E3_FIRMA:48,\n      E4_RESP:26, E4_FECHA:14, E4_FIRMA:48, E5_RESP:26, E5_FECHA:14,\n      E5_FIRMA:48, E6_FECHA:16, E6_CANTIDAD:16, E6_FIRMA:52,\n      TAPEO_1:34, TAPEO_2:34, TAPEO_3:34, TAPEO_4:34 };\n\n    /* Campos que se imprimen como liga viva: al guardar como PDF, Chrome\n       conserva el <a>, as\u00ed que desde el celular se abre Maps o la carpeta de\n       Drive sin teclear nada. El domicilio siempre lleva mapa, aunque el Sheet\n       no traiga la liga: mapaUrl() la arma con la direcci\u00f3n. */\n    const FICHA_LIGAS = { DOMICILIO: r => mapaUrl(r), EXP_DIGITAL: r => liga(r,'EXP_DIGITAL') };\n\n    function ficha(r){\n      const v = {};\n      for (const k of CAMPOS) v[k] = String(valor(r,k) ?? '');\n\n      if ($('autocalc').checked && !v.TOTAL_PAGAR){\n        const h = toNumber(v.HONORARIO_FIJO), b = toNumber(v.BONO);\n        if (!isNaN(h) || !isNaN(b)) v.TOTAL_PAGAR = fmtMoney((isNaN(h)?0:h) + (isNaN(b)?0:b));\n      }\n      if (!v.FECHA) v.FECHA = fmtFecha(new Date());\n      v.NOTA_OBRA = String(valor(r,'NOTA_OBRA') ?? '');\n      /* El formato repite honorario y bono abajo, en el presupuesto. */\n      v.HONORARIO_FIJO_2 = v.HONORARIO_FIJO;\n      v.BONO_2 = v.BONO;\n      /* La bit\u00e1cora trae una sola columna de dinero acordado, \"MONTO ACORDADO\",\n         y esa ya alimenta el monto de recuperaci\u00f3n de arriba. El formato lo pide\n         otra vez en el presupuesto, as\u00ed que sin columna propia se repite en vez\n         de dejar el recuadro en blanco. */\n      if (!v.MONTO_ACORDADO) v.MONTO_ACORDADO = v.MONTO_RECUPERACION;\n\n      const d = document.createElement('div');\n      d.innerHTML = FICHA_TPL;\n\n      const logo = d.querySelector('.brand img');\n      if (logo) logo.src = LOGO;\n\n      /* La foto del l\u00edder sale del cat\u00e1logo por nombre; sin foto se queda el\n         c\u00edrculo punteado para pegarla a mano. */\n      const foto = fotoLider(r), av = d.querySelector('.avatar');\n      if (av && foto){\n        av.classList.add('con-foto');\n        av.querySelector('img').src = foto;\n        const ph = av.querySelector('span');\n        if (ph) ph.remove();\n      }\n\n      /* La del domicilio es la que se peg\u00f3 para esta casa. Va como data URL, no\n         como liga: al imprimir, el navegador s\u00f3lo dibuja lo que ya tiene\n         cargado, y una liga de Drive o de WhatsApp o pide sesi\u00f3n o tarda m\u00e1s de\n         lo que el cuadro de impresi\u00f3n espera. Sin foto se queda el punteado\n         para pegar la impresa encima. */\n      const fotoDom = S.fotos[llave(r)], hueco = d.querySelector('.slot.dom');\n      if (hueco && fotoDom){\n        hueco.classList.add('con-foto');\n        hueco.querySelector('img').src = fotoDom;\n        const pie = hueco.querySelector('em');\n        if (pie) pie.remove();\n      }\n\n      for (const el of d.querySelectorAll('[data-field]')){\n        const k = el.dataset.field;\n        /* Los huecos de foto se quedan vac\u00edos: son para pegar en campo.
