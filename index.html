document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

100%;border-collapse:separate;border-spacing:0;font-size:13.5px}\n#tbl th{position:sticky;top:0;background:var(--surf2);text-align:left;padding:12px 15px;\n  font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--tx3);\n  border-bottom:1px solid var(--brd);white-space:nowrap;z-index:2;backdrop-filter:blur(6px)}\n#tbl td{padding:12px 15px;border-bottom:1px solid var(--brd);white-space:nowrap;vertical-align:middle;color:var(--tx2)}\n#tbl tbody tr{cursor:pointer;transition:background .15s}\n#tbl tbody tr:hover{background:var(--surf2)}\n#tbl tbody tr[data-sel=\"1\"]{background:var(--narL)}\n#tbl tbody tr[data-sel=\"1\"] td:first-child{box-shadow:inset 3px 0 0 var(--nar)}\n#tbl td.clave{font-family:var(--ttl);font-weight:700;color:var(--azul);letter-spacing:-.01em}\n#tbl td.wrap{white-space:normal;min-width:230px;max-width:400px}\n\n.mapsec{border-top:1px solid var(--brd)}\n.mapsec:first-child{border-top:0}\n.mapsec>h4{margin:0;padding:13px 2px;font-family:var(--txt);font-size:11px;font-weight:700;\n  text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);cursor:pointer;user-select:none;\n  display:flex;align-items:center;gap:9px;transition:color .16s}\n.mapsec>h4:hover{color:var(--nar2)}\n.mapsec>h4 .chev{width:18px;height:18px;flex:none;display:grid;place-items:center;border-radius:6px;\n  background:var(--narL);color:var(--nar2);transition:transform .28s cubic-bezier(.4,1.3,.5,1)}\n.mapsec.cerrada>h4 .chev{transform:rotate(-90deg)}\n.mapsec .cnt{margin-left:auto;font-weight:700;color:var(--tx3);font-variant-numeric:tabular-nums}\n.mapsec .body{display:grid;grid-template-rows:1fr;transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1),opacity .24s}\n.mapsec.cerrada .body{grid-template-rows:0fr;opacity:0}\n.mapsec .body>.inner{overflow:hidden}\n.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:13px 16px;padding:2px 2px 18px}\n.fgrid label{margin:0;display:block;position:relative}\n.fgrid label>span{display:block;font-size:10px;font-weight:700;text-transform:uppercase;\n  letter-spacing:.11em;color:var(--tx3);margin-bottom:6px;transition:color .16s}\n.fgrid label.ok>span,.fgrid label.mod>span{color:var(--nar2)}\n.fgrid label.mod input,.fgrid label.mod textarea{background:var(--narL);border-color:var(--nar)}\n.fgrid label.mod>span::after{content:\" \u00b7 editado\"}\n.conmic input,.conmic textarea{padding-right:46px}\n.mic{position:absolute;right:5px;bottom:5px;width:34px;height:34px;border:0;border-radius:9px;\n  background:transparent;color:var(--tx3);cursor:pointer;font-size:15px;display:grid;place-items:center;transition:.16s}\n.mic:hover{color:var(--nar2);background:var(--narL)}\n.mic.grabando{color:#fff;background:var(--nar);animation:tq-ring 1.2s infinite}\n#dicMic.grabando{background:#C45454;animation:tq-ring 1.2s infinite}\n\n.sk{background:linear-gradient(90deg,var(--surf2) 8%,var(--brd) 32%,var(--surf2) 56%);\n  background-size:920px 100%;animation:tq-shim 1.3s linear infinite;border-radius:8px;height:14px}\n\n/* casillas de estatus de ruta */\n.chip{display:inline-flex;align-items:center;gap:8px;min-height:38px;padding:7px 13px;\n  border:1px solid var(--nar);border-radius:11px;background:var(--narL);color:var(--tx);\n  font-family:var(--txt);font-weight:600;font-size:13px;cursor:pointer;transition:.18s}\n.chip i{width:15px;height:15px;flex:none;border-radius:4px;border:1.5px solid var(--nar);\n  background:var(--nar);display:grid;place-items:center;transition:.18s}\n.chip i::after{content:\"\";width:8px;height:4px;border:1.5px solid #fff;border-top:0;border-right:0;\n  transform:rotate(-45deg) translate(1px,-1px)}\n.chip b{font-size:11.5px;font-weight:700;color:var(--nar2);font-variant-numeric:tabular-nums}\n.chip.off{border-color:var(--brd2);background:var(--surf);color:var(--tx3)}\n.chip.off i{border-color:var(--brd2);background:transparent}\n.chip.off i::after{display:none}\n.chip.off b{color:var(--tx3)}\n.chip:hover{border-color:var(--nar2)}\n\n@media(max-width:1000px){\n  #aside{position:fixed!important;transform:translateX(-112%);z-index:200;\n    transition:transform .32s cubic-bezier(.4,0,.2,1)!important}\n  /* La sombra que oscurec\u00eda el resto era pintada y no recib\u00eda el toque, as\u00ed que\n     una vez abierto el men\u00fa no hab\u00eda c\u00f3mo cerrarlo sin cambiar de pesta\u00f1a. El\n     velo de verdad va en #velo. */\n  #aside[data-open=\"1\"]{transform:translateX(0)}\n  #main{margin-left:0!important}\n  #hamb{display:grid!important}\n  #contenido{padding:14px!important;padding-bottom:140px!important}\n  #savebar{left:12px!important;right:12px!important}\n  .solo-esc{display:none!important}\n}\n/* En celular el stepper iba forzado en un rengl\u00f3n y empujaba la p\u00e1gina 39 px a\n   la derecha; con eso la barra de abajo se sal\u00eda de la pantalla. Y la barra\n   entera se com\u00eda un tercio de la pantalla, tapando las \u00faltimas filas de la\n   tabla, porque cada cosa ca\u00eda en su propio rengl\u00f3n. */\n@media(max-width:560px){\n  #stepper{flex-wrap:wrap;gap:10px 14px;padding:0!important}\n  #stepper .stpL{display:none}\n  #savebar{padding:10px 12px!important;border-radius:14px!important}\n  #savebar > div{gap:9px!important}\n  #doctipoBox{width:100%;order:2}\n  #doctipoBox > div:first-child{margin-bottom:4px}\n  #savebar #doctipo{width:100%}\n  #savebar .doctab{flex:1;justify-content:center;text-align:center;padding:8px 6px;font-size:12px}\n  #savebar #btnEditar{order:3;flex:1 1 40%;justify-content:center;min-width:0;padding:11px 8px;font-size:12.5px;min-height:42px}\n  #savebar #btnpdf{order:4;flex:1 1 45%;justify-content:center;min-width:0;padding:11px 8px;font-size:13.5px;min-height:42px}\n  #doctipoHero{width:100%}\n  .doctab-hero{flex:1}\n  #contenido{padding-bottom:230px!important}\n  /* Las cuatro tarjetas de arriba se com\u00edan cuatro pantallas antes de llegar a\n     la tabla, que es a lo que se entra. */\n  #v-casas > div:first-child{grid-template-columns:1fr 1fr!important;gap:10px!important}\n  .kpi{padding:11px 13px!important}\n  .kpi .kpiNum{font-size:24px!important;margin-top:3px!important}\n  .kpi .kpiPie{display:none}\n}\n@media(max-width:1240px){ #split{grid-template-columns:1fr!important} #previaCard{position:static!important} }\n\n/* En la vista previa el hueco de la foto es el blanco para soltarla o para\n   hacer clic; en el papel no cambia nada, porque esto vive fuera de .page. */\n#escala .slot.dom{cursor:pointer}\n#escala .slot.dom:hover{border-color:var(--nar)}\n\n/* ============================================================\n   FICHA \u00b7 hoja carta 816 x 1056 px\n   Estilos del formato oficial, acotados a .page para que sus clases\n   gen\u00e9ricas (.val, .field, .panel) no se salgan a la interfaz.\n   ============================================================ */\n.page,.page *{box-sizing: border-box; -webkit-print-color-adjust: exact; print-color-adjust: exact;}\n@media print{\n  .page{box-shadow: none; margin: 0;}\n}\n.page{width: 816px; height: 1056px; padding: 22px 28px; margin: 0 auto; overflow: hidden; background: #FFFFFF; color: #1B3A5C; font-family: Arial, Helvetica, sans-serif; display: flex; flex-direction: column; gap: 6px;}\n.page .lbl{font-size: 7.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: #8B96A1;}\n.page .lbl-s{font-size: 7.5px; color: #8B96A1;}\n.page .val{border-bottom: 1.5px solid #C9D2DB; min-height: 16px; font-size: 11px; font-weight: 700; color: #1B3A5C;}\n.page .val-hd{border-bottom: 1.5px solid #1B3A5C; white-space: nowrap; font-size: 10.5px; font-weight: 700; color: #1B3A5C; min-height: 15px;}\n.page .val-sig{border-bottom: 1.5px solid #C9D2DB; min-height: 21px; font-size: 11px; font-weight: 700; color: #1B3A5C;}\n.page .val-or{border-bottom: 1.5px solid #E8892B; min-height: 21px; font-size: 11.5px; font-weight: 700; color: #1B3A5C;}\n.page .money{border-bottom: 1.5px solid #C9D2DB; min-height: 17px; font-size: 12.5px; font-weight: 700; color: #1B3A5C;}\n.page .money-or{border-bottom: 1.5px solid #E8892B; min-height: 17px; font-size: 12.5px; font-weight: 700; color: #E8892B;}\n.page .field{display: flex; flex-direction: column; gap: 2px;}\n.page .accent{border-left: 2px solid #E8892B; padding-left: 9px;}\n.page .accent .lbl{color: #E8892B;}\n.page .head{display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2px solid #1B3A5C; padding-bottom: 7px;}\n.page .brand{display: flex; align-items: center; gap: 10px;}\n.page .brand img{height: 30px; width: auto; object-fit: contain;}\n.page .title{font-size: 14px; font-weight: 700; letter-spacing: .3px;}\n.page .subtitle{font-size: 9px; color: #5B6670;}\n.page .subtitle b{color: #1B3A5C;}\n.page .head-fields{display: flex; gap: 10px;}\n.page .panel{background: #F4F6F8; border-radius: 6px; padding: 8px 13px; display: flex; flex-direction: column; gap: 7px;}\n.page .grid-2{display: grid; grid-template-columns: 3.9fr 1fr; gap: 14px; align-items: end;}\n.page .grid-4{display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; align-items: end;}\n/* Todo lo que se escanea o se pega vive en un solo riel a la derecha: los dos\n   c\u00f3digos arriba \u2014a la altura del domicilio y del expediente que abren\u2014 y la\n   foto del domicilio abajo. Los dos QR de 92 px con su aire de por medio miden\n   justo lo que mide la foto, as\u00ed que el borde derecho de la hoja queda a plomo\n   en vez de escalonado.\n\n   92 px es el piso de un QR: m\u00e1s chico, los m\u00f3dulos de una direcci\u00f3n completa\n   bajan de 0.4 mm en papel y el celular empieza a batallar. A este tama\u00f1o salen\n   0.43 mm, y cuando el Sheet trae la liga con coordenadas el c\u00f3digo es m\u00e1s\n   corto todav\u00eda.\n\n   Los cuatro bloques de la izquierda se reparten el alto del riel; estiran el\n   del l\u00edder y el del presupuesto, que son los que traen menos renglones. */\n.page .doc-cols{display: flex; align-items: stretch; gap: 9px;}\n.page .doc-cols .doc-main{flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px;}\n.page .doc-main .leader,.page .doc-main .presu{flex: 1 1 auto;}\n.page .doc-main .presu{justify-content: center;}\n.page .doc-side{flex: none; width: 193px; display: flex; flex-direction: column; gap: 6px;}\n.page .qr-cols{display: flex; gap: 9px; justify-content: center;}\n.page .qr-map{width: 92px; display: flex; flex-direction: column; align-items: center; gap: 2px;}\n.page .qr-map svg{display: block; width: 92px; height: 92px;}\n.page .qr-cap{font-size: 7px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: #8B96A1; text-align: center;}\n/* Las cinco cifras del presupuesto ya no se llevan el ancho entero de la\n   hoja: la foto del domicilio ocupa su parte. Repartidas parejo, el r\u00f3tulo de\n   Presupuesto M\u00e1ximo se part\u00eda en dos renglones y bajaba su cifra medio\n   rengl\u00f3n respecto a las otras cuatro, as\u00ed que cada columna va al ancho que\n   pide su r\u00f3tulo. */\n.page .grid-5{display: grid; grid-template-columns: 0.95fr 0.75fr 1fr 1.05fr 1.25fr; gap: 10px;}\n.page .grid-7{display: grid; grid-template-columns: repeat(6, 1fr); gap: 9px; align-items: end;}\n.page .grid-7 .val{font-size: 9.5px; min-height: 15px;}\n.page .caption{font-size: 8.5px; font-style: italic; color: #5B6670; border-bottom: 1px solid #D5DAE0; padding-bottom: 4px;}\n.page .leader{background: #F4F6F8; border-radius: 6px; padding: 7px 13px; display: flex; align-items: center; gap: 11px;}\n.page .avatar{width: 50px; height: 50px; flex: none; border-radius: 50%; border: 1.5px dashed #B9C3CE; background: #FFFFFF; overflow: hidden; display: flex; align-items: center; justify-content: center;}\n.page .avatar span{font-size: 8px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: #A6B0BB;}\n.page .avatar img{width: 100%; height: 100%; object-fit: cover;}\n.page .avatar img[src=\"\"],.page .avatar img:not([src]),.page .avatar img[src^=\"{{\"]{display: none;}\n/* Cuatro carteras en dos por dos y pegadas entre s\u00ed, no en una fila que cruza\n   el panel: as\u00ed el domicilio se queda con el rengl\u00f3n casi entero y cabe\n   completo aunque venga con colonia, C.P. y municipio. */\n.page .cbs{display: grid; grid-template-columns: max-content max-content; gap: 3px 12px; justify-content: start;}\n.page .cbs > div{display: flex; align-items: center; gap: 3px;}\n.page .cbs span{font-size: 8px; font-weight: 700;}\n.page .cb{width: 11px; height: 11px; border-radius: 2px; border: 1.5px solid #1B3A5C; background: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; font-style: normal; font-size: 8px; font-weight: 700; color: #FFFFFF; flex: none;}\n.page .cb.on{background: #1B3A5C;}\n.page .cb.on::after{content: \"\\2713\";}\n.page .sec-title{font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; border-bottom: 2px solid #E8892B; padding-bottom: 4px;}\n.page .stages{display: flex; flex-direction: column; gap: 9px; flex: 0 0 auto;}\n.page .row-2{display: grid; grid-template-columns: 1fr 1fr; gap: 9px;}\n.page .stage{border: 1px solid #E3E8ED; border-radius: 8px; padding: 10px 14px; display: flex; flex-direction: column; gap: 6px;}\n.page .stage.key{border-color: #E8892B; background: rgba(232,137,43,.06);}\n.page .badge{font-size: 9.5px; font-weight: 700; color: #FFFFFF; background: #1B3A5C; padding: 2px 8px; border-radius: 3px; align-self: flex-start;}\n.page .stage.key .badge{background: #E8892B;}\n.page .f3{display: grid; grid-template-columns: 1.4fr 0.8fr 1.6fr; gap: 14px;}\n.page .f2{display: grid; grid-template-columns: 1.3fr 0.9fr; gap: 12px;}\n.page .f22{display: grid; grid-template-columns: 1fr 1fr; gap: 12px;}\n.page .span2{grid-column: span 2;}\n.page .mats{display: grid; grid-template-columns: 1.7fr 1.1fr; gap: 12px; align-items: start;}\n.page .mat-list{display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px;}\n.page .mat{display: grid; grid-template-columns: 11px 1fr 46px; gap: 5px; align-items: end; border-bottom: 1px solid #E3E8ED; min-height: 14px;}\n.page .mat .cb{margin-bottom: 2px;}\n.page .mat b{font-size: 9px; font-weight: 400; color: #5B6670; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;}\n.page .mat i{font-style: normal; font-size: 9px; font-weight: 700; color: #1B3A5C; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; text-align: right;}\n.page .thin{border-bottom: 1px solid #E3E8ED; min-height: 15px; font-size: 9.5px; color: #1B3A5C;}\n/* La hoja se imprime al firmar el convenio y de ah\u00ed se va a firmar a mano:\n   para cuando hay avance de obra ya trae la firma del l\u00edder de cuadrilla y la\n   de solicitud de recurso, as\u00ed que reimprimirla nada m\u00e1s para pegarle las\n   fotos de obra obligaba a volver a juntar firmas. Por eso salieron los seis\n   huecos de antes y despu\u00e9s y el de materiales.\n\n   Queda uno solo, el del domicilio, que existe desde que se firma el convenio\n   y por eso s\u00ed alcanza a salir impreso. Va junto al l\u00edder y al presupuesto,\n   ocupando el lugar que dejaron los huecos de la etapa 4, para que la hoja no\n   acabe con un blanco al final. */\n.page .slot{position: relative; border: 1.5px dashed #B9C3CE; border-radius: 6px; background: #FBFCFD; overflow: hidden; display: flex; align-items: center; justify-content: center;}\n.page .slot.dom{width: 193px; height: 190px;}\n.page .slot em{font-style: normal; font-size: 8.5px; color: #A6B0BB;}\n.page .slot img{position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;}\n.page .slot img[src=\"\"],.page .slot img:not([src]),.page .slot img[src^=\"{{\"]{display: none;}\n.page .notes{display: flex; flex-direction: column; gap: 3px; flex: 1 1 auto; min-height: 16px;}\n.page .notes-title{font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px;}\n.page .notes-box{border: 1px solid #D3DAE1; border-radius: 5px; background: #FBFCFD; flex: 1; min-height: 28px; padding: 4px 7px; font-size: 9.5px; color: #1B3A5C;}\n.page .foot{display: flex; flex-direction: column; gap: 4px; border-top: 1px solid #C9D2DB; padding-top: 6px;}\n.page .foot-grid{display: grid; grid-template-columns: 1fr 1fr; gap: 24px;}\n.page .foot-line{border-bottom: 1.5px solid #1B3A5C; min-height: 17px;}\n.page .foot-cap{font-size: 7.5px; color: #8B96A1; text-align: center;}\n.page .foot-note{font-size: 8px; font-style: italic; color: #6B7684; text-align: center;}\n/* Con foto puesta, el punteado sobra: eso marca un hueco por llenar. */\n.page .avatar.con-foto,.page .slot.con-foto{border:1.5px solid #C9D2DB}\n/* El dise\u00f1o se midi\u00f3 con el interlineado por omisi\u00f3n del navegador. Dentro\n   de la app heredar\u00eda el de la interfaz (1.55) y la hoja se desbordar\u00eda. */\n.page{line-height:normal}\n/* La liga va invisible: en papel se lee como cualquier otro dato y en el\n   PDF sigue siendo clicable para abrir Maps desde el celular. */\n.page a{color:inherit;text-decoration:none}\n\n/* ============================================================\n   CAR\u00c1TULA DEL EXPEDIENTE F\u00cdSICO \u00b7 media carta, dos por hoja\n\n   Es la portada que va engrapada al frente de la carpeta, no un\n   documento de seguimiento: por eso lleva nada m\u00e1s lo que se lee\n   de canto en el archivero \u2014domicilio, cuadrilla, monto y fechas\u2014\n   y la lista de lo que debe traer adentro.\n\n   La hoja mide lo mismo que la ficha (816 x 1056) y se parte a la\n   mitad: cada car\u00e1tula ocupa 528 px y la l\u00ednea punteada marca por\n   d\u00f3nde cortar. Las clases del formato van acotadas a .car para\n   que sus nombres gen\u00e9ricos (.header, .checkbox) no se salgan a\n   la interfaz.\n   ============================================================ */\n.page.hoja-car{padding:0;gap:0;position:relative}\n/* La l\u00ednea de corte iba tan tenue que no se ve\u00eda en papel, y nada dec\u00eda para\n   qu\u00e9 era. El r\u00f3tulo va sobre la l\u00ednea, anclado a la hoja para que tambi\u00e9n\n   salga cuando la mitad de abajo va en blanco. */\n.page.hoja-car::after{content:'\u2702  CORTAR POR AQU\u00cd';position:absolute;top:528px;left:50%;\n  transform:translate(-50%,-50%);background:#FFFFFF;padding:0 10px;font-size:7px;font-weight:700;\n  letter-spacing:.18em;color:#7E9CC0;font-family:'Segoe UI',Arial,Helvetica,sans-serif;white-space:nowrap}\n.car{width:816px;height:528px;padding:29px 38px;display:flex;flex-direction:column;gap:8px;overflow:hidden;\n  background:#FFFFFF;color:#163E6B;font-family:'Segoe UI',Arial,Helvetica,sans-serif}\n/* La l\u00ednea va sobre la hoja, no entre las car\u00e1tulas: as\u00ed tambi\u00e9n sale cuando la\n   selecci\u00f3n es impar y la mitad de abajo queda en blanco. */\n.page.hoja-car::before{content:'';position:absolute;top:528px;left:0;right:0;border-top:1.5px dashed #7E9CC0}\n.car .header{background:#163E6B;border-radius:8px;padding:12px 18px;display:flex;align-items:center;gap:14px}\n.car .logo-box{background:#FFFFFF;border-radius:8px;padding:5px 8px;display:flex;align-items:center;flex:none}\n.car .logo-box img{height:34px;width:auto;display:block}\n.car .header-title{flex:1;min-width:0}\n.car .header-title h1{margin:0;font-size:17px;font-weight:800;color:#FFFFFF;line-height:1.1}\n.car .header-title p{margin:2px 0 0;font-size:10.5px;color:#BFD2E8}\n.car .estatus-box{background:#2E5A8C;border-radius:6px;padding:5px 10px;text-align:center;flex:none;width:132px}\n/* El folio va junto al estatus: es lo que se busca al hojear el archivero, y\n   sin \u00e9l la portada no dice de qu\u00e9 expediente es la carpeta. */\n.car .folio-box{background:#22456E;width:118px}\n.car .estatus-label{font-size:8px;font-weight:700;letter-spacing:.08em;color:#BFD2E8;text-transform:uppercase}\n.car .estatus-val{font-size:10.5px;font-weight:700;color:#FFFFFF;line-height:1.25;text-transform:uppercase;\n  min-height:1.2em;overflow-wrap:anywhere}\n.car .field-label{font-size:8.5px;font-weight:700;letter-spacing:.08em;color:#2E5A8C;text-transform:uppercase;\n  margin-bottom:2px}\n.car .field-card{background:#F4F8FC;border:1px solid #DCE6F1;border-radius:7px;padding:7px 14px;min-width:0}\n.car .field-card-gold{background:#FBF3E8;border:1px solid #F0DAB4;border-radius:7px;padding:7px 14px;min-width:0}\n.car .field-card-gold .field-label{color:#B36A0E}\n.car .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}\n.car .row3-dates{display:flex;gap:8px}\n.car .row3-dates > div{width:220px}\n/* Vac\u00edo se queda la l\u00ednea del recuadro para llenarla a mano, igual que en la ficha. */\n.car .dato{min-height:1.2em;color:#163E6B;overflow-wrap:anywhere}\n.car .dato.gold{color:#B36A0E;font-weight:700;font-size:15px}\n.car .dato.domicilio{font-size:11.5px;line-height:1.35}\n.car .dato.normal{font-size:12px}\n.car .dato.fecha{font-size:13px}\n.car .docs-section{margin-top:2px}\n.car .docs-title{font-size:9px;font-weight:700;letter-spacing:.08em;color:#2E5A8C;text-transform:uppercase;\n  border-bottom:1.5px solid #EAF0F7;padding-bottom:4px;margin-bottom:8px}\n.car .docs-body{display:flex;align-items:flex-start;gap:18px}\n.car .docs-grid{flex:1;min-width:0;display:grid;grid-template-columns:1fr 1fr;column-gap:20px;row-gap:6px}\n/* El QR se va al hueco que queda a la derecha de las casillas, para no apretar\n   nada: el recuadro es vectorial, as\u00ed que en papel sale n\u00edtido aunque en\n   pantalla se vea chico. */\n.car .qr-box{flex:none;width:122px;text-align:center}\n.car .qr svg{display:block;width:122px;height:122px}\n.car .qr-cap{margin-top:2px;font-size:7.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#2E5A8C}\n.car .doc-item{display:flex;align-items:center;gap:8px}\n.car .checkbox{width:15px;height:15px;border:1.6px solid #163E6B;border-radius:3px;flex:none}\n.car .doc-item span{font-size:12px;color:#163E6B}\n\n/* Selector del documento que se va a imprimir, en la barra de abajo. */\n/* La opci\u00f3n apagada iba en var(--tx3) y se le\u00eda como deshabilitada, no como\n   \"la otra que puedes escoger\". */\n.doctab{display:inline-flex;align-items:center;min-height:38px;padding:8px 14px;border:0;border-radius:10px;\n  background:transparent;color:var(--tx2);font-family:var(--txt);font-weight:600;font-size:13px;cursor:pointer;\n  transition:background .18s,color .18s}\n.doctab:hover{color:var(--tx)}\n.doctab[data-on=\"1\"]{background:var(--surf);color:var(--azul);font-weight:700;box-shadow:var(--sh1)}\n/* El mismo selector, sobre el encabezado azul del primer paso. */\n.doctab-hero{flex-direction:column;align-items:flex-start;gap:2px;padding:9px 15px;color:rgba(255,255,255,.72)}\n.doctab-hero:hover{color:#fff}\n.doctab-hero small{font-size:10.5px;font-weight:500;opacity:.75}\n.doctab-hero[data-on=\"1\"]{background:#fff;color:var(--sideB)}\n.doctab-hero[data-on=\"1\"] small{opacity:.65}\n\n#printarea{display:none}\n@page{size:letter portrait;margin:0}\n@media print{\n  html,body{background:#fff}\n  #app,#savebar,#modal,#toasts{display:none!important}\n  #printarea{display:block!important}\n  #printarea .page{margin:0;box-shadow:none;break-after:page;page-break-after:always}\n  #printarea .page:last-child{break-after:auto;page-break-after:auto}\n}\n<\u002Fstyle>\n<script src=\"958f562f-cee0-4079-892c-b8622e301ef8\"><\u002Fscript>\n<\u002Fhelmet>\n\n<div id=\"app\" style=\"display:flex;min-height:100vh;background:var(--bg)\">\n\n  <aside id=\"aside\" style=\"width:var(--side);flex:0 0 var(--side);position:fixed;top:0;bottom:0;left:0;z-index:80;\n    display:flex;flex-direction:column;overflow:hidden;\n    background:linear-gradient(168deg,var(--sideA) 0%,var(--sideB) 100%)\">\n\n    <div style=\"position:absolute;inset:0;pointer-events:none;opacity:.09;overflow:hidden\">\n      <img src=\"2ea9d9ae-6484-4dc9-afc9-8e7dfb28f2e1\" alt=\"\" aria-hidden=\"true\" width=\"1390\" height=\"704\" style=\"position:absolute;right:-96px;bottom:52px;width:330px;height:auto\">\n    <\u002Fdiv>\n\n    <div style=\"padding:24px 22px 18px;position:relative\">\n      <img src=\"2ea9d9ae-6484-4dc9-afc9-8e7dfb28f2e1\" alt=\"THIQA\" width=\"1390\" height=\"704\" style=\"width:152px;height:auto;display:block;animation:tq-up .55s cubic-bezier(.2,.7,.3,1) both\">\n      <div style=\"display:flex;align-items:center;gap:7px;margin-top:14px;\n        animation:tq-up .55s cubic-bezier(.2,.7,.3,1) .08s both\">\n        <span style=\"width:16px;height:2px;border-radius:2px;background:var(--nar);display:block\"><\u002Fspan>\n        <span id=\"ladoTxt\" style=\"font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.6);font-weight:600\">Fichas de seguimiento<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <nav id=\"nav\" style=\"padding:6px 0;flex:1;overflow-y:auto;position:relative\">\n      <div id=\"navPill\" style=\"position:absolute;left:0;top:0;width:4px;height:46px;border-radius:0 4px 4px 0;\n        background:var(--nar);box-shadow:0 0 16px rgba(240,126,34,.75);opacity:0;\n        transition:transform .36s cubic-bezier(.34,1.3,.5,1),opacity .25s\"><\u002Fdiv>\n      <button class=\"navlink\" data-v=\"datos\" style=\"display:flex;align-items:center;gap:11px;width:100%;padding:13px 22px;border:0;\n        background:transparent;color:var(--sideTx);font-size:14.5px;text-align:left;cursor:pointer;font-family:inherit;\n        transition:background .18s,color .18s,padding-left .22s\" style-hover=\"background:rgba(255,255,255,.08);color:#fff;padding-left:26px\">\n        <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;opacity:.85\"><path d=\"M4 4h16v5H4z\"><\u002Fpath><path d=\"M4 13h16v7H4z\"><\u002Fpath><path d=\"M8 4v5\"><\u002Fpath><\u002Fsvg>\n        <span>Datos<\u002Fspan>\n        <span class=\"ct\" id=\"ctFilas\" style=\"margin-left:auto;font-family:var(--ttl);font-weight:700;font-size:11px;\n          background:rgba(255,255,255,.15);color:#fff;padding:2px 8px;border-radius:999px;min-width:24px;text-align:center;\n          font-variant-numeric:tabular-nums\">0<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"navlink\" data-v=\"dictar\" style=\"display:flex;align-items:center;gap:11px;width:100%;padding:13px 22px;border:0;\n        background:transparent;color:var(--sideTx);font-size:14.5px;text-align:left;cursor:pointer;font-family:inherit;\n        transition:background .18s,color .18s,padding-left .22s\" style-hover=\"background:rgba(255,255,255,.08);color:#fff;padding-left:26px\">\n        <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;opacity:.85\"><rect x=\"9\" y=\"2.5\" width=\"6\" height=\"11\" rx=\"3\"><\u002Frect><path d=\"M5.5 11a6.5 6.5 0 0 0 13 0\"><\u002Fpath><path d=\"M12 17.5V21\"><\u002Fpath><\u002Fsvg>\n        <span>Dictar<\u002Fspan>\n        <span class=\"ct\" id=\"ctDict\" style=\"margin-left:auto;font-family:var(--ttl);font-weight:700;font-size:11px;\n          background:rgba(255,255,255,.15);color:#fff;padding:2px 8px;border-radius:999px;min-width:24px;text-align:center;\n          font-variant-numeric:tabular-nums\">0<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"navlink\" data-v=\"casas\" disabled=\"\" style=\"display:flex;align-items:center;gap:11px;width:100%;padding:13px 22px;border:0;\n        background:transparent;color:var(--sideTx);font-size:14.5px;text-align:left;cursor:pointer;font-family:inherit;opacity:.36;\n        transition:background .18s,color .18s,opacity .25s,padding-left .22s\">\n        <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;opacity:.85\"><path d=\"M3 10.5 12 3l9 7.5\"><\u002Fpath><path d=\"M5 9.5V21h14V9.5\"><\u002Fpath><path d=\"M10 21v-6h4v6\"><\u002Fpath><\u002Fsvg>\n        <span>Domicilios<\u002Fspan>\n        <span class=\"ct\" id=\"ctSel\" style=\"margin-left:auto;font-family:var(--ttl);font-weight:700;font-size:11px;\n          background:rgba(255,255,255,.15);color:#fff;padding:2px 8px;border-radius:999px;min-width:24px;text-align:center;\n          font-variant-numeric:tabular-nums\">0<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"navlink\" data-v=\"ficha\" disabled=\"\" style=\"display:flex;align-items:center;gap:11px;width:100%;padding:13px 22px;border:0;\n        background:transparent;color:var(--sideTx);font-size:14.5px;text-align:left;cursor:pointer;font-family:inherit;opacity:.36;\n        transition:background .18s,color .18s,opacity .25s,padding-left .22s\">\n        <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;opacity:.85\"><path d=\"M12 20h9\"><\u002Fpath><path d=\"M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z\"><\u002Fpath><\u002Fsvg>\n        <span id=\"navEdTxt\">Editar ficha<\u002Fspan>\n        <span class=\"ct\" id=\"ctEd\" style=\"margin-left:auto;font-family:var(--ttl);font-weight:700;font-size:11px;\n          background:rgba(255,255,255,.15);color:#fff;padding:2px 8px;border-radius:999px;min-width:24px;text-align:center;\n          font-variant-numeric:tabular-nums\">0<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"navlink\" data-v=\"ayuda\" style=\"display:flex;align-items:center;gap:11px;width:100%;padding:13px 22px;border:0;\n        background:transparent;color:var(--sideTx);font-size:14.5px;text-align:left;cursor:pointer;font-family:inherit;\n        transition:background .18s,color .18s,padding-left .22s\" style-hover=\"background:rgba(255,255,255,.08);color:#fff;padding-left:26px\">\n        <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:none;opacity:.85\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .9-1 1.6v.4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>\n        <span>C\u00f3mo se usa<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fnav>\n\n    <div style=\"padding:16px 22px 18px;border-top:1px solid rgba(255,255,255,.12);position:relative\">\n      <div style=\"font-size:13px;color:#fff;font-weight:600\">Recuperaci\u00f3n de Vivienda<\u002Fdiv>\n      <div style=\"font-size:12px;color:rgba(255,255,255,.55);margin-top:2px\">Tlajomulco de Z\u00fa\u00f1iga, Jalisco<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n  <div id=\"main\" style=\"flex:1;margin-left:var(--side);min-width:0;display:flex;flex-direction:column\">\n\n    <div style=\"position:sticky;top:0;z-index:60;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;\n      min-height:70px;background:color-mix(in srgb,var(--surf) 82%,transparent);backdrop-filter:blur(14px) saturate(1.4);\n      border-bottom:1px solid var(--brd)\">\n      <button id=\"hamb\" style=\"display:none;width:42px;height:42px;border:1px solid var(--brd);border-radius:11px;\n        background:var(--surf);color:var(--azul);cursor:pointer;place-items:center;flex:none\">\n        <svg width=\"19\" height=\"19\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M3 6h18M3 12h18M3 18h18\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n      <div id=\"tbHead\" style=\"min-width:0\">\n        <h2 id=\"tbTitulo\" style=\"margin:0;font-family:var(--ttl);font-weight:700;font-size:21px;color:var(--tx);letter-spacing:-.02em\">Datos<\u002Fh2>\n        <div id=\"tbSub\" style=\"font-size:12.5px;color:var(--tx3);margin-top:1px\">Sube el Excel que bajas de Drive<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"flex:1\"><\u002Fdiv>\n      <div id=\"pillEstado\" style=\"display:none;align-items:center;gap:8px;padding:7px 14px;border-radius:999px;\n        background:var(--okL);color:var(--ok);font-size:12.5px;font-weight:700\"><\u002Fdiv>\n      <button id=\"btnTema\" title=\"Cambiar tema\" style=\"width:42px;height:42px;border:1px solid var(--brd);border-radius:12px;\n        background:var(--surf);color:var(--tx2);cursor:pointer;display:grid;place-items:center;flex:none;\n        transition:background .18s,color .18s,transform .18s\" style-hover=\"color:var(--nar2);transform:rotate(-14deg)\">\n        <svg id=\"icoTema\" width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4.2\"><\u002Fcircle><path d=\"M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4\"><\u002Fpath><\u002Fsvg>\n      <\u002Fbutton>\n      <button id=\"btnAyuda\" class=\"solo-esc\" style=\"display:inline-flex;align-items:center;gap:7px;padding:10px 16px;min-height:42px;\n        border:1px solid var(--brd);border-radius:12px;background:var(--surf);color:var(--tx2);font-weight:600;font-size:13.5px;\n        cursor:pointer;transition:.18s\" style-hover=\"color:var(--nar2);border-color:var(--nar)\">C\u00f3mo se usa<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div id=\"contenido\" style=\"padding:24px;flex:1;padding-bottom:120px;max-width:1560px;width:100%\">\n\n      <!-- ================= DATOS ================= -->\n      <div class=\"view\" id=\"v-datos\">\n\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;margin-bottom:20px\">\n          <div style=\"grid-column:1/-1;position:relative;overflow:hidden;border-radius:18px;padding:26px 28px;\n            background:linear-gradient(122deg,var(--sideA),var(--sideB));box-shadow:var(--sh2);animation:tq-up .5s cubic-bezier(.2,.7,.3,1) both\">\n            <img src=\"2ea9d9ae-6484-4dc9-afc9-8e7dfb28f2e1\" alt=\"\" aria-hidden=\"true\" width=\"1390\" height=\"704\" style=\"position:absolute;right:-34px;top:-30px;width:290px;height:auto;opacity:.1\">\n            <div style=\"position:relative;max-width:620px\">\n              <div style=\"display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;\n                background:rgba(240,126,34,.22);border:1px solid rgba(240,126,34,.42);color:#FFC48F;font-size:10.5px;\n                font-weight:700;letter-spacing:.1em;text-transform:uppercase\">Del Drive al PDF<\u002Fdiv>\n              <h3 id=\"heroTit\" style=\"margin:13px 0 0;font-family:var(--ttl);font-weight:700;font-size:26px;color:#fff;letter-spacing:-.025em;line-height:1.2;text-wrap:pretty\">\n                Las cuadrillas capturan en AppSheet. T\u00fa solo bajas el archivo y sacas los papeles.<\u002Fh3>\n              <p id=\"heroSub\" style=\"margin:9px 0 0;font-size:14px;color:rgba(255,255,255,.7);line-height:1.6;text-wrap:pretty\">\n                Sube el Excel actualizado, elige los domicilios y genera el PDF.<\u002Fp>\n\n              <div style=\"margin-top:20px\">\n                <div style=\"font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;\n                  color:rgba(255,255,255,.55);margin-bottom:8px\">Qu\u00e9 vas a imprimir<\u002Fdiv>\n                <div id=\"doctipoHero\" style=\"display:inline-flex;gap:4px;padding:4px;border-radius:14px;\n                  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);flex-wrap:wrap\">\n                  <button class=\"doctab doctab-hero\" data-doc=\"ficha\" data-on=\"1\">\n                    Ficha de seguimiento<small>una hoja por domicilio<\u002Fsmall><\u002Fbutton>\n                  <button class=\"doctab doctab-hero\" data-doc=\"caratula\" data-on=\"0\">\n                    Car\u00e1tula de expediente<small>dos por hoja, se cortan<\u002Fsmall><\u002Fbutton>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display:flex;align-items:center;gap:0;margin-bottom:22px;padding:0 4px\" id=\"stepper\">\n          <div class=\"stp\" data-s=\"1\" style=\"display:flex;align-items:center;gap:11px;flex:none\">\n            <div class=\"stpN\" style=\"width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;\n              background:var(--surf);border:2px solid var(--brd2);color:var(--tx3);font-family:var(--ttl);font-weight:700;font-size:14px;\n              transition:.3s cubic-bezier(.34,1.3,.5,1)\">1<\u002Fdiv>\n            <div class=\"stpT\" style=\"font-size:13px;font-weight:600;color:var(--tx3);transition:color .3s;white-space:nowrap\">El archivo<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"stpL\" style=\"flex:1;height:3px;margin:0 14px;border-radius:3px;background:var(--brd);position:relative;overflow:hidden;min-width:20px\">\n            <i style=\"position:absolute;inset:0;width:0%;background:var(--nar);transition:width .5s cubic-bezier(.4,0,.2,1);display:block\"><\u002Fi>\n          <\u002Fdiv>\n          <div class=\"stp\" data-s=\"2\" style=\"display:flex;align-items:center;gap:11px;flex:none\">\n            <div class=\"stpN\" style=\"width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;\n              background:var(--surf);border:2px solid var(--brd2);color:var(--tx3);font-family:var(--ttl);font-weight:700;font-size:14px;\n              transition:.3s cubic-bezier(.34,1.3,.5,1)\">2<\u002Fdiv>\n            <div class=\"stpT\" style=\"font-size:13px;font-weight:600;color:var(--tx3);transition:color .3s;white-space:nowrap\">La hoja<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"stpL\" style=\"flex:1;height:3px;margin:0 14px;border-radius:3px;background:var(--brd);position:relative;overflow:hidden;min-width:20px\">\n            <i style=\"position:absolute;inset:0;width:0%;background:var(--nar);transition:width .5s cubic-bezier(.4,0,.2,1);display:block\"><\u002Fi>\n          <\u002Fdiv>\n          <div class=\"stp\" data-s=\"3\" style=\"display:flex;align-items:center;gap:11px;flex:none\">\n            <div class=\"stpN\" style=\"width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;\n              background:var(--surf);border:2px solid var(--brd2);color:var(--tx3);font-family:var(--ttl);font-weight:700;font-size:14px;\n              transition:.3s cubic-bezier(.34,1.3,.5,1)\">3<\u002Fdiv>\n            <div class=\"stpT\" style=\"font-size:13px;font-weight:600;color:var(--tx3);transition:color .3s;white-space:nowrap\">Las columnas<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"p1\" style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);\n          margin-bottom:16px;overflow:hidden;transition:box-shadow .3s,border-color .3s\">\n          <header style=\"display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--brd);background:var(--surf2)\">\n            <span style=\"font-family:var(--ttl);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--nar2)\">Paso 1<\u002Fspan>\n            <h3 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx);letter-spacing:-.01em\">El archivo de Drive<\u002Fh3>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <div id=\"st1\" style=\"font-size:12.5px;color:var(--tx3);text-align:right\">Sin archivo<\u002Fdiv>\n          <\u002Fheader>\n          <div style=\"padding:20px\">\n            <div id=\"drop\" style=\"border:2px dashed var(--brd2);border-radius:14px;background:var(--surf2);padding:34px 20px;\n              text-align:center;cursor:pointer;transition:border-color .2s,background .2s,transform .2s;position:relative;overflow:hidden\">\n              <svg width=\"42\" height=\"42\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--nar)\" stroke-width=\"1.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"animation:tq-float 3.4s ease-in-out infinite\">\n                <path d=\"M20.5 15.5A4.2 4.2 0 0 0 18.6 8h-1.3A6.6 6.6 0 1 0 5.4 14\"><\u002Fpath>\n                <path d=\"M12 12v9\"><\u002Fpath><path d=\"m8.5 15.5 3.5-3.5 3.5 3.5\"><\u002Fpath>\n              <\u002Fsvg>\n              <b style=\"display:block;margin-top:12px;font-family:var(--ttl);font-weight:700;font-size:17px;color:var(--tx);letter-spacing:-.01em\">Arrastra aqu\u00ed el Excel de la bit\u00e1cora<\u002Fb>\n              <span style=\"display:block;font-size:12.5px;color:var(--tx3);margin-top:5px\">.xlsx o .csv \u00b7 desde Google Sheets: Archivo \u2192 Descargar \u2192 Microsoft Excel<\u002Fspan>\n              <!-- El ojo busca botones, no recuadros punteados: sin \u00e9ste, el \u00fanico\n                   bot\u00f3n a la vista era el del archivo opcional de abajo. -->\n              <span style=\"display:inline-flex;align-items:center;min-height:42px;margin-top:14px;padding:11px 22px;\n                border-radius:12px;background:var(--nar);color:#fff;font-weight:700;font-size:14px;\n                box-shadow:var(--shN)\">Elegir el Excel<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"file\" id=\"file\" accept=\".xlsx,.csv,.txt\" hidden=\"hidden\">\n            <div id=\"err1\"><\u002Fdiv>\n            <div style=\"margin-top:17px;padding-top:15px;border-top:1px solid var(--brd);display:flex;align-items:center;gap:12px;flex-wrap:wrap\">\n              <div style=\"flex:1;min-width:230px\">\n                <b style=\"display:block;font-size:13.5px;color:var(--tx)\">Control de obra\n                  <span style=\"font-weight:500;color:var(--tx3)\">\u00b7 opcional<\u002Fspan><\u002Fb>\n                <span style=\"display:block;font-size:12.5px;color:var(--tx3);margin-top:3px;line-height:1.55\">\n                  Si subes el Excel de tapeados, la etapa 3 de la ficha se llena sola: materiales, medidas y total.<\u002Fspan>\n              <\u002Fdiv>\n              <button id=\"obraBtn\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 15px;\n                border:1px solid var(--brd2);border-radius:11px;background:var(--surf);color:var(--tx2);font-weight:600;\n                font-size:13px;cursor:pointer;transition:.18s\" style-hover=\"border-color:var(--nar);color:var(--nar2)\">Elegir el de tapeados<\u002Fbutton>\n              <button id=\"obraQuita\" style=\"display:none;align-items:center;min-height:38px;padding:8px 13px;border:0;\n                border-radius:11px;background:transparent;color:var(--tx3);font-weight:600;font-size:13px;cursor:pointer\">Quitar<\u002Fbutton>\n              <input type=\"file\" id=\"obraFile\" accept=\".xlsx,.csv,.txt\" hidden=\"hidden\">\n              <div id=\"obraSt\" style=\"flex-basis:100%;font-size:12.5px;color:var(--tx3);line-height:1.55\"><\u002Fdiv>\n            <\u002Fdiv>\n            <div id=\"sk1\" style=\"display:none;margin-top:16px\">\n              <div class=\"sk\" style=\"width:38%;margin-bottom:11px\"><\u002Fdiv>\n              <div class=\"sk\" style=\"width:88%;margin-bottom:9px\"><\u002Fdiv>\n              <div class=\"sk\" style=\"width:72%;margin-bottom:9px\"><\u002Fdiv>\n              <div class=\"sk\" style=\"width:80%\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"p2\" style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);\n          margin-bottom:16px;overflow:hidden;opacity:.45;pointer-events:none;transition:opacity .35s,box-shadow .3s\">\n          <header style=\"display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--brd);background:var(--surf2)\">\n            <span style=\"font-family:var(--ttl);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--nar2)\">Paso 2<\u002Fspan>\n            <h3 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx);letter-spacing:-.01em\">La hoja correcta<\u002Fh3>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <div id=\"st2\" style=\"font-size:12.5px;color:var(--tx3);text-align:right\">\u2014<\u002Fdiv>\n          <\u002Fheader>\n          <div style=\"padding:0 20px;font-size:13px;color:var(--tx2);line-height:1.6;text-wrap:pretty;margin-top:16px\">\n            Cuando subas el archivo, aqu\u00ed te digo qu\u00e9 hoja abr\u00ed y en qu\u00e9 fila encontr\u00e9 los encabezados. C\u00e1mbialos s\u00f3lo si le atin\u00e9 mal.\n          <\u002Fdiv>\n          <div style=\"padding:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;align-items:end\">\n            <label style=\"display:block\"><span style=\"display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--tx3);margin-bottom:6px\">Hoja del libro<\u002Fspan><sc-raw-select id=\"sheetsel\"><\u002Fsc-raw-select><\u002Flabel>\n            <label style=\"display:block\"><span style=\"display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.11em;color:var(--tx3);margin-bottom:6px\">Fila de encabezados<\u002Fspan><input type=\"number\" id=\"headerrow\" min=\"1\" value=\"1\"><\u002Flabel>\n            <button id=\"loadsheet\" style=\"width:100%;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;\n              padding:11px 18px;border:0;border-radius:12px;background:var(--azul);color:#fff;font-weight:700;font-size:14px;cursor:pointer;\n              box-shadow:0 6px 18px rgba(30,74,114,.28);transition:transform .16s,box-shadow .16s,filter .16s\" style-hover=\"transform:translateY(-2px);box-shadow:0 10px 26px rgba(30,74,114,.36)\" style-active=\"transform:translateY(0)\">Leer esta hoja<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div id=\"p3\" style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);\n          margin-bottom:16px;overflow:hidden;opacity:.45;pointer-events:none;transition:opacity .35s,box-shadow .3s\">\n          <header style=\"display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--brd);background:var(--surf2)\">\n            <span style=\"font-family:var(--ttl);font-weight:700;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--nar2)\">Paso 3<\u002Fspan>\n            <h3 style=\"margin:0;font-family:var(--ttl);font-size:16px;font-weight:700;color:var(--tx);letter-spacing:-.01em\">Empatar columnas<\u002Fh3>\n            <div style=\"flex:1\"><\u002Fdiv>\n            <div id=\"st3\" style=\"font-size:12.5px;color:var(--tx3);text-align:right\">\u2014<\u002Fdiv>\n            <button id=\"vermapeo\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:36px;padding:7px 13px;\n              border:1px solid var(--brd2);border-radius:10px;background:var(--surf);color:var(--tx2);font-weight:600;font-size:12.5px;\n              cursor:pointer;transition:.18s\" style-hover=\"border-color:var(--nar);color:var(--nar2)\">Revisar columnas<\u002Fbutton>\n          <\u002Fheader>\n\n          <div style=\"padding:18px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap\">\n            <p id=\"p3nota\" style=\"margin:0;flex:1;min-width:230px;font-size:13.5px;color:var(--tx2);line-height:1.6;text-wrap:pretty\"><\u002Fp>\n            <button id=\"tocasas\" style=\"display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:12px 22px;border:0;\n              border-radius:13px;background:var(--nar);color:#fff;font-weight:700;font-size:14.5px;cursor:pointer;flex:none;\n              box-shadow:var(--shN);transition:transform .16s,box-shadow .16s\" style-hover=\"transform:translateY(-2px);box-shadow:0 12px 30px rgba(240,126,34,.44)\" style-active=\"transform:translateY(0)\">\n              <span id=\"tocasasTxt\">Ver domicilios<\u002Fspan>\n              <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h13\"><\u002Fpath><path d=\"m12.5 5.5 6.5 6.5-6.5 6.5\"><\u002Fpath><\u002Fsvg>\n            <\u002Fbutton>\n          <\u002Fdiv>\n\n          <div id=\"p3det\" style=\"display:none;padding:0 20px 20px;border-top:1px solid var(--brd)\">\n            <p style=\"margin:16px 0;font-size:13px;color:var(--tx2);line-height:1.6;text-wrap:pretty\">\n              Lo que reconoc\u00ed sale en naranja. Corrige lo que haga falta; lo que dejes en\n              <b style=\"color:var(--tx)\">\u2014 vac\u00edo \u2014<\u002Fb> queda como l\u00ednea en blanco en la ficha para llenar a mano.\n            <\u002Fp>\n            <div id=\"avisoform\"><\u002Fdiv>\n            <div style=\"display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin-bottom:8px\">\n              <button id=\"savemap\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 14px;\n                border:1px solid var(--brd2);border-radius:11px;background:var(--surf);color:var(--tx2);font-weight:600;font-size:13px;\n                cursor:pointer;transition:.18s\" style-hover=\"border-color:var(--nar);color:var(--nar2)\">Recordar esta configuraci\u00f3n<\u002Fbutton>\n              <button id=\"clearmap\" style=\"display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:8px 14px;\n                border:1px solid transparent;border-radius:11px;background:transparent;color:var(--tx3);font-weight:600;font-size:13px;\n                cursor:pointer;transition:.18s\" style-hover=\"background:var(--surf2);color:var(--tx2)\">Limpiar todo<\u002Fbutton>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <label style=\"display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);cursor:pointer;font-weight:500\">\n                <input type=\"checkbox\" id=\"autocalc\" checked=\"checked\"> Calcular Total a Pagar = Honorario + Bono\n              <\u002Flabel>\n            <\u002Fdiv>\n            <div id=\"maps\"><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ================= DOMICILIOS ================= -->\n      <div class=\"view\" id=\"v-casas\" style=\"display:none\">\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(212px,1fr));gap:16px;margin-bottom:18px\">\n          <div class=\"kpi\" style=\"position:relative;overflow:hidden;background:var(--surf);border:1px solid var(--brd);border-radius:16px;\n            padding:17px 19px;box-shadow:var(--sh1);transition:transform .22s,box-shadow .22s\" style-hover=\"transform:translateY(-3px);box-shadow:var(--sh2)\">\n            <div style=\"position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--azul);opacity:.55\"><\u002Fdiv>\n            <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3)\">Domicilios<\u002Fdiv>\n            <div id=\"kTot\" class=\"kpiNum\" style=\"font-family:var(--ttl);font-weight:700;font-size:30px;line-height:1.12;color:var(--azul);margin-top:7px;\n              font-variant-numeric:tabular-nums;letter-spacing:-.03em\">0<\u002Fdiv>\n            <div class=\"kpiPie\" style=\"font-size:12px;color:var(--tx3);margin-top:3px\">en el archivo<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"kpi\" style=\"position:relative;overflow:hidden;background:var(--surf);border:1px solid var(--nar);border-radius:16px;\n            padding:17px 19px;box-shadow:var(--shN);transition:transform .22s,box-shadow .22s\" style-hover=\"transform:translateY(-3px)\">\n            <div style=\"position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--nar)\"><\u002Fdiv>\n            <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--nar2)\">Seleccionados<\u002Fdiv>\n            <div id=\"kSel\" class=\"kpiNum\" style=\"font-family:var(--ttl);font-weight:700;font-size:30px;line-height:1.12;color:var(--nar);margin-top:7px;\n              font-variant-numeric:tabular-nums;letter-spacing:-.03em\">0<\u002Fdiv>\n            <div class=\"kpiPie\" style=\"font-size:12px;color:var(--tx3);margin-top:3px\">saldr\u00e1n en el PDF<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"kpi\" style=\"position:relative;overflow:hidden;background:var(--surf);border:1px solid var(--brd);border-radius:16px;\n            padding:17px 19px;box-shadow:var(--sh1);transition:transform .22s,box-shadow .22s\" style-hover=\"transform:translateY(-3px);box-shadow:var(--sh2)\">\n            <div style=\"position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--ok);opacity:.55\"><\u002Fdiv>\n            <div style=\"font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3)\">Con cambios<\u002Fdiv>\n            <div id=\"kEd\" class=\"kpiNum\" style=\"font-family:var(--ttl);font-weight:700;font-size:30px;line-height:1.12;color:var(--azul);margin-top:7px;\n              font-variant-numeric:tabular-nums;letter-spacing:-.03em\">0<\u002Fdiv>\n            <div class=\"kpiPie\" style=\"font-size:12px;color:var(--tx3);margin-top:3px\">los que corregiste aqu\u00ed<\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"kpi\" style=\"position:relative;overflow:hidden;background:var(--surf);border:1px solid var(--brd);border-radius:16px;\n            padding:17px 19px;box-shadow:var(--sh1);transition:transform .22s,box-shadow .22s\" style-hover=\"transform:translateY(-3px);box-shadow:var(--sh2)\">\n            <div style=\"position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tx3);opacity:.4\"><\u002Fdiv>\n            <div style=\ \"edNota\" style=\"margin:13px 0 0;font-size:12.5px;color:var(--tx3);line-height:1.6;text-wrap:pretty\">\n            Lo que escribas aqu\u00ed queda atado a este domicilio y se guarda solo en este navegador.\n            Los campos en blanco vienen vac\u00edos del archivo: ll\u00e9nalos aqu\u00ed o d\u00e9jalos como l\u00ednea para firmar a mano.\n          <\u002Fp>\n        <\u002Fdiv>\n\n        <div id=\"split\" style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,540px);gap:16px;align-items:start\">\n          <div style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);padding:20px;min-width:0\">\n            <div id=\"edTitulo\" style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3);margin-bottom:6px\">Datos de la ficha<\u002Fdiv>\n            <div id=\"editor\"><\u002Fdiv>\n          <\u002Fdiv>\n          <div id=\"previaCard\" style=\"background:var(--surf);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--sh1);\n            overflow:hidden;position:sticky;top:90px;min-width:0\">\n            <div style=\"padding:14px 18px;border-bottom:1px solid var(--brd);display:flex;align-items:center;gap:10px;background:var(--surf2)\">\n              <span style=\"font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.12em;color:var(--tx3)\">Vista previa<\u002Fspan>\n              <div style=\"flex:1\"><\u002Fdiv>\n              <button id=\"zoomOut\" style=\"width:32px;height:32px;border:1px solid var(--brd2);border-radius:9px;background:var(--surf);\n                color:var(--tx2);cursor:pointer;font-weight:700;transition:.18s\" style-hover=\"border-color:var(--nar);color:var(--nar2)\">\u2212<\u002Fbutton>\n              <span id=\"zoomTxt\" style=\"font-size:12px;color:var(--tx3);font-variant-numeric:tabular-nums;min-width:38px;text-align:center\">62%<\u002Fspan>\n              <button id=\"zoomIn\" style=\"width:32px;height:32px
